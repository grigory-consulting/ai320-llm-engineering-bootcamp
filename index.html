                    fitElement(element, 1, 1000);

        function fitElement(element, start, end) {

            let size = (end + start) / 2;
            element.style.fontSize = `${size}px`;

                while (element.scrollHeight > element.offsetHeight) {
                    size--;
                    element.style.fontSize = `${size}px`;
                }
                return;
            }

            if (element.scrollHeight > element.offsetHeight) {
                fitElement(element, start, size);
            } else {
                fitElement(element, size, end);
            }

## Was Sie mitnehmen

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Transformer verstehen:** Self-Attention, Multi-Head-Attention und Positionsinformation erklären und die passende Architekturvariante für eine Aufgabe wählen. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Daten und Tokenizer vorbereiten:** einen Trainingskorpus technisch aufbereiten (PII, Dubletten, Provenienz) und einen Tokenizer dazu trainieren und bewerten. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Trainieren:** einen kleinen Transformer reproduzierbar trainieren, den Lauf überwachen und Instabilitäten diagnostizieren. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Entscheiden:** zwischen Training von Grund auf, Fine-Tuning, PEFT und RAG begründet wählen und die Wahl mit Perplexity, Aufgabenmetriken und Baselines belegen. 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->**Skalierung und Multimodalität:** DDP, FSDP und Slurm einordnen und einen Ansatz für größere Trainingsläufe wählen. Mit CLIP Bilder anhand von Textbeschreibungen zuordnen. 
- &shy;<!-- .element: class="fragment" data-fragment-index="6" -->**Ausliefern:** Quantisierung und Serving messen (Speicher, Latenz, Durchsatz, Qualität) und ein betriebsfähiges, sicheres LLM-System kostenbewusst planen.

## Das künstliche Neuron: Gewichte, Bias, Aktivierung

<img src="figs/d_t09_neuron.png" alt="" style="object-fit: scale-down">


- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Eingaben** `x`: die Merkmale, zum Beispiel Spalten einer Tabelle 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Gewichte** `w`: wie stark eine Eingabe weitergegeben wird 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Bias** `b`: verschiebt die Schwelle, ab der das Neuron anspricht 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Summation**: `z` ist die gewichtete Summe plus Bias 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->**Aktivierung**: eine Funktion `f` macht aus `z` den Ausgabewert `a` 

<div class="tipp fragment" data-fragment-index="6">

Gewichte und Bias sind die Parameter, die das Training anpasst. Die Eingaben kommen aus den Daten.

</div>
</div>

</script></section><section data-separator="?

## Vom Neuron zum Netz

<img src="figs/d_t09_netz_klassisch.png" alt="" style="max-height: 340px; object-fit: scale-down">


- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Jeder Kreis ab der ersten versteckten Schicht ist ein Neuron, jede Linie ein Gewicht. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Feed-Forward:** von der Eingabe über versteckte Schichten zur Ausgabe, ohne Rückkopplung. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Vollständig verbunden:** Jedes Neuron einer Schicht hängt an jedem Neuron der nächsten. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Dieses kleine Netz hat schon 3·4 + 4·4 + 4·2 = 36 Gewichte und 10 Bias-Werte.
</div>

</script></section><section data-separator="?

## Aktivierungsfunktionen

| Funktion | Formel | Wertebereich | Typischer Einsatz |
|---|---|---|---|
| **ReLU** | `max(0, z)` | 0 bis unendlich | versteckte Schichten |
| **Sigmoid** | `1 / (1 + exp(-z))` | 0 bis 1 | ein Ausgabeneuron bei zwei Klassen |
| **Softmax** | `exp(z_i) / Summe aller exp(z_j)` | 0 bis 1, Summe 1 | Ausgabe bei mehreren Klassen, auch bei zwei Logits |

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Ohne Aktivierung bleibt ein Netz aus vielen Schichten insgesamt eine lineare Funktion. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->ReLU setzt negative Werte auf 0: schnell zu berechnen und gut für das Training. 

<div class="warn fragment" data-fragment-index="3">

`nn.CrossEntropyLoss` rechnet Softmax schon mit ein. Die letzte Schicht gibt deshalb rohe Werte aus (**Logits**), ohne Softmax-Schicht dahinter.

</div>
</div>

</script></section><section data-separator="?

## Verlustfunktionen

Die Verlustfunktion misst mit einer einzigen Zahl, wie schlecht die Vorhersagen sind. Das Training macht diese Zahl kleiner.

| Verlust | In einem Satz | PyTorch |
|---|---|---|
| **MSE** | Mittelwert der quadrierten Abstände zwischen Vorhersage und wahrem Wert, für Regression | `nn.MSELoss()` |
| **Cross-Entropy** | Abstand zwischen vorhergesagten Klassenwahrscheinlichkeiten und wahren Labels | `nn.CrossEntropyLoss()` |

<div class="tipp fragment" data-fragment-index="1">

Cross-Entropy bestraft große Abweichungen stark: Eine falsche Vorhersage mit hoher Sicherheit kostet viel mehr als eine unsichere.

</div>
</div>

## Gradientenabstieg als Idee

<img src="figs/gradientenabstieg_idee.png" alt="" style="object-fit: scale-down">


- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Der Gradient zeigt in die Richtung des stärksten Anstiegs, also gehen wir in die Gegenrichtung. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Update-Regel: $\\theta \\leftarrow \\theta - \\eta \\, \\nabla\_\\theta L$ mit **Lernrate** $\\eta$; $\\theta$ sind alle Gewichte und Bias-Werte, $L$ der Verlust. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Wiederholen, bis sich kaum noch etwas ändert.
</div>

## Training als Schleife

<img src="figs/d_t09_training_schleife.png" alt="" style="object-fit: scale-down">


- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Vorwärtslauf:** Eingaben laufen durch das Netz, am Ende steht eine Vorhersage. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Verlust:** Vergleich von Vorhersage und wahrem Wert. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Rückwärtslauf** (Backpropagation): für jedes Gewicht ausrechnen, wie es den Verlust verändert. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Schritt des Optimizers:** jedes Gewicht ein kleines Stück so verschieben, dass der Verlust sinkt.
</div>

## Epoche, Batch, Lernrate und Optimizer

| Begriff | Bedeutung | Im Code |
|---|---|---|
| **Batch** | kleine Gruppe von Beispielen, auf der ein Gradient berechnet wird | `batch_size=32` |
| **Epoche** | ein vollständiger Durchlauf durch alle Trainingsdaten | `for epoch in ...` |
| **Lernrate** | Schrittweite, mit der die Gewichte angepasst werden | `lr=1e-2` |
| **SGD** | Gradientenabstieg auf Batches mit fester Lernrate | `optim.SGD(...)` |
| **Adam** | Weiterentwicklung von SGD, passt die Schrittweite je Gewicht selbst an | `optim.Adam(...)` |
</div>

</script></section><section data-separator="?

## Overfitting und Underfitting

<img src="figs/overfitting_polynom.png" alt="" style="object-fit: scale-down">


- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Underfitting:** Das Modell ist zu einfach und erfasst das Muster nicht. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Overfitting:** Das Modell lernt das Rauschen der Trainingsdaten auswendig: sehr gut im Training, schlecht auf neuen Daten. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Das Erkennungszeichen: Der Verlust auf den Trainingsdaten sinkt weiter, der auf den Validierungsdaten steigt.
</div>

## PyTorch: Tensoren anlegen und rechnen

```python
import torch

x = torch.tensor([1, 2, 3])          # Tensor = n-dimensionales Array
random_tensor = torch.rand(2, 3)     # 2 Zeilen, 3 Spalten
print(random_tensor.shape, random_tensor.dtype)  # -> torch.Size([2, 3]) torch.float32

ones = torch.ones(2, 3)
print(x + ones)                      # Broadcasting wie in NumPy
# -> tensor([ [2., 3., 4.], [2., 3., 4.] ])

a = torch.tensor([ [1., 2], [3, 4] ])
b = torch.tensor([ [5., 6], [7, 8] ])
print(a @ b)      # Matrizenmultiplikation -> [ [19., 22.], [43., 50.] ]
print(a * b)      # elementweise           -> [ [ 5., 12.], [21., 32.] ]
```

<div class="fragment" data-fragment-index="1">

Ein Tensor verhält sich wie ein NumPy-Array. Zusätzlich kann er Gradienten mitführen und auf einer Grafikkarte liegen.

</div>
</div>

</script></section><section data-separator="?

## Tensoren, NumPy und device

```python
import numpy as np

arr = np.array([ [1.0, 2.0], [3.0, 4.0] ])
t = torch.from_numpy(arr)            # NumPy -> Tensor, teilt den Speicher
print(t.dtype)                       # -> torch.float64
t = t.float()                        # float32, wie es nn.Linear erwartet

device = torch.device("cpu")         # oder "cuda", "mps"
t = t.to(device)
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->`cpu`: Prozessor, läuft überall 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->`cuda`: NVIDIA-Grafikkarte 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->`mps`: Grafikeinheit in Apple-Silicon-Rechnern 

<div class="warn fragment" data-fragment-index="4">

NumPy rechnet mit `float64`, die Schichten in PyTorch mit `float32`. Ohne `.float()` bricht der Vorwärtslauf mit einem Typfehler ab.

</div>
</div>

</script></section><section data-separator="?

## Autograd an einer kleinen Funktion

```python
x = torch.tensor(2.0, requires_grad=True)   # Gradienten mitführen

y = x**2 + 3*x + 5                          # f(x)
y.backward()                                # Ableitung berechnen

print(x.grad)                               # -> tensor(7.)
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Von Hand: `f'(x) = 2*x + 3`, also `f'(2.0) = 7.0` 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->`requires_grad=True`: PyTorch merkt sich jede Berechnung, an der `x` beteiligt ist. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->`backward()` durchläuft diese Berechnungen rückwärts und legt die Ableitung in `x.grad` ab.
</div>

<p class="eyebrow">Grundlagen · Deep Learning und PyTorch</p>

## Ein einzelner Trainingsschritt

```python
import torch.nn as nn
import torch.optim as optim

torch.manual_seed(1)
net = nn.Linear(10, 1)                      # 10 Eingänge, 1 Ausgang: Wx + b
loss_fn = nn.MSELoss()
optimizer = optim.SGD(net.parameters(), lr=1e-1)

x = torch.rand(10)                          # Eingabevektor
y = torch.ones(1)                           # Ziel: das Netz soll 1 ausgeben

loss = loss_fn(net(x), y)                   # Vorwärtslauf und Verlust
print(f"Verlust vorher:  {loss.item():.4f}")   # -> 0.5834
loss.backward()                             # Rückwärtslauf
optimizer.step()                            # Gewichte anpassen
print(f"Verlust nachher: {loss_fn(net(x), y).item():.4f}")    # -> 0.0135
```

<div class="fragment" data-fragment-index="1">

Training heißt, diesen Schritt viele tausend Mal zu wiederholen.

</div>
</div>

</script></section><section data-separator="?

<p class="eyebrow">Grundlagen · Deep Learning und PyTorch</p>

## Ein `nn.Module` mit zwei Linearschichten

```python
class Net(nn.Module):
    def __init__(self):
        super().__init__()
        self.layer1 = nn.Linear(10, 32)      # 10 Merkmale -> 32
        self.layer2 = nn.Linear(32, 2)       # 32 -> 2 Klassen

    def forward(self, x):
        x = torch.relu(self.layer1(x))       # x = ReLU(Wx + b)
        return self.layer2(x)                # Logits, ohne Softmax

torch.manual_seed(1)
model = Net()
print(sum(p.numel() for p in model.parameters()))    # -> 418
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->`__init__` legt die Schichten an, `forward` beschreibt den Vorwärtslauf. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Sie rufen `forward` nicht direkt auf, sondern `model(x)`. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->418 Parameter: `10*32 + 32` in der ersten, `32*2 + 2` in der zweiten Schicht.
</div>

</script></section><section data-separator="?

<p class="eyebrow">Grundlagen · Deep Learning und PyTorch</p>

## Die vollständige Trainingsschleife

```python
from torch.utils.data import DataLoader, TensorDataset

X = torch.rand(1000, 10)                     # 1000 Beispiele, 10 Merkmale
y = (X.sum(dim=1) > 5).long()                # Klasse 1, wenn die Summe über 5 liegt
loader = DataLoader(TensorDataset(X[:800], y[:800]), batch_size=32, shuffle=True)

loss_fn = nn.CrossEntropyLoss()
optimizer = optim.Adam(model.parameters(), lr=1e-2)

for epoch in range(5):
    model.train()                            # Trainingsmodus
    for xb, yb in loader:
        optimizer.zero_grad()                # alte Gradienten löschen
        outputs = model(xb)                  # Vorwärtslauf
        loss = loss_fn(outputs, yb)          # Verlust
        loss.backward()                      # Rückwärtslauf
        optimizer.step()                     # Gewichte anpassen
```

<div class="warn fragment" data-fragment-index="1">

Ohne `optimizer.zero_grad()` addiert PyTorch die Gradienten aller Batches auf, und das Training läuft aus dem Ruder.

</div>
</div>

</script></section><section data-separator="?

print((predicted == y[800:]).float().mean()) # -> tensor(0.9600)
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Self-Attention** Schritt für Schritt nachrechnen: Query, Key, Value, Skalierung, Softmax, gewichtete Mittelung 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Multi-Head-Attention** und **kausale Maske** erklären 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Positionsinformation** einordnen: sinusoidal, gelernt, RoPE (Rotary Position Embedding) 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->abschätzen, was **Kontextlänge** kostet, und begründen, warum sich Transformer besser parallelisieren lassen als RNNs 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->für eine Aufgabe die passende **Architekturvariante** wählen: Encoder, Decoder, Encoder-Decoder

## Geschichte: von Dartmouth zu den RNNs

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**1956, Dartmouth Conference:** John McCarthy u. a. begründen das Fach "Artificial Intelligence". 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**1957, Perzeptron:** Rosenblatts künstliches Neuron lernt seine Gewichte aus Beispielen. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**1969, Perceptrons:** Minsky und Papert zeigen, dass ein einzelnes Perzeptron XOR nicht lösen kann. Viele wenden sich von neuronalen Netzen ab. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**1980er, Expertensysteme:** Wissen wird von Hand als Regeln eingepflegt. 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->**1986, Backpropagation:** Mehrschichtige Netze lernen per Gradientenabstieg. 
- &shy;<!-- .element: class="fragment" data-fragment-index="6" -->**1990, Elman-RNN:** Ein rekurrentes Netz verarbeitet Sequenzen und wird mit Backpropagation trainiert. 

<div class="fragment" data-fragment-index="7">

<small>McCarthy et al. 1955 (Antrag zur Konferenz) · Rosenblatt 1957 · Minsky, Papert 1969 · Rumelhart, Hinton, Williams 1986 · Elman 1990</small>

</div>
</div>

## Geschichte: vom LSTM zum Transformer

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**1997, LSTM:** Gates halten Information über viele Schritte im Zustand. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**2012, AlexNet:** Ein achtschichtiges CNN gewinnt den ImageNet-Wettbewerb mit großem Abstand. Deep Learning setzt sich durch. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**2014, Seq2Seq:** Ein LSTM fasst den Satz in einem Vektor zusammen, ein zweites erzeugt daraus die Übersetzung. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**2014, Attention:** Der Decoder sucht sich für jedes Zielwort die passenden Stellen im Quellsatz. 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->**2017, Transformer:** Attention allein, ohne Rekurrenz und ohne Faltung. 
- &shy;<!-- .element: class="fragment" data-fragment-index="6" -->**2018 bis 2020, BERT und GPT-3:** Transformer, auf großen Textmengen vortrainiert. 

<div class="fragment" data-fragment-index="7">

<small>Hochreiter, Schmidhuber 1997 · Krizhevsky et al. 2012 · Sutskever et al. 2014, arXiv:1409.3215 · Bahdanau et al. 2014, arXiv:1409.0473 · Vaswani et al. 2017 · Devlin et al. 2019 · Brown et al. 2020</small>

</div>
</div>

<p class="eyebrow">Teil I · Transformer</p>

## RNN: Kontext läuft durch einen Zustand

$$h\_t = f(h\_{t-1},\\ x\_t)$$

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Das Modell liest Token für Token und fasst alles Bisherige in **einem Zustand** $h\_t$ zusammen. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->In "Der Mieter ist verpflichtet, dem Vermieter die vereinbarte Miete zu entrichten" liegen acht Wörter zwischen "Mieter" und "entrichten": neun Schritte durch den Zustand. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Beim Training läuft der Gradient denselben Weg zurück und kann **verschwinden oder explodieren**. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->LSTM und GRU mildern das mit Gates, der Weg durch den Zustand bleibt. 

<div class="fragment" data-fragment-index="5">

<small>Vaswani et al. 2017, Abschnitt 1 · Pascanu et al. 2013, arXiv:1211.5063</small>

</div>
</div>

<p class="eyebrow">Teil I · Transformer</p>

## Seq2Seq und Attention

<img src="figs/seq2seq-attention.png" alt="" style="object-fit: scale-down">


- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Seq2Seq:** Encoder und Decoder sind nur über einen Vektor fester Größe verbunden. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Attention:** Der Decoder bildet für jedes Zielwort eine neue gewichtete Summe aller Encoder-Zustände. 

<div class="fragment" data-fragment-index="3">

<small>Sutskever et al. 2014, arXiv:1409.3215 · Bahdanau et al. 2014, arXiv:1409.0473</small>

## Transformer 2017: Attention ohne RNN

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Bis dahin lief Attention fast immer zusammen mit einem rekurrenten Netz. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Der Transformer streicht den Zustand und lässt die Tokens einer Sequenz direkt aufeinander achten. 

<div class="merk fragment" data-fragment-index="3">

Zwei Dinge leistete der Zustand bisher: Kontext und Reihenfolge. Den Kontext übernimmt jetzt **Self-Attention**, die Reihenfolge die **Positionsinformation**.

</div>

<div class="fragment" data-fragment-index="4">

<small>Vaswani et al. 2017, Abschnitte 1 und 3.5</small>

</div>
</div>

" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<p class="eyebrow">Teil I · Transformer</p>

## Self-Attention: Tokens holen sich Kontext

<img src="figs/attention-gewichte-satz.png" alt="" style="object-fit: scale-down">


- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Ein Token allein ist mehrdeutig: "entrichten" braucht "Mieter" (wer) und "Miete" (was). 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Self-Attention baut für **jedes** Token eine neue Darstellung aus **allen** Tokens der Sequenz. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Wie stark jedes andere Token beiträgt, berechnet das Modell aus den Daten: ein **Gewicht je Paar**.
</div>

</script></section><section data-separator="?

" data-separator-vertical="?

" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<p class="eyebrow">Teil I · Transformer</p>

## Query, Key, Value

<img src="figs/qkv-projektion.png" alt="" style="object-fit: scale-down">


- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Jeder Token-Vektor $x\_i$ (das Embedding, $d\_\\text{model}$ Einträge) wird dreimal linear projiziert: $q\_i = x\_i W\_Q$, $k\_i = x\_i W\_K$, $v\_i = x\_i W\_V$; $q\_i$ und $k\_i$ haben $d\_k$ Einträge, $v\_i$ hat $d\_v$. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Query:** Wonach sucht dieses Token? **Key:** Wofür ist dieses Token ein Treffer? 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Value:** Was gibt dieses Token weiter, wenn es gewählt wird?
</div>

</script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="smaller drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<p class="eyebrow">Teil I · Transformer</p>

## Scaled Dot-Product Attention

$$\\mathrm{Attention}(Q, K, V) = \\mathrm{softmax}\\!\\left(\\frac{QK^\\top}{\\sqrt{d\_k}}\\right) V$$

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Score:** Skalarprodukt jeder Query mit jedem Key, $QK^\\top$ 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Skalierung:** jeden Score durch $\\sqrt{d\_k}$ teilen 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Softmax** je Zeile: Gewichte $\\ge 0$, Summe 1 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Mittelung:** Gewichte mal Values 

<div class="hinweis fragment" data-fragment-index="5">

Warum $\\sqrt{d\_k}$: Haben die Komponenten von $q$ und $k$ Mittelwert 0 und Varianz 1, hat $q \\cdot k$ die Varianz $d\_k$. Große Scores drücken die Softmax in Bereiche mit sehr kleinen Gradienten; die Division bringt die Varianz auf 1.

</div>

<div class="fragment" data-fragment-index="6">

<small>Vaswani et al. 2017, Attention Is All You Need, arXiv:1706.03762</small>

</div>
</div>

</script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<p class="eyebrow">Teil I · Transformer</p>

## Berechnung an drei Tokens: Scores

Query von "zahlt" in "Der Mieter zahlt", mit $d\_k = 4$, also $\\sqrt{d\_k} = 2$: $q = (1, 0, 1, 0)$

<div class="fragment" data-fragment-index="1">

| Token | Key $k\_j$ | $q \\cdot k\_j$ | $q \\cdot k\_j / \\sqrt{d\_k}$ |
|---|---|---|---|
| Der | (0, 1, 0, 1) | 0 | 0 |
| Mieter | (2, 0, 2, 0) | 4 | 2 |
| zahlt | (1, 0, 1, 0) | 2 | 1 |

</div>

- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->"Mieter" passt am besten zur Query, "Der" gar nicht. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Auch "zahlt" bekommt einen Score: Jedes Token achtet auch auf sich selbst.
</div>

</script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<p class="eyebrow">Teil I · Transformer</p>

## Berechnung an drei Tokens: Gewichte und Ausgabe

| Token | Score $s\_j$ | $e^{s\_j}$ | Gewicht | Value $v\_j$ |
|---|---|---|---|---|
| Der | 0 | 1,00 | 0,09 | (0, 1) |
| Mieter | 2 | 7,39 | 0,67 | (1, 0) |
| zahlt | 1 | 2,72 | 0,24 | (1, 1) |

<div class="fragment" data-fragment-index="1">

$$0{,}09 \\cdot (0, 1) + 0{,}67 \\cdot (1, 0) + 0{,}24 \\cdot (1, 1) = (0{,}91;\\ 0{,}33)$$

</div>

<div class="merk fragment" data-fragment-index="2">

**Attention ist eine gewichtete Mittelung der Values.** Die Gewichte kommen aus der Ähnlichkeit von Query und Key: "zahlt" übernimmt zu zwei Dritteln den Value von "Mieter".

</div>
</div>

</script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<p class="eyebrow">Teil I · Transformer</p>

## Dieselbe Berechnung in PyTorch

```python
import torch
import torch.nn.functional as F

q = torch.tensor([ [1., 0., 1., 0.] ])          # Query von "zahlt"
k = torch.tensor([ [0., 1., 0., 1.],            # Der
                   [2., 0., 2., 0.],            # Mieter
                   [1., 0., 1., 0.] ])          # zahlt
v = torch.tensor([ [0., 1.], [1., 0.], [1., 1.] ])

w = torch.softmax(q @ k.T / k.shape[-1] ** 0.5, dim=-1)
print(w)                                  # tensor([ [0.0900, 0.6652, 0.2447] ])
print(w @ v)                              # tensor([ [0.9100, 0.3348] ])
print(F.scaled_dot_product_attention(q, k, v))   # dasselbe Ergebnis
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Von Hand sind es zwei Zeilen: `softmax(q @ k.T / sqrt(d_k))`, dann `@ v`. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->`F.scaled_dot_product_attention` fasst Score, Skalierung, Softmax und Mittelung in einem Aufruf zusammen.
</div>

</script></section><section data-separator="?

<p class="eyebrow">Teil I · Transformer</p>

## Multi-Head-Attention

<img src="figs/multi-head-attention.png" alt="" style="object-fit: scale-down">


- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->$h$ **Köpfe** berechnen Attention parallel, jeder mit eigenen $W\_Q^i, W\_K^i, W\_V^i$ auf $d\_k = d\_\\text{model}/h$ Dimensionen. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Ausgaben aneinanderhängen, mit $W\_O$ zurück auf $d\_\\text{model}$ projizieren. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Original: $d\_\\text{model} = 512$, $h = 8$, $d\_k = 64$; Aufwand ähnlich wie bei einem Kopf mit voller Breite. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Köpfe achten auf verschiedene Beziehungen; ein einzelner Kopf würde sie zu einem Mittelwert verschmelzen.
</div>

</script></section><section data-separator="?

<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<p class="eyebrow">Teil I · Transformer</p>

## Kausale Maske

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Ein Decoder sagt das **nächste** Token voraus: Position $i$ darf nur Positionen $\\le i$ sehen. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Umsetzung: Scores verbotener Paare vor der Softmax auf $-\\infty$ setzen; ihr Gewicht wird 0. 

<div class="fragment" data-fragment-index="3">

| Query \ Key | Der | Mieter | zahlt |
|---|---|---|---|
| Der | erlaubt | $-\\infty$ | $-\\infty$ |
| Mieter | erlaubt | erlaubt | $-\\infty$ |
| zahlt | erlaubt | erlaubt | erlaubt |

</div>

- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->So berechnen im Training alle Positionen ihre Vorhersage gleichzeitig, ohne in die Zukunft zu sehen.
</div>

</script></section><section data-separator="?

" data-separator-vertical="?

" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<p class="eyebrow">Teil I · Transformer</p>

## Multi-Head mit kausaler Maske in PyTorch

```python
import torch
import torch.nn.functional as F

torch.manual_seed(1)
B, T, d_model, h = 2, 5, 64, 8                  # Batch, Tokens, Breite, Köpfe
x = torch.randn(B, T, d_model)
qkv = torch.nn.Linear(d_model, 3 * d_model)     # W_Q, W_K, W_V in einer Matrix
q, k, v = qkv(x).split(d_model, dim=-1)
# (B, T, d_model) -> (B, h, T, d_k) mit d_k = d_model / h = 8
q, k, v = (t.view(B, T, h, d_model // h).transpose(1, 2) for t in (q, k, v))
y = F.scaled_dot_product_attention(q, k, v, is_causal=True)
y = y.transpose(1, 2).reshape(B, T, d_model)    # Köpfe wieder aneinanderhängen
print(y.shape)                                  # torch.Size([2, 5, 64])
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->`view` und `transpose` teilen $d\_\\text{model} = 64$ in $h = 8$ Köpfe zu je $d\_k = 8$. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->`is_causal=True` setzt die Maske; ohne das Argument sieht jede Position alle anderen.
</div>

</script></section><section data-separator="?

<p class="eyebrow">Teil I · Transformer</p>

## Ohne Position keine Reihenfolge

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Attention ohne Maske behandelt die Eingabe wie eine **Menge**: Vertauschte Tokens liefern dieselben Gewichte, nur vertauscht. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->"Der Mieter zahlt dem Vermieter" und "Der Vermieter zahlt dem Mieter" sähen ohne Positionsinformation gleich aus. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Drei verbreitete Lösungen: 
  + **sinusoidal:** feste Sinus- und Kosinuswellen zum Embedding addieren (Vaswani et al. 2017)
  + **gelernt:** ein trainiertes Embedding je Position (GPT-1)
  + **RoPE:** Query und Key je nach Position drehen (Su et al. 2021, verwendet in LLaMA)
</div>

</script></section><section data-separator="?

<p class="eyebrow">Teil I · Transformer</p>

## Sinusoidal und gelernt

<img src="figs/sinus-positionskodierung.png" alt="" style="object-fit: scale-down">


$$PE\_{(pos,\\,2i)} = \\sin\\!\\left(\\frac{pos}{10000^{2i/d\_\\text{model}}}\\right), \\qquad PE\_{(pos,\\,2i+1)} = \\cos\\!\\left(\\frac{pos}{10000^{2i/d\_\\text{model}}}\\right)$$

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Jede Dimension schwingt mit eigener Frequenz; die Wellenlängen reichen von $2\\pi$ bis $10000 \\cdot 2\\pi$. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Gelernte Positionsembeddings lieferten im Original **nahezu gleiche** Ergebnisse. Vaswani et al. wählten die Sinusform, weil sie über die Trainingslänge hinaus funktionieren könnte; eine gelernte Tabelle endet bei der Trainingslänge.
</div>

</script></section><section data-separator="?

<p class="eyebrow">Teil I · Transformer</p>

## RoPE: Position als Drehung

<img src="figs/rope-rotation.png" alt="" style="object-fit: scale-down">


- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Je zwei Dimensionen von $q$ und $k$ bilden eine Ebene; RoPE dreht sie an Position $m$ um $m\\theta\_i$, mit $\\theta\_i = 10000^{-2i/d}$. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Das Skalarprodukt hängt dann nur vom **Abstand** ab: $\\langle R\_m q,\\, R\_n k \\rangle = \\langle q,\\, R\_{n-m}\\, k \\rangle$. 

<div class="fragment" data-fragment-index="3">

<small>Su et al. 2021, RoFormer, arXiv:2104.09864 · Touvron et al. 2023, LLaMA, arXiv:2302.13971</small>

</div>
</div>

</script></section><section data-separator="?

<p class="eyebrow">Teil I · Transformer</p>

## Kontextlänge kostet quadratisch

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Jeder Kopf jeder Schicht berechnet eine $n \\times n$-**Score-Matrix**: Aufwand $O(n^2 \\cdot d)$ je Schicht. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Doppelte Kontextlänge heißt vierfache Score-Matrix. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->GPT-3 mit $n\_\\text{ctx} = 2048$: rund 4,2 Mio. Scores je Kopf und Schicht, bei 96 Schichten mit je 96 Köpfen. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Gegenmittel: Attention auf ein Fenster der Breite $r$ beschränken, $O(r \\cdot n \\cdot d)$. 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->Die Gewichte nicht speichern und maskierte Scores gar nicht erst berechnen (LLaMA): Das spart Speicher und die Hälfte der Arbeit, bleibt aber quadratisch. 

<div class="fragment" data-fragment-index="6">

<small>Brown et al. 2020, GPT-3, arXiv:2005.14165 · Vaswani et al. 2017, Table 1</small>

</div>
</div>

</script></section><section data-separator="?

<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<p class="eyebrow">Teil I · Transformer</p>

## Parallel statt sequenziell

| Schicht | Aufwand je Schicht | sequenzielle Schritte | längster Pfad |
|---|---|---|---|
| Self-Attention | $O(n^2 \\cdot d)$ | $O(1)$ | $O(1)$ |
| rekurrent (RNN) | $O(n \\cdot d^2)$ | $O(n)$ | $O(n)$ |
| Faltung | $O(k \\cdot n \\cdot d^2)$ | $O(1)$ | $O(\\log\_k n)$ |

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Ein RNN braucht $n$ Schritte nacheinander, Self-Attention einen: Die GPU rechnet alle Positionen einer Sequenz gleichzeitig. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Jedes Token erreicht jedes andere in einem Schritt; im RNN läuft die Information über bis zu $n$ Zwischenzustände. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Pro Schicht ist Self-Attention billiger als ein RNN, solange $n < d$; bei langen Kontexten kippt das. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Original-Transformer auf WMT 2014 Englisch-Deutsch: 27,3 BLEU für das Basismodell nach 12 Stunden, 28,4 BLEU für das große Modell nach 3,5 Tagen, jeweils auf acht P100-GPUs. 

<div class="fragment" data-fragment-index="5">

<small>Vaswani et al. 2017, Table 1, Table 2, Abschnitt 5.2</small>

</div>
</div>

</script></section><section data-separator="?

<p class="eyebrow">Teil I · Transformer</p>

## Drei Architekturvarianten

<img src="figs/transformer-varianten.png" alt="" style="object-fit: scale-down">


- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Encoder-only:** keine Maske, jede Position sieht alle; liefert Darstellungen statt Text (BERT). 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Decoder-only:** kausale Maske, erzeugt Token für Token (GPT-3, LLaMA). 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Encoder-Decoder:** Der Encoder liest die Quelle vollständig, der Decoder erzeugt das Ziel und fragt per **Cross-Attention** den Encoder ab (Original-Transformer). 

<div class="fragment" data-fragment-index="4">

<small>Devlin et al. 2019, BERT, arXiv:1810.04805 · Brown et al. 2020, arXiv:2005.14165 · Vaswani et al. 2017</small>

</div>
</div>

</script></section><section data-separator="?

<p class="eyebrow">Teil I · Transformer</p>

## Welche Variante für welche Aufgabe

| Aufgabe | naheliegende Variante | Grund |
|---|---|---|
| Generierung (Text fortsetzen, Chat) | Decoder-only | erzeugt autoregressiv |
| Übersetzung | Encoder-Decoder, auch Decoder-only | Quelle ganz lesen, Ziel erzeugen |
| Zusammenfassung | Encoder-Decoder oder Decoder-only | lange Eingabe, kurze erzeugte Ausgabe |
| Extraktion (Textspannen, Entitäten) | Encoder-only | jedes Token mit Kontext von beiden Seiten markieren |
| Klassifikation (Paragraph → Rechtsgebiet) | Encoder-only | ein Vektor für die ganze Eingabe plus Klassifikationskopf |

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Ein Decoder-only-Modell löst alle fünf Aufgaben per Prompt, ohne Gradientenschritte; GPT-2 und GPT-3 zeigen das. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Teil VI wägt ab, was das kostet; Teil VII misst, wie genau es wird.
</div>

</script></section><section data-separator="?

<p class="eyebrow">Teil I · Transformer</p>

## Zusammenfassung

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Attention** mittelt die Values; die Gewichte sind die Softmax der skalierten Query-Key-Ähnlichkeit. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Mehrere **Köpfe** achten auf verschiedene Beziehungen; die **kausale Maske** macht aus dem Block einen Generator. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Position** kommt von außen: addiert (sinusoidal, gelernt) oder als Drehung von Query und Key (RoPE). 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Die Kosten wachsen mit $n^2$; weil die GPU alle Positionen gleichzeitig rechnet, ist das Training schnell. 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->**Variante nach Aufgabe:** Encoder liest, Decoder erzeugt, Encoder-Decoder überträgt eine Quelle in ein Ziel. 

<div class="merk fragment" data-fragment-index="6">

Teil IV baut aus genau diesen Bausteinen einen kleinen Decoder. Vorher klären Teil II und III, welche Daten und welche Tokens hineinkommen.

</div>
</div>

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**öffentliche Korpora** und **interne Daten** nach Lizenz, Herkunft und Risiko einordnen 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->die Rechtslage zum Training prüfen: **§ 44b und § 60d UrhG**, Nutzungsvorbehalt, **KI-VO**, **DSGVO**

## Lizenz der Sammlung, Rechte am Dokument

<img src="figs/lizenz-ebenen.png" alt="" style="object-fit: scale-down">


- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->ODC-By oder Apache 2.0 gelten für die **Zusammenstellung**, nicht für den enthaltenen Text. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Bei C4 und Dolma steht das ausdrücklich: Zusätzlich gelten die Bedingungen der Quellen. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Audit von über 1.800 Textdatensätzen: Bei über 70 % fehlte die Lizenzangabe, über 50 % der Angaben waren fehlerhaft. 

<div class="merk fragment" data-fragment-index="4">

Die Lizenz eines Datensatzes vererbt sich nicht auf die Dokumente darin. Prüfen Sie die Rechte je Quelle, nicht je Download.

</div>

<div class="fragment" data-fragment-index="5">

<small>Longpre et al. 2023, The Data Provenance Initiative, arXiv:2310.16787</small>

## Interne gegen öffentliche Daten

| | interne Daten | öffentliche Webdaten |
|---|---|---|
| Vertraulichkeit | Kunden-, Personal- und Vertragsdaten können über Modellausgaben abfließen | öffentlich heißt nicht frei von PII |
| Zweckbindung | der Betriebszweck deckt Training nicht automatisch (Art. 5 Abs. 1 lit. b DSGVO) | indirekte Erhebung: Informationspflicht nach Art. 14 DSGVO |
| Rechte | der Speicherort sagt nichts über die Rechte an Lieferanten- oder Kundenwerken | Text und Data Mining (TDM, § 44b UrhG) nur bei rechtmäßigem Zugang und ohne Vorbehalt |
| Löschung | System of Record bekannt, Exporte verlieren oft die IDs | Löschung kann ein Neutraining verlangen |

<div class="warn fragment" data-fragment-index="1">

Ein Extraktionsangriff auf GPT-2 holte wörtlich Namen, Telefonnummern und UUIDs heraus, die nur in **einem** Trainingsdokument standen. Auch ein Geheimnis aus nur einem Dokument ist im Modell nicht sicher.

</div>

<div class="fragment" data-fragment-index="2">

<small>Carlini et al. 2021, Extracting Training Data from Large Language Models, arXiv:2012.07805</small>

</div>
</div>

## Datensätze dokumentieren

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Datasheets for Datasets:** sieben Abschnitte (Motivation, Zusammensetzung, Erhebung, Vorverarbeitung, Verwendung, Verteilung, Pflege); die DSK (Datenschutzkonferenz) empfiehlt die Methodik ausdrücklich. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Data Cards:** zweckgerichtete Dokumentation für Menschen 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Croissant 1.0:** maschinenlesbares Metadaten-Vokabular (MLCommons, 01.03.2024) 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Gute Data Cards nennen Lizenz, PII-Behandlung, Version und die Felder je Dokument (FineWeb: `id`, `dump`, `url`, `date`, `file_path`).

## Text und Data Mining im Urheberrecht

| Norm | Inhalt |
|---|---|
| § 44b Abs. 1 UrhG | TDM ist die automatisierte Analyse digitaler Werke, um Informationen über Muster, Trends und Korrelationen zu gewinnen |
| § 44b Abs. 2 | Vervielfältigungen **rechtmäßig zugänglicher** Werke sind erlaubt; löschen, sobald für TDM nicht mehr erforderlich |
| § 44b Abs. 3 | nur ohne **Vorbehalt** des Rechtsinhabers; online wirkt er nur in maschinenlesbarer Form |
| § 60d UrhG | TDM für wissenschaftliche Forschung: Forschungsorganisationen (nicht kommerziell, Gewinne reinvestiert oder staatlich anerkannter Auftrag im öffentlichen Interesse), Kulturerbe-Einrichtungen, einzelne Forschende ohne kommerziellen Zweck; ausgeschlossen bei bestimmendem Einfluss eines Unternehmens mit bevorzugtem Ergebniszugang |
| Art. 3, 4 RL (EU) 2019/790 (DSM-Richtlinie) | EU-Grundlage: Art. 3 Forschung, Art. 4 allgemeines TDM |

<div class="tipp fragment" data-fragment-index="1">

Gesetze, Verordnungen und amtliche Erlasse "genießen keinen urheberrechtlichen Schutz" (§ 5 Abs. 1 UrhG). Für den Gesetzestext selbst brauchen Sie keine TDM-Schranke.

</div>

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->§ 44b Abs. 3: Bei Online-Werken wirkt der Vorbehalt **nur in maschinenlesbarer Form**. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Art. 4 Abs. 3 DSM-Richtlinie: "etwa mit maschinenlesbaren Mitteln"; Erwägungsgrund 18 nennt Metadaten und Geschäftsbedingungen einer Website. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->DSK (Juni 2025): keine Daten von Webseiten sammeln, die sich eindeutig gegen Wiederverwendung aussprechen, "z. B. durch robots.txt oder ai.txt". 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->OLG Hamburg (10.12.2025, 5 U 104/24): Ein Crawler-Verbot in natürlicher Sprache war nicht als maschinenlesbar dargelegt.

## KI-VO: Pflichten für Anbieter von GPAI-Modellen

GPAI-Modelle: KI-Modelle mit allgemeinem Verwendungszweck (Art. 3 Nr. 63 KI-VO).

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Art. 53 Abs. 1 lit. a:** technische Dokumentation, darin Art, Herkunft und Kuratierung der Trainingsdaten (Anhang XI) 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**lit. c:** Policy zum Urheberrecht; Vorbehalte nach Art. 4 Abs. 3 DSM-Richtlinie erkennen und beachten 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**lit. d:** öffentliche **Zusammenfassung der Trainingsinhalte** nach der Vorlage des AI Office (veröffentlicht 24.07.2025) 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Freie Open-Source-Modelle sind nur von lit. a und b befreit, nicht von c und d; bei systemischem Risiko gar nicht. 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->Für Crawls verlangt die Vorlage Crawler-Namen, Zeitraum und die obersten 10 % der Domains nach Umfang (KMU: 5 % oder 1.000 Domains, je nachdem, was weniger ist). 

<div class="fragment" data-fragment-index="6">

## Qualitätskriterien und Filter

| Kriterium | Filter (FineWeb) | Wirkung |
|---|---|---|
| Haupttext statt Navigation | trafilatura auf WARC statt der WET-Textfassung | deutlich bessere Ablationsmodelle |
| Spam, Sprache | URL-Sperrliste; fastText-Sprachscore ≥ 0,65 | Basisfilterung |
| Satzbau | Anteil Zeilen mit Satzende ≤ 0,12 → verwerfen | entfernt 10,1 % der Token (C4-Regel: rund 30 %) |
| Wiederholung | Zeichenanteil in doppelten Zeilen ≥ 0,1 | entfernt 12,5 % |
| Form | Anteil Zeilen unter 30 Zeichen ≥ 0,67 | entfernt 3,7 % |

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Die drei unteren Filter entfernen zusammen rund 22 % der Token (sie überlappen sich) und heben den Benchmark-Mittelwert um etwa 1 %.

## PII erkennen und entfernen

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->FineWeb ersetzt **E-Mail-Adressen** und **öffentliche IP-Adressen** per Regex; Telefonnummern bewusst nicht ("high false positive rate"). 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Presidio** kombiniert NER (Named Entity Recognition), Muster, Regeln und Prüfsummen; das Projekt garantiert keine Vollständigkeit. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Dokumente voller sensibler Angaben verwerfen statt schwärzen; Recall an einem annotierten deutschen Testset messen. 

<div class="fragment" data-fragment-index="4">

<blockquote style="margin: 0.3em 0; padding: 0.3em 0.8em">

Die deutschen Zensoren – – – – – – – – – – – – – – Dummköpfe – – – – – – – – – – – – – – <small>(Heinrich Heine, *Ideen. Das Buch Le Grand*, 1827, Kapitel XII)</small>

</blockquote>

</div>

<div class="fragment" data-fragment-index="5">

```python
import re

EMAIL = re.compile(r"[\w.+-]+@[\w-]+\.[\w.-]+")
IPV4 = re.compile(r"\b(?:\d{1,3}\.){3}\d{1,3}\b")   # grob: trifft auch Versionsnummern

def mask(text: str) -> str:
    return IPV4.sub("<IP>", EMAIL.sub("<EMAIL>", text))

print(mask("Rückfragen an m.muster@example.de, Server 203.0.113.7."))
# Rückfragen an <EMAIL>, Server <IP>.
```

</div>

<div class="warn fragment" data-fragment-index="6">

Eine gehashte Telefonnummer ist nicht anonym: Es gibt so wenige mögliche Nummern, dass ein Angreifer alle durchhasht und vergleicht. Mit geheimem Schlüssel (HMAC) kann das nur, wer den Schlüssel hat; die Daten sind dann pseudonymisiert, nicht anonymisiert.

</div>
</div>

| Studie | Befund |
|---|---|
| Lee et al. 2022 | über 1 % der Token memorisiert, nach Deduplizierung 0,1 %; ein Satz mit 61 Wörtern stand über 60.000-mal in C4 |
| Kandpal et al. 2022 | eine zehnfach vorhandene Sequenz wird im Mittel rund 1.000-mal häufiger wörtlich erzeugt |
| Carlini et al. 2023 | Memorisierung wächst log-linear mit Modellgröße, Zahl der Kopien und Prompt-Länge |
| FineWeb 2024 | globale Deduplizierung über alle Crawls brachte kaum Gewinn; Deduplizierung je Crawl war besser |

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Dubletten zwischen Training und Test verfälschen die Bewertung: Bei C4 überlappen sich 4,6 % der Validierungsdaten mit dem Training.

## Exakte Dubletten

```python
import hashlib
import unicodedata

def dedup_key(text: str) -> str:
    norm = unicodedata.normalize("NFC", text).lower()
    norm = " ".join(norm.split())                 # Leerraum vereinheitlichen
    return hashlib.sha256(norm.encode("utf-8")).hexdigest()

seen, kept = set(), []
for doc in docs:                                  # docs: Liste von {"id", "text"}
    h = dedup_key(doc["text"])
    if h not in seen:
        seen.add(h)
        kept.append(doc)
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Vor dem Hashen normalisieren: Unicode-Form, Groß- und Kleinschreibung, Leerraum. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Ein Suffix-Array (`ExactSubstr`, Lee et al.) findet lange Teilstücke, die sich über Dokumentgrenzen hinweg wiederholen.
</div>

## Beinahe-Dubletten: MinHash und LSH

<img src="figs/minhash-lsh-kurve.png" alt="" style="object-fit: scale-down">


- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Dokument → Menge von **Wort-5-Grammen**; Ähnlichkeit zweier Dokumente = **Jaccard-Index** der Mengen. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**MinHash:** 112 Hashfunktionen verdichten die Menge zu einer Signatur. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**LSH (Locality-Sensitive Hashing):** 14 Buckets zu je 8 Werten; Kandidat, wenn ein Bucket vollständig übereinstimmt. 

<div class="fragment" data-fragment-index="4">

<small>Parameter aus Penedo et al. 2024 (FineWeb), arXiv:2406.17557</small>

</div>
</div>

<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<p class="eyebrow">Teil II · Daten</p>

## MinHash in Code

```python
from datasketch import MinHash, MinHashLSH

def signature(grams: set[str], num_perm: int = 112) -> MinHash:
    m = MinHash(num_perm=num_perm, seed=1)
    m.update_batch([g.encode("utf-8") for g in grams])
    return m

lsh, grams = MinHashLSH(num_perm=112, params=(14, 8)), {}   # 14 Buckets zu je 8
for doc in docs:
    w = doc["text"].split()
    g = {" ".join(w[i:i + 5]) for i in range(len(w) - 4)}     # Wort-5-Gramme
    if not g:                                     # unter fünf Wörtern: Längenfilter
        continue
    m = signature(g)
    if not any(len(g & grams[c]) / len(g | grams[c]) >= 0.75 for c in lsh.query(m)):
        lsh.insert(doc["id"], m)                  # kein Kandidat exakt bestätigt
        grams[doc["id"]] = g
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->`params=(14, 8)` setzt Buckets und Werte je Bucket direkt, statt sie aus einer Schwelle abzuleiten. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->`lsh.query` liefert nur **Kandidaten**; `m.jaccard(...)` schätzt die Ähnlichkeit aus den Signaturen. Bestätigt wird ein Kandidat erst mit dem exakten Jaccard-Index der 5-Gramm-Mengen (Shingles), hier ab 0,75.
</div>

</script></section><section data-separator="?

## Zusammenfassung

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Lizenz der Sammlung ≠ Rechte am Dokument:** Prüfen Sie je Quelle und speichern Sie das TDM-Signal beim Abruf. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**§ 44b UrhG** erlaubt TDM an rechtmäßig zugänglichen Werken ohne maschinenlesbaren Vorbehalt; GPAI-Anbieter veröffentlichen eine Zusammenfassung ihrer Trainingsdaten; die **DSGVO** verlangt schon beim Training eine Rechtsgrundlage und Datenminimierung. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**PII** vor dem Training entfernen: Muster für Strukturiertes, NER für Namen; Recall und Fehlalarme messen. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Beinahe-Dubletten findet ein exakter Hash nicht:** Erst MinHash und LSH auf 5-Grammen fassen sie zusammen; auch der Jaccard-Index trennt Kopie und fast gleichlautende eigene Norm nicht. 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->Jede Stufe zählt, was sie verwirft; das **Manifest** macht den Korpus nachprüfbar. 

<div class="merk fragment" data-fragment-index="6">

Der gereinigte Korpus ist die Eingabe für Teil III: Der Tokenizer lernt sein Vokabular aus genau diesen Texten.

</div>

## Lernziele

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Sie erklären, wie **BPE** (Byte-Pair Encoding), **WordPiece** und **Unigram** ein Vokabular lernen, und ordnen **SentencePiece** und **Byte-Level-BPE** ein. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Sie begründen die **Vokabulargröße** mit der Abwägung zwischen Sequenzlänge, Parametern und seltenen Tokens. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Sie erkennen typische Fehlerbilder: Komposita, Spezialtokens, Zahlen, Leerzeichen, Unicode. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Sie trainieren einen Tokenizer mit der Bibliothek `tokenizers` und speichern ihn als Artefakt. 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->Sie wissen, wie man Token-IDs für große Trainingsläufe ablegt.
</div>

## Vom Text zur Token-ID

<img src="figs/tokenizer-pipeline.png" alt="" style="object-fit: scale-down">


- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Eine **Token-ID** ist ein Zeilenindex in der Embedding-Matrix des Modells. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Normalizer und Pre-Tokenizer gehören zum Training: Wer sie ändert, muss neu trainieren. 

<div class="fragment" data-fragment-index="3">

<p class="eyebrow">Teil III · Tokenisierung</p>

## BPE: Prinzip

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Start:** jedes Wort als Folge einzelner Zeichen, das Vokabular ist das Alphabet. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Lernen:** benachbarte Paare zählen, das häufigste zu einem neuen Symbol verschmelzen, wiederholen. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Ergebnis:** Alphabet plus eine geordnete Liste von **Merges**. Ihre Anzahl ist der einzige Hyperparameter. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Kodieren:** die gelernten Merges in ihrer Reihenfolge auf ein neues Wort anwenden. 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->Sennrich et al. begründen Subwörter ausdrücklich mit Komposita: *Abwasser·behandlungs·anlage*. 

<div class="fragment" data-fragment-index="6">

<small>Sennrich, Haddow, Birch 2016, arXiv:1508.07909</small>

</div>
</div>

</script></section><section data-separator="?

<p class="eyebrow">Teil III · Tokenisierung</p>

## BPE Schritt für Schritt

Mini-Korpus (Wort: Häufigkeit): **gesetz** 3 · **setzen** 2 · **satz** 2 · **gesellschaft** 1

<div class="fragment" data-fragment-index="1">

| Schritt | häufigstes Paar | Anzahl | neues Symbol |
|---|---|---|---|
| 1 | `t` + `z` | 7 | `tz` |
| 2 | `s` + `e` | 6 | `se` |
| 3 | `se` + `tz` | 5 | `setz` |
| 4 | `g` + `e` | 4 | `ge` |
| 5 | `ge` + `setz` | 3 | `gesetz` |

</div>

- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Nach fünf Merges: `gesetz` ist ein Token, `setzen` wird `setz|e|n`, `gesellschaft` zerfällt in `ge|se|l|l|s|c|h|a|f|t`. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Häufige Paare verschmelzen zuerst, deshalb wird ein häufiges Wort zu einem Token und ein seltenes bleibt in Stücken. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->BPE kodiert das neue Wort **gesetzes** mit denselben fünf Merges zu `gesetz|e|s`.
</div>

</script></section><section data-separator="?

<p class="eyebrow">Teil III · Tokenisierung</p>

## WordPiece und Unigram

<div class="two-col"><div style="flex: 50">

### WordPiece

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Fügt wie BPE Einheiten hinzu, wählt aber das Paar mit dem größten **Likelihood-Gewinn** (Schuster, Nakajima 2012). 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Kodiert vom Wortanfang aus mit dem **längsten passenden Stück**, Fortsetzungen tragen `##`. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Fehlt ein Zeichen im Vokabular, wird das **ganze Wort** zu `[UNK]`. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->BERT nutzt WordPiece mit 30.000 Tokens. 

</div><div style="flex: 50">

### Unigram

- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->Startet mit einem **großen** Vokabular und streicht die Stücke, deren Wegfall die Korpus-Likelihood am wenigsten senkt. 
- &shy;<!-- .element: class="fragment" data-fragment-index="6" -->Einzelzeichen bleiben immer erhalten. 
- &shy;<!-- .element: class="fragment" data-fragment-index="7" -->Kodiert per **Viterbi**; alternative Zerlegungen lassen sich sampeln (Subword Regularization). 

</div></div>

<div class="fragment" data-fragment-index="8">

<small>Schuster, Nakajima, ICASSP 2012 · Devlin et al. 2019, arXiv:1810.04805 · Kudo 2018, arXiv:1804.10959</small>

</div>
</div>

</script></section><section data-separator="?

<p class="eyebrow">Teil III · Tokenisierung</p>

## SentencePiece und Byte-Level-BPE

<div class="two-col"><div style="flex: 50">

### SentencePiece

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Eine **Implementierung** von BPE und Unigram, kein viertes Verfahren. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Trainiert direkt auf Rohtext, das Leerzeichen wird zum Symbol `▁`. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Standard ist `nmt_nfkc`: eine NFKC-Variante mit zusätzlicher Leerraumnormalisierung. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Der Roundtrip liefert den **normalisierten Text**, wenn das Vokabular dessen Zeichen abdeckt oder Byte-Fallback aktiv ist. 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->`byte_fallback=true` zerlegt unbekannte Zeichen in Byte-Tokens wie `<0xE3>`. 

</div><div style="flex: 50">

### Byte-Level-BPE

- &shy;<!-- .element: class="fragment" data-fragment-index="6" -->Startalphabet sind die **256 Byte-Werte** statt über 130.000 Unicode-Zeichen (GPT-2). 
- &shy;<!-- .element: class="fragment" data-fragment-index="7" -->Kein unbekanntes Zeichen, jeder Text ist kodierbar. 
- &shy;<!-- .element: class="fragment" data-fragment-index="8" -->Preis: UTF-8 braucht 1 bis 4 Byte je Zeichen, die Merges holen einen Teil davon zurück. 
- &shy;<!-- .element: class="fragment" data-fragment-index="9" -->Genutzt in GPT-2 und den `tiktoken`-Encodings. 

</div></div>

<div class="fragment" data-fragment-index="10">

<small>Kudo, Richardson 2018, arXiv:1808.06226 · <a href="https://github.com/google/sentencepiece/blob/master/doc/normalization.md" target="_blank" rel="noopener">SentencePiece-Dokumentation</a> · Radford et al. 2019 (GPT-2) · Wang, Cho, Gu 2019, arXiv:1909.03341</small>

</div>
</div>

## Vokabulargrößen bekannter Modelle

| Modell / Encoding | Verfahren | Vokabular |
|---|---|---|
| BERT-base uncased | WordPiece | 30.522 (Paper: 30.000) |
| Llama 2 | SentencePiece-BPE (wie LLaMA 1) | 32K |
| GPT-2 | Byte-Level-BPE | 50.257 = 256 Byte-Werte + 50.000 Merges + 1 Spezialtoken |
| `cl100k_base` (tiktoken) | Byte-Level-BPE | 100.277 |
| Llama 3 | BPE auf tiktoken-Basis | 128K = 100K aus tiktoken + 28K für weitere Sprachen |
| Qwen2.5-7B | Byte-Level-BPE (Qwen2-Report) | 152.064 |
| `o200k_base` (tiktoken) | Byte-Level-BPE | 200.019 |
| Gemma 2 | SentencePiece | 256k |

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Llama 3 hebt mit 128K Tokens die Kompression einer englischen Stichprobe von 3,17 auf 3,94 Zeichen pro Token. 

<div class="fragment" data-fragment-index="2">

<small>Devlin et al. 2019, arXiv:1810.04805 · Radford et al. 2019 · Llama Team 2024, arXiv:2407.21783 · Gemma Team 2024, arXiv:2408.00118 · Tao et al. 2024, arXiv:2407.13623 · Qwen Team 2024, arXiv:2407.10671 · Modellkonfigurationen und tiktoken auf Hugging Face/GitHub, Stand 06.10.2026</small>

</div>
</div>

<p class="eyebrow">Teil III · Tokenisierung</p>

## Vokabulargröße als Zielkonflikt

Was ändert sich, wenn das Vokabular von 8.000 auf 32.000 Einträge wächst?

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Sequenzlänge:** Wie viele Tokens braucht derselbe Paragraph? 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Parameter:** Die Embedding-Matrix hat $V \\cdot d$ Gewichte. Ohne geteilte Gewichte zwischen Embedding und Ausgabeschicht (Weight Tying, Teil IV) kommt eine zweite Matrix gleicher Größe dazu. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Seltene Tokens:** Wie oft kommt ein Eintrag im Training vor? 

<div class="merk fragment" data-fragment-index="4">

Eine allgemein richtige Größe gibt es nicht. Tao et al. zeigen, dass das optimale Vokabular mit dem Rechenbudget wächst; für Llama2-70B sagen sie mindestens 216.000 statt der tatsächlichen 32.000 voraus.

</div>

<div class="fragment" data-fragment-index="5">

<small>Tao et al. 2024, arXiv:2407.13623</small>

</div>
</div>

</script></section><section data-separator="?

<p class="eyebrow">Teil III · Tokenisierung</p>

## Deutsche Komposita

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Frequenzbasierte Stücke treffen **Morphemgrenzen** nur zufällig. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->LLMs trennen Komposita schlecht in ihre Bestandteile, besonders wenn der Tokenizer sie ungünstig zerlegt (CompoundPiece, 56 Sprachen). 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Ein mit Decompounding trainierter Tokenizer verbessert die Kompositum-Normalisierung um 5,5 % gegenüber einem sonst gleichen SentencePiece-Modell. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Mit einem englisch trainierten Tokenizer kostet deutscher Text einen Aufschlag: Petrov et al. messen auf parallelen Sätzen Unterschiede bis Faktor 15 zwischen Sprachen. 

<div class="fragment" data-fragment-index="5">

Frage: Wie zerfällt **Kündigungsschutzgesetz** bei einem englisch trainierten Tokenizer, und wie bei einem, der auf dem Gesetzeskorpus trainiert wurde?

</div>

<div class="fragment" data-fragment-index="6">

<small>Minixhofer, Pfeiffer, Vulić 2023, arXiv:2305.14214 · Sennrich, Haddow, Birch 2016, arXiv:1508.07909 · Petrov et al. 2023, arXiv:2305.15425</small>

</div>
</div>

<p class="eyebrow">Teil III · Tokenisierung</p>

## Spezialtokens

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Rollen:** `<pad>` füllt Batches auf, `<s>`/`</s>` markieren Anfang und Ende, `<unk>` steht für Unbekanntes, BERT ergänzt `[CLS]` und `[SEP]`. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**IDs** entstehen beim Training aus der Liste `special_tokens` und gehören fest zum Modell. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Injektion:** `tiktoken` und `minbpe` parsen Spezialtokens nur mit ausdrücklicher Freigabe (`allowed_special`). Sonst könnte Nutzertext solche Tokens einschleusen. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Roundtrip:** `Tokenizer.decode` lässt Spezialtokens standardmäßig weg (`skip_special_tokens=True`). Steht `<pad>` wörtlich im Text, liefert `decode(encode(x))` nicht mehr den Ausgangstext. 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->**Neue Tokens:** nach dem Hinzufügen `model.resize_token_embeddings(len(tokenizer))`; die neuen Zeilen sind untrainiert. 

<div class="fragment" data-fragment-index="6">

<small>karpathy/minbpe README · openai/tiktoken README · Hugging Face Transformers, Tokenizer API (Stand 06.10.2026)</small>

</div>
</div>

</script></section><section data-separator="?

<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<p class="eyebrow">Teil III · Tokenisierung</p>

## Fehlerbilder: Zahlen, Leerzeichen, Unicode

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Zahlen:** Ohne Regel entscheiden die gelernten Merges, wie `433` zerfällt; ähnliche Zahlen zerfallen dann verschieden. LLaMA und Gemma 2 zerlegen Zahlen in einzelne Ziffern; in `tokenizers` geht das per `pre_tokenizers.Digits(individual_digits=True)`. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Leerzeichen:** `Gesetz` am Zeilenanfang und ` Gesetz` im Satz sind verschiedene Bytefolgen und damit meist verschiedene Tokens. SentencePiece macht das Leerzeichen als `▁` sichtbar. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Unicode:** `ä` kann ein Codepunkt sein oder `a` plus kombinierendes Trema. NFC vereinheitlicht das; NFKC löst zusätzlich Ligaturen wie „ﬁ“ und hochgestellte Ziffern auf. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Abdeckung:** `bert-base-uncased` enthält kein ä, ö oder ü; der Normalizer entfernt Akzente vorher: Aus `für` wird `fur`, aus `über` `uber`. Erst ohne `strip_accents` werden beide zu `[UNK]`. 

<div class="warn fragment" data-fragment-index="5">

Training, Evaluation und Betrieb nutzen dasselbe gespeicherte Tokenizer-Artefakt, sonst wird derselbe Text anders kodiert.

</div>

<div class="fragment" data-fragment-index="6">

<small>Touvron et al. 2023, arXiv:2302.13971 · Gemma Team 2024, arXiv:2408.00118 · Unicode Standard Annex #15 (Rev. 58) · bert-base-uncased vocab.txt</small>

</div>
</div>

</script></section><section data-separator="?

<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<p class="eyebrow">Teil III · Tokenisierung</p>

## Tokenizer trainieren mit `tokenizers`

```python
from tokenizers import Tokenizer, models, normalizers, pre_tokenizers, decoders, trainers

tok = Tokenizer(models.BPE())
tok.normalizer = normalizers.NFC()
tok.pre_tokenizer = pre_tokenizers.ByteLevel(add_prefix_space=False)
tok.decoder = decoders.ByteLevel()
trainer = trainers.BpeTrainer(
    vocab_size=8000, min_frequency=2,
    special_tokens=["<pad>", "<s>", "</s>"],
    initial_alphabet=pre_tokenizers.ByteLevel.alphabet())   # alle 256 Byte-Werte
tok.train_from_iterator(train, trainer)   # train: Liste der Paragraphentexte
tok.save("tokenizer.json")
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->`initial_alphabet` nimmt alle 256 Byte-Werte auf, auch solche, die im Korpus fehlen. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Stand 03.11.2026: 0.23.2 gepinnt (neueste stabile Version 0.23.3); 1.0.0 nur als Release Candidate (rc3, 19.10.2026). 

<div class="fragment" data-fragment-index="3">

<small>Hugging Face Tokenizers, The tokenization pipeline · PyPI tokenizers 0.23.2 (03.09.2026) · huggingface/tokenizers README (Stand 06.10.2026)</small>

</div>
</div>

<p class="eyebrow">Teil III · Tokenisierung</p>

## Ausblick: Token-IDs für große Läufe

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Shards:** Große Korpora liegen als viele Dateien vor, FineWeb etwa als Parquet-Dateien je Crawl (`data/CC-MAIN-2025-05/…`). 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Gepackte Sequenzen:** GPT-3 wurde immer mit vollen 2.048 Tokens trainiert: mehrere Dokumente in einer Sequenz, getrennt durch ein End-of-Text-Token. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Binärdatei:** `uint16` fasst IDs bis 65.535 (GPT-2), größere Vokabulare wie bei Llama 3 oder `o200k_base` brauchen `uint32`. 

<div class="fragment" data-fragment-index="4">

```python
import numpy as np
ids = []
for text in paragraphs:
    ids += tok.encode(text).ids + [tok.token_to_id("</s>")]
dtype = np.uint16 if tok.get_vocab_size() <= 2**16 else np.uint32
np.array(ids, dtype=dtype).tofile("train.bin")

data = np.memmap("train.bin", dtype=dtype, mode="r")
x = data[i : i + 256]          # Eingabe
y = data[i + 1 : i + 257]      # Ziel: um ein Token versetzt
```

</div>

<div class="fragment" data-fragment-index="5">

<small>Brown et al. 2020, arXiv:2005.14165 · HuggingFaceFW/fineweb Dataset Card · karpathy/nanoGPT train.py (Commit 3adf61e)</small>

</div>
</div>

<p class="eyebrow">Teil III · Tokenisierung</p>

## Zusammenfassung

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**BPE** verschmilzt häufige Paare, **WordPiece** wählt nach Likelihood-Gewinn, **Unigram** streicht ein großes Vokabular zusammen; **SentencePiece** implementiert BPE und Unigram auf Rohtext, **Byte-Level-BPE** kennt kein unbekanntes Zeichen. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Größeres Vokabular** kürzt Sequenzen und kostet Embedding-Parameter. Llama 3 hebt mit 128K Tokens die Kompression einer englischen Stichprobe von 3,17 auf 3,94 Zeichen pro Token. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Sprache zählt:** Mit einem englisch trainierten Tokenizer kostet deutscher Text einen Aufschlag. Petrov et al. messen auf parallelen Sätzen Unterschiede bis Faktor 15 zwischen Sprachen. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Fehler** entstehen bei Spezialtokens, Zahlen, Leerzeichen und Normalisierung. 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->**Tokenizer und Modell** sind ein Paar: ein Tokenizer-Artefakt für Training, Evaluation und Betrieb. Sie trainieren den Tokenizer mit `tokenizers`, speichern ihn als JSON und legen die Token-IDs als `uint16`-Binärdatei ab. 

<div class="fragment" data-fragment-index="6">

<small>Llama Team 2024, arXiv:2407.21783 · Petrov et al. 2023, arXiv:2305.15425</small>

</div>

## Lernziele

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Sie benennen die Bausteine eines **Decoder-only-Transformers** und ihre Reihenfolge im Block. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Sie unterscheiden **LayerNorm** und **RMSNorm**, **Post-Norm** und **Pre-Norm**, ein GELU-Feed-Forward-Netz und **SwiGLU**. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Sie legen eine **Konfiguration** fest: Breite, Tiefe, Heads, Kontextlänge, Vokabular. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Sie schätzen die **Parameterzahl** mit einer Formel und prüfen sie im Code. 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->Sie lesen einen Transformer-Block als `nn.Module` in PyTorch und ordnen jede Zeile einem Baustein zu.

## Decoder-only-Transformer im Überblick

<img src="figs/decoder-only-stack.png" alt="" style="object-fit: scale-down">


- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Ein Block wird **L-mal** gestapelt, die Breite $d$ bleibt im ganzen Stapel gleich. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Am Ende steht für jede Position ein Vektor mit $V$ Logits: die Vorhersage des nächsten Tokens.

<p class="eyebrow">Teil IV · Mini-Transformer</p>

## Token-Embedding und Positionsinformation

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Token-Embedding:** `nn.Embedding(V, d)` ist eine Matrix mit $V \\times d$ Gewichten; die Token-ID wählt eine Zeile. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Gelernte Position:** eine zweite Matrix `nn.Embedding(T, d)`; die Zeile der Position wird zum Token-Embedding addiert (GPT-2, nanoGPT). 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**RoPE (Rotary Position Embedding):** keine eigene Matrix; LLaMA dreht stattdessen Queries und Keys in jedem Attention-Layer. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Gelernte Positionen legen die Kontextlänge $T$ fest: nanoGPT bricht bei längeren Sequenzen ab. 

<div class="fragment" data-fragment-index="5">

<small>Radford et al. 2019 (GPT-2) · Touvron et al. 2023, arXiv:2302.13971 · Su et al. 2021, arXiv:2104.09864</small>

</div>
</div>

<p class="eyebrow">Teil IV · Mini-Transformer</p>

## Attention-Block

```python
class CausalSelfAttention(nn.Module):
    def __init__(self, d, n_head):
        super().__init__()
        self.n_head = n_head
        self.qkv = nn.Linear(d, 3 * d, bias=False)    # Q, K, V in einer Projektion
        self.proj = nn.Linear(d, d, bias=False)       # Ausgabeprojektion

    def forward(self, x):
        B, T, C = x.shape
        h = self.n_head
        q, k, v = self.qkv(x).split(C, dim=2)
        q, k, v = (t.view(B, T, h, C // h).transpose(1, 2) for t in (q, k, v))
        y = F.scaled_dot_product_attention(q, k, v, is_causal=True)
        return self.proj(y.transpose(1, 2).reshape(B, T, C))
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Der Rumpf von `forward()` ist die Multi-Head-Berechnung mit kausaler Maske aus Teil I, jetzt als `nn.Module` mit gelernten Gewichten. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Parameter: $4 d^2$ (Q, K, V und Ausgabeprojektion, ohne Bias).
</div>

## Feed-Forward-Netz

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Wirkt auf **jede Position einzeln** und mit denselben Gewichten. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Erweitert auf $4d$ und projiziert zurück auf $d$; GPT-3 nutzt immer $d\_{ff} = 4 \\cdot d\_{model}$. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Aktivierung: ReLU im Original-Transformer, **GELU** in GPT-2 und nanoGPT. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Parameter: $2 \\cdot d \\cdot 4d = 8 d^2$, doppelt so viel wie die Attention. 

<div class="fragment" data-fragment-index="5">

```python
class MLP(nn.Module):
    def __init__(self, d):
        super().__init__()
        self.up = nn.Linear(d, 4 * d, bias=False)
        self.down = nn.Linear(4 * d, d, bias=False)

    def forward(self, x):
        return self.down(F.gelu(self.up(x)))
```

</div>

<div class="fragment" data-fragment-index="6">

<small>Vaswani et al. 2017, arXiv:1706.03762 · Brown et al. 2020, arXiv:2005.14165</small>

</div>
</div>

## SwiGLU als Variante

$$\\mathrm{FFN}\_{\\mathrm{SwiGLU}}(x) = \\big(\\mathrm{SiLU}(x W\_g) \\odot x W\_u\\big)\\, W\_d, \\qquad \\mathrm{SiLU}(z) = z \\cdot \\sigma(z)$$

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Ein **Gate** ($W\_g$) gewichtet elementweise den Aufwärtspfad ($W\_u$); drei Matrizen statt zwei. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->LLaMA ersetzt ReLU durch SwiGLU und nimmt als innere Breite $\\tfrac{2}{3} \\cdot 4d$ statt $4d$: So bleibt es bei rund $8 d^2$ Parametern. 

<div class="fragment" data-fragment-index="3">

```python
class SwiGLU(nn.Module):
    def __init__(self, d, hidden):
        super().__init__()
        self.gate = nn.Linear(d, hidden, bias=False)
        self.up = nn.Linear(d, hidden, bias=False)
        self.down = nn.Linear(hidden, d, bias=False)

    def forward(self, x):
        return self.down(F.silu(self.gate(x)) * self.up(x))
```

</div>

<div class="fragment" data-fragment-index="4">

<small>Shazeer 2020, arXiv:2002.05202 · Touvron et al. 2023, arXiv:2302.13971</small>

</div>
</div>

## Residualverbindungen und Pre-Norm

<img src="figs/prenorm-vs-postnorm.png" alt="" style="object-fit: scale-down">


- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Residual:** Jeder Teilblock addiert sein Ergebnis zum Eingang, $x \\leftarrow x + f(x)$. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Post-Norm** (Original-Transformer): $\\mathrm{LayerNorm}(x + \\mathrm{Sublayer}(x))$. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Pre-Norm** (GPT-2, GPT-3, LLaMA): $x + \\mathrm{Sublayer}(\\mathrm{Norm}(x))$, dazu eine finale Norm nach dem letzten Block; LLaMA nennt Trainingsstabilität als Grund. 

<div class="fragment" data-fragment-index="4">

<small>Vaswani et al. 2017, arXiv:1706.03762 · Radford et al. 2019 (GPT-2) · Touvron et al. 2023, arXiv:2302.13971</small>

</div>
</div>

<p class="eyebrow">Teil IV · Mini-Transformer</p>

## LayerNorm und RMSNorm

$$\\mathrm{LayerNorm}(x) = \\gamma \\odot \\frac{x - \\mu}{\\sqrt{\\sigma^2 + \\varepsilon}} + \\beta \\qquad\\qquad \\mathrm{RMSNorm}(x) = \\gamma \\odot \\frac{x}{\\sqrt{\\tfrac{1}{d}\\sum\_{i} x\_i^2 + \\varepsilon}}$$

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Beide normalisieren den Vektor **einer Position** über seine $d$ Komponenten. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**RMSNorm** zieht keinen Mittelwert ab und hat keinen Bias $\\beta$: weniger Rechenaufwand, nur ein Parametervektor. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->LLaMA nutzt RMSNorm, Qwen2.5-7B ebenso (`rms_norm_eps: 1e-06`). 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->In PyTorch: `nn.LayerNorm(d)` oder `nn.RMSNorm(d)`; nanoGPT schaltet mit `bias=False` die Biases von Linear-Schichten und LayerNorms gemeinsam ab und nennt das "a bit better and faster". 

<div class="fragment" data-fragment-index="5">

<small>Ba, Kiros, Hinton 2016 (Layer Normalization) · Zhang, Sennrich 2019, NeurIPS 32 · Touvron et al. 2023, arXiv:2302.13971</small>

</div>
</div>

## Ausgabeschicht und Weight Tying

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Die **Ausgabeschicht** `nn.Linear(d, V, bias=False)` bildet jede Position auf $V$ Logits ab; Softmax und Cross-Entropy folgen im Training. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Weight Tying:** Ausgabeschicht und Token-Embedding teilen sich eine Matrix. Der Original-Transformer folgt darin Press und Wolf. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Ersparnis: $V \\cdot d$ Parameter. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Nicht jedes Modell nutzt Weight Tying: Qwen2.5-7B setzt `tie_word_embeddings: false`. 

<div class="fragment" data-fragment-index="5">

```python
self.head = nn.Linear(d, vocab, bias=False)
self.head.weight = self.tok.weight      # eine Matrix, zwei Rollen
```

</div>

<div class="fragment" data-fragment-index="6">

<small>Vaswani et al. 2017, arXiv:1706.03762 · Press, Wolf 2016, arXiv:1608.05859 · karpathy/nanoGPT model.py (Commit 3adf61e)</small>

</div>
</div>

<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<p class="eyebrow">Teil IV · Mini-Transformer</p>

## PyTorch: ein Block

```python
class Block(nn.Module):
    def __init__(self, d, n_head):
        super().__init__()
        self.norm1 = nn.RMSNorm(d)
        self.attn = CausalSelfAttention(d, n_head)
        self.norm2 = nn.RMSNorm(d)
        self.mlp = MLP(d)

    def forward(self, x):
        x = x + self.attn(self.norm1(x))     # Pre-Norm, Residual
        return x + self.mlp(self.norm2(x))
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Zweimal dieselbe Folge: **Norm → Teilblock → Addition**; die Breite $d$ bleibt erhalten. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->`MLP` lässt sich ohne weitere Änderung gegen `SwiGLU(d, hidden)` tauschen. 

<div class="fragment" data-fragment-index="3">

<small>karpathy/nanoGPT model.py (Commit 3adf61e), dort mit LayerNorm</small>

</div>
</div>

<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<p class="eyebrow">Teil IV · Mini-Transformer</p>

## PyTorch: das Modell

```python
import math

class MiniGPT(nn.Module):
    def __init__(self, vocab=8000, d=256, n_layer=4, n_head=4, ctx=256):
        super().__init__()
        self.tok = nn.Embedding(vocab, d)
        self.pos = nn.Embedding(ctx, d)
        self.blocks = nn.Sequential(*[Block(d, n_head) for _ in range(n_layer)])
        self.norm = nn.RMSNorm(d)
        self.head = nn.Linear(d, vocab, bias=False)
        self.head.weight = self.tok.weight          # Weight Tying
        self.apply(self._init_weights)
        for name, p in self.named_parameters():     # Residual-Ausgänge
            if name.endswith(("proj.weight", "down.weight")):
                nn.init.normal_(p, mean=0.0, std=0.02 / math.sqrt(2 * n_layer))

    @staticmethod
    def _init_weights(module):
        if isinstance(module, (nn.Linear, nn.Embedding)):
            nn.init.normal_(module.weight, mean=0.0, std=0.02)

    def forward(self, idx):
        x = self.tok(idx) + self.pos(torch.arange(idx.shape[1], device=idx.device))
        return self.head(self.norm(self.blocks(x)))
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Die Ausgabe hat die Form `(B, T, V)`: für jede Position Logits über das Vokabular.
</div>

| Größe | Symbol | Mini-GPT | GPT-2 small | GPT-3 175B |

| Breite | $d\_{model}$ | 256 | 768 | 12.288 |
| Tiefe | $L$ (`n_layer`) | 4 | 12 | 96 |

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->$d\_{model}$ muss durch $n\_{head}$ teilbar sein; GPT-3 175B rechnet mit $d\_{head} = 128$. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Bei fester Zahl der Nicht-Embedding-Parameter hängt der Loss nur schwach von der Modellform ab (Tiefe gegen Breite).

## Parameterzählung

| Baustein je Block | Parameter |
|---|---|
| Attention: Q, K, V, Ausgabe | $4 d^2$ |
| Feed-Forward: $d \\to 4d \\to d$ | $8 d^2$ |
| zwei Normen | $2d$ (vernachlässigbar) |

<div class="fragment" data-fragment-index="1">

$$N \\approx 12 \\cdot L \\cdot d^2 \\;+\\; \\underbrace{V \\cdot d}\_{\\text{Token-Embedding}} \\;+\\; \\underbrace{T \\cdot d}\_{\\text{Position}}$$

</div>

- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Kaplan et al. zählen nur den ersten Term ($N \\approx 12\\, n\_{layer}\\, d\_{model}^2$), ohne Embeddings. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Ohne Weight Tying kommt $V \\cdot d$ ein zweites Mal dazu. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Probe GPT-2 small: 84,9 M + 38,6 M + 0,8 M ≈ **124 M**. 

<div class="fragment" data-fragment-index="5">

<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<p class="eyebrow">Teil IV · Mini-Transformer</p>

## Zusammenfassung

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Aufbau:** Token-Embedding plus Position, $L$ gleiche Blöcke, finale Norm, Ausgabeschicht mit $V$ Logits. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Block:** Pre-Norm, kausale Attention ($4d^2$), Feed-Forward ($8d^2$), je mit Residualverbindung. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Varianten:** RMSNorm statt LayerNorm, SwiGLU statt GELU, RoPE statt gelernter Position (LLaMA-Linie). 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Weight Tying:** spart $V \\cdot d$ Parameter, bei kleinen Modellen ein großer Anteil. 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->**Faustformel:** $N \\approx 12 \\cdot L \\cdot d^2 + V \\cdot d$, im Code mit `sum(p.numel() ...)` prüfen.
</div>

## Next-Token-Loss

$$ \\mathcal{L}(\\theta) = -\\frac{1}{T}\\sum\_{t=1}^{T} \\log p\_\\theta(x\_{t+1} \\mid x\_{\\le t}) $$

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Das Modell sagt an **jeder Position** das nächste Token voraus: Eine Sequenz mit $T+1$ Tokens liefert $T$ Lernsignale. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Der Loss ist die **Cross-Entropy** zwischen Zieltoken und vorhergesagter Verteilung, gemessen in nats. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Startwert prüfen:** Ein frisch initialisiertes Modell verteilt die Wahrscheinlichkeit fast gleichmäßig über das Vokabular, also $\\mathcal{L}\_0 \\approx \\ln V$. Bei $V = 8000$ sind das rund 8,99. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->$e^{\\mathcal{L}}$ ist die **Perplexity**; was sie aussagt und was nicht, folgt in Teil VII.
</div>

</script></section><section data-separator="?

<p class="eyebrow">Teil V · Trainingspipeline</p>

## Next-Token-Loss in PyTorch

```python
import torch
import torch.nn.functional as F

torch.manual_seed(1)
i = torch.randint(len(data) - 257, (16,))    # 16 zufällige Fenster
w = torch.stack([torch.from_numpy(data[j : j + 257].astype("int64")) for j in i.tolist()])
x, y = w[:, :-1], w[:, 1:]                   # Ziel = um eins verschoben
logits = model(x)                            # (B, T, V)
loss = F.cross_entropy(logits.reshape(-1, logits.size(-1)), y.reshape(-1))

V = logits.size(-1)
print(f"Loss {loss.item():.2f}, ln V = {torch.log(torch.tensor(V)).item():.2f}")
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->`cross_entropy` erwartet **Logits**, nicht Wahrscheinlichkeiten: kein Softmax davor. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Die Verschiebung um eine Position ist die ganze Idee des kausalen Sprachmodells.
</div>

## Batch, Sequenzlänge, Tokens pro Schritt

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Tokens pro Schritt** = Batchgröße $B$ × Sequenzlänge $T$, z. B. 16 × 256 = 4.096. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Vergleichen Sie Läufe über **verarbeitete Tokens**, nicht über Schritte: Das GPT-3-Paper gibt sogar das Warmup in Tokens an (375 Mio.). 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Speicher:** Aktivierungen dominieren den Trainingsspeicher und wachsen mit $B \\cdot T$, die Attention-Gewichte zusätzlich mit $T^2$. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Gepackte Sequenzen** enthalten an jeder Position echten Text; Padding kostet Rechenzeit ohne Lernsignal. 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->Größerer Batch: weniger Rauschen im Gradienten, weniger Schritte für dasselbe Token-Budget. Batches, die nicht in den Speicher passen, folgen in Teil X. 

<div class="fragment" data-fragment-index="6">

<small>Brown et al. 2020, arXiv:2005.14165 · Micikevicius et al. 2018, arXiv:1710.03740</small>

</div>
</div>

## Lernrate: Warmup und Cosine Decay

<div class="two-col"><div style="flex: 50">

Warmup für $t < W$:

$$ \\eta\_t = \\eta\_{\\max} \\cdot \\frac{t+1}{W+1} $$

Cosine Decay für $W \\le t \\le S$:

$$ \\eta\_t = \\eta\_{\\min} + \\tfrac{1}{2}\\left(\\eta\_{\\max} - \\eta\_{\\min}\\right)\\left(1 + \\cos\\left(\\pi \\, \\frac{t-W}{S-W}\\right)\\right) $$

</div><div style="flex: 50">

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Warmup:** In den ersten $W$ Schritten steigt die Lernrate linear von fast null auf $\\eta\_{\\max}$. Der Original-Transformer nutzt 4.000 Warmup-Schritte. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Cosine Decay:** Danach fällt sie entlang einer halben Kosinuswelle bis $\\eta\_{\\min}$. Der Schedule braucht nur Start-Lernrate und Laufzeit. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Beides hängt **nur von der Schrittzahl** ab: Zum Fortsetzen genügt der Zähler. 

</div></div>

<div class="fragment" data-fragment-index="4">

<small>Vaswani et al. 2017, arXiv:1706.03762 · Loshchilov, Hutter 2017 (SGDR), arXiv:1608.03983, Gl. (5)</small>

</div>
</div>

</script></section><section data-separator="?

## Warmup und Cosine mit `LambdaLR`

```python
import math
import torch

warmup, total, min_ratio = 100, 2000, 0.1

def lr_factor(step):
    if step < warmup:
        return (step + 1) / (warmup + 1)
    progress = min(1.0, (step - warmup) / (total - warmup))
    return min_ratio + 0.5 * (1 - min_ratio) * (1 + math.cos(math.pi * progress))

optimizer = torch.optim.AdamW(model.parameters(), lr=1e-3)
scheduler = torch.optim.lr_scheduler.LambdaLR(optimizer, lr_factor)
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->`LambdaLR` multipliziert die Basis-Lernrate (`lr=1e-3`) mit dem Faktor aus `lr_factor`. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Aufruf je Schritt: erst `optimizer.step()`, dann `scheduler.step()`; die aktuelle Lernrate liefert `scheduler.get_last_lr()`.
</div>

</script></section><section data-separator="?

## AdamW: entkoppelter Weight Decay

Bei Adam mit L2-Term läuft der Gradient des Regularisierers durch die adaptive Normierung: Gewichte mit großen Gradienten werden schwächer regularisiert.

$$ \\theta\_t \\leftarrow \\theta\_{t-1} - \\eta\_t \\left( \\alpha \\, \\frac{\\hat m\_t}{\\sqrt{\\hat v\_t} + \\epsilon} + \\lambda \\, \\theta\_{t-1} \\right) $$

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->$\\alpha$ skaliert nur den **adaptiven Schritt**; $\\lambda\\theta\_{t-1}$ steht daneben und wird nicht durch $\\sqrt{\\hat v\_t}$ geteilt. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->$\\eta\_t$ ist der **Schedule-Multiplikator** (Warmup, Cosine). 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Defaults im Paper: $\\alpha = 0{,}001$, $\\beta\_1 = 0{,}9$, $\\beta\_2 = 0{,}999$, $\\epsilon = 10^{-8}$. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Berichtet: Testfehler um rund 15 % (relativ) niedriger als bei Adam mit L2 (CIFAR-10, ImageNet32x32). 

<div class="fragment" data-fragment-index="5">

<small>Loshchilov, Hutter 2019 (Decoupled Weight Decay Regularization), arXiv:1711.05101, Algorithmus 2</small>

</div>
</div>

</script></section><section data-separator="?

<p class="eyebrow">Teil V · Trainingspipeline</p>

## AdamW in PyTorch

```python
params = [p for p in model.parameters() if p.requires_grad]
decay = [p for p in params if p.dim() >= 2]       # Matrizen, Embeddings
no_decay = [p for p in params if p.dim() < 2]     # Biases, Norm-Gewichte

optimizer = torch.optim.AdamW(
    [{"params": decay, "weight_decay": 0.1},
     {"params": no_decay, "weight_decay": 0.0}],
    lr=1e-3,
    betas=(0.9, 0.95),
    eps=1e-8,
)
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Weight Decay nur auf **Tensoren mit mindestens zwei Dimensionen**: Biases und LayerNorm- bzw. RMSNorm-Gewichte bleiben ausgenommen. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->$\\beta\_2 = 0{,}95$ statt 0,999: wie bei GPT-3, OPT und nanoGPT (nächste Folie).
</div>

## Autocast und GradScaler

```python
device_type = "cuda" if torch.cuda.is_available() else "cpu"
use_fp16 = device_type == "cuda"
dtype = torch.float16 if use_fp16 else torch.bfloat16
scaler = torch.amp.GradScaler(device_type, enabled=use_fp16)

with torch.autocast(device_type=device_type, dtype=dtype):
    logits = model(x)
    loss = F.cross_entropy(logits.flatten(0, 1), y.flatten())
scaler.scale(loss).backward()          # Backward außerhalb von autocast
scaler.unscale_(optimizer)             # vor dem Clipping
grad_norm = torch.nn.utils.clip_grad_norm_(model.parameters(), 1.0)
scaler.step(optimizer)                 # überspringt den Schritt bei inf/NaN
scaler.update()
optimizer.zero_grad(set_to_none=True)
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->fp16 braucht `autocast` **und** `GradScaler`; bf16 auf der CPU nur `autocast`. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Mit `enabled=False` reicht der Scaler alles unverändert durch: ein Code für beide Pfade.
</div>

</script></section><section data-separator="?

## Mixed Precision je Hardware

| Technik | CUDA | Apple MPS (PyTorch) | MLX | CPU |
|---|---|---|---|---|
| fp16-Autocast | Standard | implementiert, fehlt in der Doku-Liste | kein Autocast, Dtypes explizit | möglich; Default-Dtype bf16 |
| bf16-Autocast | ja | in den Tests geprüft | `bfloat16` als Dtype | ja, ohne Scaler |
| GradScaler | Standardpfad | im Quelltext v2.14.1, Docstring nennt nur cuda/cpu | kein Scaler | `GradScaler("cpu")` |
| float64 | ja | nein | nur auf der CPU | ja |

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Auf MPS ist **mehr implementiert als dokumentiert**: Quelltext und Tests sind der Beleg, nicht die Doku. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Wie stark Mixed Precision auf MPS oder MLX beschleunigt, belegt keine Messung: selbst messen. 

<div class="fragment" data-fragment-index="3">

<small>PyTorch 2.14, torch.amp; Quelltext v2.14.1 (autocast_mode.cpp, grad_scaler.py, test_autocast.py, test_mps.py) · MLX 0.32.3, Data Types</small>

## Gradient Clipping

$$ \\text{wenn } \\lVert g \\rVert \\ge c: \\quad g \\leftarrow \\frac{c}{\\lVert g \\rVert} \\, g $$

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Ein begrenzter Schritt führt aus einer Region hoher Krümmung zurück, statt das Modell weit wegzuschleudern. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->`clip_grad_norm_` behandelt **alle Gradienten als einen Vektor**, ändert sie in-place und gibt die Norm **vor** dem Clipping zurück. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Diese Norm ist die wichtigste Diagnosekurve neben dem Loss: **immer mitloggen**. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Große Läufe clippen bei globaler Norm 1,0. 

<div class="fragment" data-fragment-index="5">

<small>Pascanu, Mikolov, Bengio 2013, arXiv:1211.5063 · PyTorch 2.14, torch.nn.utils.clip_grad_norm_</small>

</div>
</div>

</script></section><section data-separator="?

## Was in einen Checkpoint gehört

| Bestandteil | Warum |
|---|---|
| Modellgewichte | Ausgangspunkt |
| Optimizer-Zustand | Momente $m$ und $v$ von AdamW für jeden Parameter |
| Scheduler-Zustand oder Schrittzähler | Lernrate an der richtigen Stelle |
| GradScaler-Zustand | `scale`, `growth_factor`, `backoff_factor`, `growth_interval`, `_growth_tracker` |
| RNG-Zustände | Python `random`, NumPy, CPU-Torch, CUDA |
| Datenposition | welche Batches schon gesehen wurden |
| Konfiguration und Laufzähler | Architektur, Hyperparameter, bester Validierungsloss |

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Der HF-`Trainer` sichert "model checkpoint, optimizer, scheduler, scaler, RNG states, and trainer state". 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->nanoGPT sichert weder Scaler noch RNG: Das Fortsetzen ist in keinem Pfad bitgenau; im fp16-Pfad fehlt zusätzlich der Scale.
</div>

## Checkpoint speichern

```python
import random
import numpy as np
import torch

torch.save({
    "model": model.state_dict(),
    "optimizer": optimizer.state_dict(),
    "scheduler": scheduler.state_dict(),
    "scaler": scaler.state_dict(),
    "step": step,                       # bestimmt die Lernrate
    "config": config,
    "rng": {"python": random.getstate(),
            "numpy": np.random.get_state(),
            "torch": torch.get_rng_state(),
            "cuda": torch.cuda.get_rng_state_all()},
}, f"ckpt/step_{step:06d}.pt")
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Ein **Dictionary** mit allen Zuständen, state_dicts statt ganzer Objekte: auch nach Codeänderungen ladbar. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->`scaler.state_dict()` ist leer, wenn der Scaler abgeschaltet ist; `load_state_dict` tut dann nichts, solange der ladende Scaler ebenfalls aus ist (ein aktiver wirft `RuntimeError`: Falle CPU → GPU).
</div>

## Checkpoint laden und fortsetzen

```python
ckpt = torch.load("ckpt/step_000100.pt", weights_only=False)  # eigene Datei
model.load_state_dict(ckpt["model"])
optimizer.load_state_dict(ckpt["optimizer"])
scheduler.load_state_dict(ckpt["scheduler"])
scaler.load_state_dict(ckpt["scaler"])
random.setstate(ckpt["rng"]["python"])
np.random.set_state(ckpt["rng"]["numpy"])
torch.set_rng_state(ckpt["rng"]["torch"])
if torch.cuda.is_available():
    torch.cuda.set_rng_state_all(ckpt["rng"]["cuda"])
start_step = ckpt["step"]                # Zahl erledigter Schritte
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Seit PyTorch 2.6 ist `weights_only=True` Default: Der NumPy-Zustand braucht dann eine Allowlist oder `weights_only=False` (nur für eigene Dateien). 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Datenposition:** Hängt der Inhalt eines Batches nur von der Schrittzahl ab, genügt `start_step`. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->PyTorch garantiert keine bitgleichen Ergebnisse über Releases und Plattformen hinweg, auch nicht zwischen CPU und GPU.
</div>

## Loss-Spitzen und Divergenz in großen Läufen

| Symptom | Beobachtung und Reaktion | Lauf |
|---|---|---|
| Spitzen trotz Clipping | rund 20 Spitzen, unregelmäßig, teils spät; Neustart rund 100 Schritte vorher, 200 bis 500 Batches übersprungen | PaLM |
| gleiche Batches, früherer Checkpoint | keine Spitze: Ursache ist die Kombination aus Daten und Parameterzustand | PaLM |
| Divergenz | dynamischer Loss-Scalar fällt auf 0, Aktivierungen der letzten Schicht wachsen; Neustart, Clipping 1,0 → 0,3 | OPT |
| inf/NaN unter fp16 | `scaler.step` überspringt den Schritt, der Scale halbiert sich und kann unter 1 fallen | PyTorch AMP |

<div class="fragment" data-fragment-index="1">

<small>Chowdhery et al. 2022, arXiv:2204.02311 · Zhang et al. 2022, arXiv:2205.01068 · PyTorch 2.14, torch.amp</small>

</div>

## Kurven lesen: was zuerst prüfen

| Symptom | Zuerst ansehen |
|---|---|
| Start-Loss weit weg von $\\ln V$ | Verschiebung der Ziele, kausale Maske, Initialisierung |
| Spitze, danach Erholung | Grad-Norm im selben Schritt, Batch-Index, Inhalt dieses Batches |
| Loss wird NaN oder inf | erster Schritt mit nicht endlichem Wert, Dtype, Scale des GradScalers |
| Loss stagniert früh | Lernratenkurve (läuft der Scheduler?), Gradienten (überhaupt ungleich null?) |
| Train fällt, Validierung steigt | Overfitting |
| Validierung verdächtig gut, kaum Abstand zu Train | Dubletten zwischen Train und Validierung |

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Loss, Lernrate, Grad-Norm und Scale **im selben Schritt** loggen: Ursache und Wirkung liegen dann übereinander. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Den **Batch-Index** mitschreiben, sonst finden Sie den auslösenden Batch nicht wieder.
</div>

## Prüfungen im Trainingsschritt

```python
with torch.autocast(device_type=device_type, dtype=dtype):
    loss = F.cross_entropy(model(x).flatten(0, 1), y.flatten())
if not torch.isfinite(loss):
    raise RuntimeError(f"Loss nicht endlich: Schritt {step}, Batch {batch_idx}")

scaler.scale(loss).backward()
scaler.unscale_(optimizer)
grad_norm = torch.nn.utils.clip_grad_norm_(
    model.parameters(), 1.0, error_if_nonfinite=not use_fp16)
scaler.step(optimizer)
scaler.update()
scheduler.step()
optimizer.zero_grad(set_to_none=True)
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Unter fp16 sind einzelne inf-Gradienten normal: Der Scaler überspringt den Schritt. `error_if_nonfinite` nur **ohne** Scaler einschalten. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Ein NaN-Loss dagegen ist immer ein Abbruchgrund: Checkpoint davor laden, Batch untersuchen.
</div>

## Reproduzierbarkeit: drei Versionen pro Lauf

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Daten:** Hash des tokenisierten Datensatzes, Version des Provenienz-Manifests, Hash der Tokenizer-Datei. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Konfiguration:** alle Hyperparameter einschließlich Seed, Schedule, Präzision und `device`. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Code:** Git-Commit und ob das Arbeitsverzeichnis sauber war; dazu PyTorch-Version und Hardware. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->`torch.manual_seed(1)` setzt den Seed für jedes `device`; `torch.use_deterministic_algorithms(True)` erzwingt deterministische Kernel, wo es sie gibt, und bricht ab, wo es keine gibt (`warn_only=True` warnt nur). 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->Tracking macht Läufe **vergleichbar**, reproduzierbar werden sie erst, wenn Daten und Code versioniert sind.

## Zusammenfassung

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Der erste Loss liegt bei $\\ln V$; sonst stimmt am Aufbau etwas nicht. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Tokens pro Schritt** ($B \\cdot T$) planen; Läufe über verarbeitete Tokens vergleichen, nicht über Schritte. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Warmup** hält die ersten Schritte stabil: Ohne Warmup macht dieselbe Spitzen-Lernrate sie instabil. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**AdamW** mit entkoppeltem Decay, Decay nur auf Matrizen; Clipping bei Norm 1,0. Grad-Norm und Batch-Index immer im selben Schritt wie den Loss loggen, um Loss-Spitzen und NaN zu diagnostizieren. 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->**fp16** braucht GradScaler, **bf16** nicht; auf MPS ist laut Quelltext und Tests mehr implementiert als dokumentiert. 
- &shy;<!-- .element: class="fragment" data-fragment-index="6" -->**Fortsetzen** ist nur mit Optimizer-, Scheduler-, Scaler- und RNG-Zustand und der Datenposition dasselbe Training. 
- &shy;<!-- .element: class="fragment" data-fragment-index="7" -->Jeder Run trägt **Daten-Hash, vollständige Konfiguration und Git-Commit**.
</div>

## Lernziele

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Training von Grund auf**, **Weitertraining** und **Fine-Tuning** unterscheiden 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->die Wahl mit **Datenmenge, Domänenabstand, Kosten und Risiko** begründen 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Daten- und Rechenbedarf mit der **Chinchilla-Faustregel** abschätzen 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->die gängigen **Fine-Tuning-Muster** einordnen: Full, nur Kopf, Instruction-Tuning, Präferenz-Optimierung
</div>

<p class="eyebrow">Teil VI · Adaption</p>

## Drei Wege zu einem angepassten Modell

| Weg | Was trainiert wird | Daten | Ausgangspunkt |
|---|---|---|---|
| **Training von Grund auf** | alle Gewichte ab Zufallsinitialisierung | sehr viel Rohtext, eigener Tokenizer möglich | nichts |
| **Weitertraining** (continued pretraining) | alle Gewichte, weiter mit Next-Token-Loss | viel ungelabelter Domänentext | Basismodell samt Tokenizer |
| **Fine-Tuning** | alle oder ein Teil der Gewichte, für eine Zielaufgabe | gelabelte Beispiele oder Dialoge | vortrainiertes Modell |

<div class="fragment" data-fragment-index="1">

IMDb-Sentiment: LSTM von Grund auf 85,66 %, ULMFiT (vortrainiert, dann feinabgestimmt) 95,4 %, ModernBERT feinabgestimmt rund 95 %.

<small>Raschka 2026, Language Models for Text Classification: From Bag-of-Words to Jev</small>

</div>
</div>

<p class="eyebrow">Teil VI · Adaption</p>

## Entscheidungskriterien

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Datenmenge:** Reicht Ihr Text für ein Modell der gewünschten Größe? Haben Sie gelabelte Beispiele? 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Domänenabstand:** Wie fremd sind Wortschatz, Stil und Aufbau Ihrer Texte für das Basismodell? 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Kosten:** Rechenzeit für Training und jede Wiederholung, dazu Datenaufbereitung und Evaluation. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Risiko:** Was verliert das Modell an allgemeinen Fähigkeiten, und was merkt es sich aus internen Daten?
</div>

</script></section><section data-separator="?

<p class="eyebrow">Teil VI · Adaption</p>

## Datenmenge und Rechenaufwand

| Parameter | Tokens (compute-optimal) | Tokens je Parameter | Trainings-FLOPs |
|---|---|---|---|
| 400 Mio. | 8,0 Mrd. | 20 | 1,92 · 10¹⁹ |
| 1 Mrd. | 20,2 Mrd. | 20 | 1,21 · 10²⁰ |
| 10 Mrd. | 205,1 Mrd. | 21 | 1,23 · 10²² |

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Faustregel: **rund 20 Tokens je Parameter**; Modellgröße und Tokenzahl wachsen im gleichen Verhältnis. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Rechenaufwand $C \\approx 6\\,N\\,D$ ($N$ Parameter, $D$ Tokens). 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Ein Mini-GPT mit 5 Mio. Parametern kommt nach der Faustregel mit rund 100 Mio. Tokens aus. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Beim Fine-Tuning zahlen Sie nur die Tokens des Fine-Tuning-Datensatzes; das Vortraining hat jemand anderes bezahlt. 

<div class="fragment" data-fragment-index="5">

<small>Hoffmann et al. 2022 (Chinchilla), arXiv:2203.15556, Tabelle 3</small>

</div>
</div>

## Domänenabstand: Weitertraining

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Weitertraining** setzt das Vortraining mit dem Next-Token-Loss auf Domänentext fort, ohne Labels. FinBERT ist BERT, weitertrainiert auf Finanztexten und danach für Sentiment feinabgestimmt. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Die Pipeline ist die aus Teil V: Schedule, AdamW, Checkpoints, Tracking. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Der **Tokenizer bleibt** der des Basismodells: Ein englischer Tokenizer bleibt auf deutschen Gesetzestexten teuer. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Ob es sich lohnt, zeigt bei kausalen Modellen die **Perplexity des Basismodells** auf einem Holdout aus Ihren Texten, vorher und nachher (Teil VII); bei BERT-artigen Modellen wie FinBERT der Masked-LM-Loss. 

<div class="fragment" data-fragment-index="5">

<small>Araci 2019, FinBERT, arXiv:1908.10063</small>

</div>
</div>

<p class="eyebrow">Teil VI · Adaption</p>

## Risiko: Vergessen und Memorisierung

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Vergessen:** InstructGPT verlor durch das RLHF-Fine-Tuning (Reinforcement Learning from Human Feedback) Leistung auf öffentlichen NLP-Benchmarks ("alignment tax"). Gegenmittel im Paper: Gradienten aus den Vortrainingsdaten beimischen. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Deshalb messen Sie bei jedem Fine-Tuning **vorher und nachher auch allgemeine Fähigkeiten**, nicht nur die Zielaufgabe. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Memorisierung:** Der Extraktionsangriff auf GPT-2 holte Namen, Telefonnummern und UUIDs aus einzelnen Trainingsdokumenten (Teil II). 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Dubletten im Datensatz verstärken das stark: Zehnfach vorhandene Sequenzen werden im Mittel etwa 1.000-mal häufiger erzeugt. 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->Interne Daten im Fine-Tuning sind damit ein **Datenschutzthema**, nicht nur eine Qualitätsfrage. 

<div class="fragment" data-fragment-index="6">

<small>Ouyang et al. 2022, arXiv:2203.02155 · Carlini et al. 2021, arXiv:2012.07805 · Kandpal et al. 2022, arXiv:2202.06539</small>

</div>
</div>

<p class="eyebrow">Teil VI · Adaption</p>

## Fine-Tuning-Muster

| Muster | Trainiert | Daten | Typischer Einsatz |
|---|---|---|---|
| **Full-Fine-Tuning** | alle Gewichte | gelabelte Beispiele | Aufgabe weicht stark ab, genug Daten und Speicher |
| **Nur der Kopf** | neue Ausgabeschicht, Backbone eingefroren; eine einzige lineare Schicht heißt **Linear Probe** | wenige gelabelte Beispiele | Klassifikation, Test, ob die Repräsentation reicht |
| **Instruction-Tuning** (SFT, Supervised Fine-Tuning) | alle Gewichte | Dialoge im Chat-Template | Format, Stil, Anweisungen befolgen |
| **Präferenz-Optimierung** (DPO, Direct Preference Optimization) | alle Gewichte, Referenzmodell fest | Paare aus besserer und schlechterer Antwort | Antwortqualität nach SFT |

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Full-Fine-Tuning mit AdamW in fp32 braucht je Parameter rund 16 Byte: Gewicht, Gradient und zwei Momente. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Parametereffiziente Varianten (Adapter, LoRA) folgen in Teil IX.
</div>

<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<p class="eyebrow">Teil VI · Adaption</p>

## Nur den Kopf trainieren

```python
import torch
from transformers import AutoModelForSequenceClassification, AutoTokenizer

areas = ["Arbeits- und Sozialrecht", "Steuerrecht", "Strafrecht",
                 "Zivilrecht", "Öffentliches Recht"]
name = "models/distilbert-german"                 # lokale Kopie, Encoder mit [CLS]
tok = AutoTokenizer.from_pretrained(name)
model = AutoModelForSequenceClassification.from_pretrained(
    name, num_labels=len(areas))

for p in model.base_model.parameters():           # Backbone einfrieren
    p.requires_grad = False
head = [p for p in model.parameters() if p.requires_grad]
print(sum(p.numel() for p in head))               # nur der Kopf
optimizer = torch.optim.AdamW(head, lr=1e-3)
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->BERT gibt den Aufbau vor: vortrainiertes Modell plus **eine zusätzliche Ausgabeschicht**; im Paper werden alle Gewichte trainiert, hier bleibt das Backbone eingefroren. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Kein Gradient durch das Backbone: wenig Speicher, schnelle Epochen; die Repräsentation bleibt, wie sie ist. 

<div class="fragment" data-fragment-index="3">

<small>Devlin et al. 2019, BERT, arXiv:1810.04805</small>

## Instruction-Tuning mit Chat-Template

```python
from transformers import AutoTokenizer

tok = AutoTokenizer.from_pretrained("HuggingFaceTB/SmolLM2-135M-Instruct")
messages = [
    {"role": "user", "content": "Welchem Rechtsgebiet gehört § 433 BGB an?"},
    {"role": "assistant", "content": "Dem Zivilrecht, genauer dem Kaufrecht im Schuldrecht."},
]
full = tok.apply_chat_template(messages, tokenize=False)
prompt = tok.apply_chat_template(messages[:1], tokenize=False, add_generation_prompt=True)

ids = tok(full, add_special_tokens=False)["input_ids"]
n_prompt = len(tok(prompt, add_special_tokens=False)["input_ids"])
labels = [-100] * n_prompt + ids[n_prompt:]      # Loss nur auf der Antwort
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Das **Chat-Template** legt Rollen und Spezialtokens fest; Training und Inferenz müssen dasselbe Template nutzen. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Prompt-Positionen bekommen das Label **−100**, das `cross_entropy` ignoriert: Gelernt wird nur die Antwort. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->InstructGPT: SFT auf rund 13.000 Trainings-Prompts mit Demonstrationen, 16 Epochen, Cosine Decay.

## Präferenz-Optimierung (Ausblick)

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Daten: zu einem Prompt eine **bevorzugte** und eine **abgelehnte** Antwort. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**RLHF** trainiert erst ein Reward-Modell und optimiert dann die Policy mit RL; **DPO** erreicht dasselbe Ziel mit einem einfachen Klassifikations-Loss, ohne Reward-Modell und ohne RL-Schleife. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Ein festes **Referenzmodell** hält die Policy in seiner Nähe: Der Loss erhöht die relative Log-Wahrscheinlichkeit der bevorzugten gegenüber der abgelehnten Antwort. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Labeler zogen die Ausgaben von InstructGPT (1,3 Mrd. Parameter, SFT plus RLHF) denen von GPT-3 (175 Mrd.) vor.

## Perplexity: Definition

Für eine tokenisierte Sequenz $X = (x\_1, \\dots, x\_t)$:

$$\\text{PPL}(X) = \\exp\\Big(-\\frac{1}{t}\\sum\_{i=1}^{t} \\log p\_\\theta(x\_i \\mid x\_{<i})\\Big)$$

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Der Exponent ist die **mittlere Cross-Entropy pro Token**, also genau der Trainings-Loss in nats. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Ein Loss von 2,0 nats pro Token ergibt $e^{2} \\approx 7{,}4$: Das Modell ist im Mittel so unsicher, als wählte es gleichverteilt unter gut sieben Tokens. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Definiert für **kausale** Sprachmodelle; für maskierte Modelle wie BERT ist Perplexity nicht sauber definiert. 

<div class="fragment" data-fragment-index="4">

<small>Hugging Face Transformers, "Perplexity of fixed-length models" · Hugging Face evaluate, Metrik-Karte Perplexity</small>

</div>
</div>

</script></section><section data-separator="?

<p class="eyebrow">Teil VII · Evaluation</p>

## Perplexity für lange Texte: gleitendes Fenster

Ein Modell sieht höchstens $L$ Tokens Kontext. Ein Holdout aus dem Gesetzeskorpus ist viel länger.

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Disjunkte Abschnitte:** schnell, aber viele Tokens stehen mit wenig Kontext da, die Perplexity fällt **zu schlecht** aus. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Gleitendes Fenster mit Schrittweite (stride):** je Fenster werden nur die neuen Tokens bewertet, der Rest dient als Kontext. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->GPT-2 large auf WikiText-2, Kontext 1024: **19,44** mit stride 1024, **16,44** mit stride 512. Gleiches Modell, gleiche Daten: Ohne Fensterlänge und stride ist eine Angabe nicht vergleichbar.

</div>

<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<p class="eyebrow">Teil VII · Evaluation</p>

## Perplexity mit gleitendem Fenster im Code

```python
import math, torch
from transformers import AutoModelForCausalLM, AutoTokenizer

model_id = "HuggingFaceTB/SmolLM2-135M"
tok = AutoTokenizer.from_pretrained(model_id)
model = AutoModelForCausalLM.from_pretrained(model_id, dtype=torch.float32).eval()
text = open("holdout.txt", encoding="utf-8").read()
ids = tok(text, return_tensors="pt").input_ids

max_len, stride, nll, n, prev_end = 1024, 512, 0.0, 0, 0
for begin in range(0, ids.size(1), stride):
    end = min(begin + max_len, ids.size(1))
    inp = ids[:, begin:end]
    tgt = inp.clone()
    tgt[:, : -(end - prev_end)] = -100           # nur neue Tokens bewerten
    with torch.no_grad():
        loss = model(inp, labels=tgt).loss       # Mittel über gültige Labels
    n_new = (tgt[:, 1:] != -100).sum().item()    # Labels intern um 1 verschoben
    nll, n, prev_end = nll + loss.item() * n_new, n + n_new, end
    if end == ids.size(1):
        break
print("PPL", math.exp(nll / n))
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->`-100` blendet Kontext-Tokens aus dem Loss aus; `nll` brauchen wir gleich noch einmal.
</div>

</script></section><section data-separator="?

## Perplexity hängt am Tokenizer

Dasselbe Wort, zwei Segmentierungen, zwei Modelle (Berechnung nach Mielke):

| Modell | Segmentierung | Einheiten (+ Ende) | PPL je Subwort | NLL des Strings | PPL je Wort |
|---|---|---|---|---|---|
| 1 | `the de@@ forest@@ ation` | 5 | **19** | 14,7 | 134,3 |
| 2 | `the defor@@ estation` | 4 | 24 | **12,7** | **68,9** |

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Modell 2 hat die **schlechtere** Subwort-Perplexity und weist dem Text trotzdem die **höhere** Wahrscheinlichkeit zu. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Perplexity ist ein Mittel **pro Token**: Wer anders segmentiert, ändert den Nenner. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Vergleichbar sind nur Maße, deren Nenner nicht von der Segmentierung abhängt. 

<div class="fragment" data-fragment-index="4">

<small>Mielke 2019, "Can you compare perplexity across different segmentations?" · Cao, Rimell 2021, arXiv:2109.02550</small>

</div>
</div>

<p class="eyebrow">Teil VII · Evaluation</p>

## Bits per Byte

Im Nenner steht die Bytezahl $B$ des Rohtexts, nicht die Tokenzahl:

$$\\text{BPB} = \\frac{-\\sum\_i \\ln p\_\\theta(x\_i \\mid x\_{<i})}{\\ln 2 \\cdot B} = \\frac{T}{B}\\cdot\\frac{\\bar{L}}{\\ln 2}$$

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->$T$ Tokens, $\\bar{L}$ mittlerer Loss in nats pro Token: Der Faktor $T/B$ gleicht die Segmentierung aus. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Vergleich nur bei **identischer Vorverarbeitung** und Unicode-Normalisierung, sonst ändert sich $B$. 

<div class="fragment" data-fragment-index="3">

```python
bpb = nll / (math.log(2) * len(text.encode("utf-8")))   # nll aus dem Fenster-Loop
```

</div>

<div class="fragment" data-fragment-index="4">

<small>Chowdhury, Woolf 2026, ACL Anthology 2026.mellm-1.27 · Hoffmann et al. 2022 (Chinchilla), arXiv:2203.15556</small>

</div>
</div>

<p class="eyebrow">Teil VII · Evaluation</p>

## Aufgabenmetriken

Sobald das Modell eine Aufgabe löst, zählt die Aufgabe, nicht mehr die Perplexity.

| Aufgabe | Metrik | Misst |
|---|---|---|
| Klassifikation, ausgewogene Klassen | **Accuracy** | Anteil richtiger Vorhersagen |
| Klassifikation, unausgewogene Klassen | **Macro-F1** | F1 je Klasse, dann ungewichtet gemittelt |
| Extraktion, kurze Antwort | **Exact Match** | Antwort gleich Referenz (nach Normalisierung) |
| Extraktion, Teiltreffer | **Token-F1** | Überlappung der Wörter mit der Referenz |
| Zusammenfassung | **ROUGE** | n-Gramm-Überlappung, recall-orientiert |
| Übersetzung | **BLEU** | n-Gramm-Präzision gegen Referenzen |

<div class="merk fragment" data-fragment-index="1">

Bei unausgewogenen Klassen kann ein Modell, das nur die häufigste Klasse kennt, eine hohe Accuracy erreichen. Macro-F1 gewichtet jede Klasse gleich und macht das sichtbar.

</div>

<div class="fragment" data-fragment-index="2">

<small>Papineni et al. 2002 (BLEU), ACL · Lin 2004 (ROUGE), ACL Workshop</small>

</div>
</div>

<p class="eyebrow">Teil VII · Evaluation</p>

## Grenzen von ROUGE und BLEU

Referenz: *"Die Frist beträgt zwei Wochen."*

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Antwort A: *"Sie haben 14 Tage Zeit."* Inhaltlich richtig, fast **keine** Wortüberlappung. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Antwort B: *"Die Frist beträgt zwei Monate."* Inhaltlich falsch, **fast vollständige** Überlappung. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->ROUGE und BLEU messen **Oberfläche**, nicht Korrektheit. Exact Match und Token-F1 versagen, sobald viele richtige Formulierungen möglich sind. 

<div class="tipp fragment" data-fragment-index="4">

Für freie Antworten mehrere Referenzen sammeln, die Metrik nur für Vergleiche innerhalb desselben Systems nutzen und eine Stichprobe von Hand prüfen.

</div>
</div>

<p class="eyebrow">Teil VII · Evaluation</p>

## Baselines sind Pflicht

Ein Ergebnis ohne Vergleich sagt nichts. Drei Baselines laufen vor jedem Fine-Tuning:

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Mehrheitsklasse:** sagt immer die häufigste Klasse vorher. Die Accuracy entspricht deren Anteil im Testset. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**TF-IDF + logistische Regression:** lernt schnell auf der CPU, etwa aus Wörtern wie „Kaufsache“ oder aus Zeichen-n-Grammen. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Vortrainiertes Modell:** Zero-Shot mit Rechtsgebieten im Prompt oder logistische Regression auf festen Embeddings (**Linear Probe**). 

<div class="merk fragment" data-fragment-index="4">

Vergleichen Sie Fine-Tuning mit der **besten** Baseline auf demselben Testset und mit derselben Metrik.

</div>

<p class="eyebrow">Teil VII · Evaluation</p>

## Baselines im Code

```python
from sklearn.dummy import DummyClassifier
from sklearn.feature_extraction.text import TfidfVectorizer
from sklearn.linear_model import LogisticRegression
from sklearn.metrics import classification_report, f1_score
from sklearn.pipeline import make_pipeline

baselines = {
    "mehrheit": DummyClassifier(strategy="most_frequent"),
    "tfidf_lr": make_pipeline(
        TfidfVectorizer(analyzer="char_wb", ngram_range=(3, 5), sublinear_tf=True),
        LogisticRegression(max_iter=3000),
    ),
}
for name, clf in baselines.items():
    clf.fit(X_train, y_train)                     # X: Paragraphentexte, y: Rechtsgebiet
    pred = clf.predict(X_test)
    print(name, "Macro-F1", round(f1_score(y_test, pred, average="macro"), 3))
print(classification_report(y_test, pred))       # je Klasse, für tfidf_lr
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Zeichen-n-Gramme** (`char_wb`) erfassen Teile deutscher Komposita: "Mietvertrag" und "Mietverhältnis" haben "Miet" gemeinsam. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Die Pipeline lernt das Vokabular nur auf `X_train`: kein Wissen aus dem Testset.
</div>

<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<p class="eyebrow">Teil VII · Evaluation</p>

## Testsets: Leakage vermeiden

**Leakage** heißt: Information aus dem Testset erreicht das Training. Das Ergebnis wirkt besser, als es ist.

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Zuerst splitten**, dann vorverarbeiten, auswählen und tunen. Das Testset bleibt bis zur letzten Messung verschlossen. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Nach Gruppen splitten:** Paragraphen desselben Gesetzes haben Begriffe und Aufbau gemeinsam. Liegt ein Gesetz ganz im Test, prüft der Test Übertragung statt Wiedererkennen. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Beinahe-Dubletten** über die Split-Grenze hinweg entfernen: Gleichlautende Vorschriften stehen in verschiedenen Gesetzen (ZPO und StPO, AO und VwVfG). Ein Split nach Gesetz kann sie auf beide Seiten legen. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Validierungsset** für Hyperparameter und Early Stopping, nie das Testset. 

<div class="fragment" data-fragment-index="5">

```python
from sklearn.model_selection import GroupShuffleSplit

split = GroupShuffleSplit(n_splits=1, test_size=0.2, random_state=1)
train_idx, test_idx = next(split.split(X, y, groups=law))      # law: z. B. "BGB", "StGB"
```

</div>
</div>

<p class="eyebrow">Teil VII · Evaluation</p>

## Kontamination: Das Modell kennt den Test schon

Ein vortrainiertes Modell hat womöglich genau die Texte gesehen, an denen Sie es prüfen.

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Gesetzestexte stehen frei im Netz** und damit potenziell in jedem Web-Pretraining-Korpus. Das betrifft Zero-Shot und Fine-Tuning gleichermaßen. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**PaLM:** 10 von 29 Benchmarks galten als kontaminiert; ein Testbeispiel zählte als "kontaminiert", wenn mindestens 70 % seiner 8-Gramme im Trainingskorpus vorkamen. Verglichen wurden Ergebnisse auf dem sauberen Teil und auf dem ganzen Set. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Llama 3:** ebenfalls 8-Gramm-Überlappung; wie man Kontamination am besten misst, ist laut dem Team eine offene Forschungsfrage. 

<div class="tipp fragment" data-fragment-index="4">

Ergänzen Sie das Testset um einen kleinen Teil mit Fragen und Formulierungen, die nirgends veröffentlicht sind, und vergleichen Sie ihn mit dem öffentlichen Teil.

</div>

<div class="fragment" data-fragment-index="5">

<small>Chowdhery et al. 2022 (PaLM), arXiv:2204.02311, Abschnitt 8 · Llama Team 2024, arXiv:2407.21783, Abschnitt 5.1.4</small>

</div>
</div>

<p class="eyebrow">Teil VII · Evaluation</p>

## Robustheit

Ein gutes Ergebnis auf dem Testset zeigt noch nicht, dass es hält, wenn sich die Eingabe leicht ändert.

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Format und Reihenfolge:** Wortlaut des Prompts, Reihenfolge der Antwortoptionen, Bezeichnung der Labels. Laut früheren Studien ändern sich dabei Scores und sogar Rangfolgen. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Verräterische Merkmale:** Eine Paragraphenüberschrift wie "Kaufvertrag" kann das Rechtsgebiet schon allein nahelegen. Messen Sie mit und ohne Überschrift. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Störungen:** Tippfehler, gekürzte Paragraphen, Paraphrasen. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Zeit:** ältere oder neuere Fassungen eines Gesetzes. 

<div class="merk fragment" data-fragment-index="5">

Robustheit messen Sie mit derselben Metrik auf einem veränderten Testset. Berichten Sie den Abstand zur unveränderten Fassung.

</div>
</div>

</script></section><section data-separator="?

<p class="eyebrow">Teil VII · Evaluation</p>

## Unterschied oder Rauschen?

Ein Testset ist eine Stichprobe. Für einen Anteil $S$ (Accuracy, Exact Match) auf $N$ Beispielen gilt näherungsweise:

$$\\text{KI}\_{95\\,\\%}(S) = S \\pm 1{,}96\\sqrt{\\frac{S(1-S)}{N}}$$

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->$S = 0{,}80$, $N = 400$: **± 3,9 Prozentpunkte**. 80 % gegen 83 % liegt innerhalb dieser Unsicherheit; ob der Unterschied belegt ist, zeigt erst der gepaarte Vergleich (nächste Folie). 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->$N = 200$: schon ± 5,5 Prozentpunkte. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Das Intervall erfasst nur den Stichprobenfehler des Testsets. Seeds, Datenreihenfolge und Hardware kommen noch dazu. 

<div class="fragment" data-fragment-index="4">

<small>Llama Team 2024, arXiv:2407.21783, "Significance estimates"</small>

</div>
</div>

</script></section><section data-separator="?

<p class="eyebrow">Teil VII · Evaluation</p>

## Seeds und gepaarter Vergleich

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Mehrere Seeds** (1, 2, 3) für jedes trainierte Modell: Mittelwert und Spannweite berichten, nicht den besten Lauf. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Gepaarter Bootstrap:** beide Modelle auf **denselben** Testbeispielen vergleichen, die Beispiele mit Zurücklegen ziehen. 

<div class="fragment" data-fragment-index="3">

```python
import numpy as np
from sklearn.metrics import f1_score

def mf1(y, p): return f1_score(y, p, average="macro")

rng = np.random.default_rng(1)
diffs = []
for _ in range(10_000):
    idx = rng.integers(0, len(y_test), len(y_test))   # Beispiele mit Zurücklegen
    diffs.append(mf1(y_test[idx], pred_ft[idx]) - mf1(y_test[idx], pred_lr[idx]))  # NumPy-Arrays
lo, hi = np.percentile(diffs, [2.5, 97.5])
print(f"Differenz {mf1(y_test, pred_ft) - mf1(y_test, pred_lr):+.3f}, 95-%-Intervall [{lo:+.3f}, {hi:+.3f}]")
```

</div>

<div class="merk fragment" data-fragment-index="4">

Enthält das Intervall die Null, ist der Unterschied nicht belegt.

</div>
</div>

</script></section><section data-separator="?

<p class="eyebrow">Teil VII · Evaluation</p>

## LLM-as-Judge: Ergänzung mit Grenzen

Ein starkes LLM bewertet freie Antworten, für die keine eindeutige Referenz existiert.

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Position:** Bei paarweisem Vergleich bevorzugt der LLM-Judge oft je nach Reihenfolge A oder B. Beide Reihenfolgen bewerten. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Länge und Stil:** Längere, flüssigere Antworten gewinnen, auch wenn sie falsch sind. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Eigene Modellfamilie:** LLM-Judges bevorzugen Texte, die ihrem eigenen Stil ähneln. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Aufgabentyp:** Bei Mathematik und mehrstufigem Reasoning urteilen LLM-Judges schwächer. Referenzantwort und Quellen mitgeben. 

<div class="warn fragment" data-fragment-index="5">

Der LLM-Judge ist kein Messgerät. Kalibrieren Sie ihn an 50–100 von Menschen bewerteten Beispielen, versionieren Sie Prompt und Modell, und lassen Sie ihn nie allein über rechtliche Aussagen entscheiden.

</div>

<div class="fragment" data-fragment-index="6">

<small>Zheng et al. 2023 (MT-Bench), arXiv:2306.05685 · Wang et al. 2023, arXiv:2305.17926 · Dubois et al. 2024, arXiv:2404.04475</small>

</div>
</div>

<p class="eyebrow">Teil VII · Evaluation</p>

## Zusammenfassung

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Perplexity** ist die Exponentialfunktion des mittleren Token-Loss; für lange Texte mit gleitendem Fenster rechnen. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Perplexity ist nur bei **gleichem Tokenizer** und gleichem Auswerteverfahren vergleichbar; **Bits per Byte** teilt durch die Bytezahl. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Die **Metrik** folgt der Aufgabe: Macro-F1 bei unausgewogenen Klassen, ROUGE und BLEU nur als Oberflächenmaß. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Baselines** zuerst: Mehrheitsklasse, TF-IDF + logistische Regression, ein vorhandenes Modell ohne Fine-Tuning (Zero-Shot oder Linear Probe). 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->**Testsets** gruppiert splitten, auf Kontamination prüfen, Robustheit messen. 
- &shy;<!-- .element: class="fragment" data-fragment-index="6" -->Unterschiede mit **Konfidenzintervall** und mehreren Seeds belegen; **LLM-as-Judge** ist nur eine Ergänzung, kalibriert an Menschenurteilen. 

<div class="fragment" data-fragment-index="7">

**Transfer:** Messen Sie Ihr nächstes Modell zuerst an der billigsten Lösung, die die Aufgabe schon halbwegs löst.

</div>
</div>

## Lernziele

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->die Stufen einer **RAG-Pipeline** (Retrieval-Augmented Generation) benennen: Chunking, Embeddings, Retrieval, Re-Ranking, Prompt 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**dense Suche, BM25 und hybride Suche** unterscheiden und auf einem Gold-Set vergleichen 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->einen Prompt mit **Quellen** zusammenstellen 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Retrieval und Antwort **getrennt messen**: Recall@k, MRR (Mean Reciprocal Rank), Groundedness 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->begründet entscheiden: **RAG, Fine-Tuning oder beides**
</div>

<p class="eyebrow">Teil VIII · RAG oder Fine-Tuning</p>

## RAG in drei Schritten

Das Modell bekommt vor der Antwort die passenden Textstellen in den Prompt.

<img src="figs/rag-pipeline.png" alt="" style="object-fit: scale-down">


- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Indexierung:** einmal je Dokument, teuer. Bei einer neuen Gesetzesfassung wird nur das betroffene Dokument neu indexiert. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Abfrage:** bei jeder Frage, billig: **Retrieve → Compose → Generate**. 

<div class="fragment" data-fragment-index="3">

<small>Lewis et al. 2020, arXiv:2005.11401</small>

</div>
</div>

</script></section><section data-separator="?

<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<p class="eyebrow">Teil VIII · RAG oder Fine-Tuning</p>

## Chunking

Ein **Chunk** ist die Einheit, die eingebettet, gefunden und in den Prompt gelegt wird.

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Zu klein:** Zusammenhang reißt ab (Absatz 2 verweist auf Absatz 1). 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Zu groß:** viel Irrelevantes je Chunk, das Embedding wird unscharf. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Struktur nutzen:** Im Gesetzeskorpus ist der Paragraph die natürliche Einheit, bei langen Paragraphen der Absatz. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Feste Fenster mit Überlappung** als Ausgangspunkt für unstrukturierte Texte. 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->**Stabile ID** je Chunk, z. B. `bgb#437`, mit Gesetz, Paragraph und Stand der Fassung als Metadaten. 

<div class="merk fragment" data-fragment-index="6">

Semantisches Chunking (Schnitt an Bedeutungswechseln) kostet deutlich mehr Rechenzeit; Qu et al. fanden keinen durchgängigen Qualitätsgewinn gegenüber festen Fenstern.

</div>
</div>

</script></section><section data-separator="?

" data-separator-vertical="?

" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<p class="eyebrow">Teil VIII · RAG oder Fine-Tuning</p>

## Embeddings und Kosinus-Ähnlichkeit

Ein **Bi-Encoder** bildet Frage und Chunk getrennt auf Vektoren ab. Ähnliche Bedeutung ergibt ähnliche Richtung.

$$\\cos(\\mathbf{q}, \\mathbf{d}) = \\frac{\\mathbf{q}\\cdot\\mathbf{d}}{\\lVert\\mathbf{q}\\rVert\\,\\lVert\\mathbf{d}\\rVert}$$

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Bei **normierten** Vektoren ist das nur noch das Skalarprodukt $\\mathbf{q}\\cdot\\mathbf{d}$. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Chunk-Vektoren hängen nicht von der Frage ab: einmal berechnen, im Index ablegen. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Modellwahl:** mehrsprachig für deutsche Texte; Ranglisten wie MTEB (Massive Text Embedding Benchmark) liefern Kandidaten, es entscheidet die eigene Messung. 

<div class="fragment" data-fragment-index="4">

<small>Reimers, Gurevych 2019 (Sentence-BERT), arXiv:1908.10084 · Muennighoff et al. 2023 (MTEB), arXiv:2210.07316</small>

</div>
</div>

</script></section><section data-separator="?

" data-separator-vertical="?

<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<p class="eyebrow">Teil VIII · RAG oder Fine-Tuning</p>

## Vektorsuche im Code

```python
import numpy as np
from sentence_transformers import SentenceTransformer

model = SentenceTransformer("intfloat/multilingual-e5-small")
texts = [c["text"] for c in chunks]                        # Kopfzeile "Gesetz § Nr Titel" + Text
E = model.encode(["passage: " + t for t in texts],
                 normalize_embeddings=True)                # Matrix (n, 384)

def search(question, k=5):
    q = model.encode(["query: " + question], normalize_embeddings=True)[0]
    scores = E @ q                                         # Kosinus = Skalarprodukt
    top = np.argsort(-scores)[:k]
    return [(chunks[i]["id"], float(scores[i])) for i in top]

question = "Wie lange kann ich Mängel an einer gekauften Sache geltend machen?"
search(question)
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->`normalize_embeddings=True` macht das Skalarprodukt zur Kosinus-Ähnlichkeit. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Für große Korpora dieselbe Suche mit faiss: `index = faiss.IndexFlatIP(384)`, `index.add(E)`, `index.search(q[None], k)`.
</div>

</script></section><section data-separator="?

<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<p class="eyebrow">Teil VIII · RAG oder Fine-Tuning</p>

## Dense, BM25 oder hybrid

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Dense Suche (Embeddings):** stark bei Umschreibungen und Synonymen. "gekaufte Sache hat einen Fehler" findet "Mangel der Kaufsache". 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**BM25 (Wortstatistik):** stark bei exakten Begriffen, Nummern und Zitaten wie "§ 437 BGB" oder "Absatz 2". 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Hybrid:** Beide Suchen laufen parallel, ihre Listen werden fusioniert. Ob das die stärkere Liste allein schlägt, hängt von den Fragen ab: messen. 

<div class="fragment" data-fragment-index="4">

**Reciprocal Rank Fusion** addiert Kehrwerte der Ränge statt Scores, eine Normierung der Scores entfällt:

$$\\text{RRF}(d) = \\sum\_{r \\in \\text{Listen}} \\frac{1}{c + \\text{rang}\_r(d)}, \\qquad c = 60$$

</div>

<div class="fragment" data-fragment-index="5">

<small>Cormack, Clarke, Büttcher 2009, SIGIR</small>

</div>
</div>

</script></section><section data-separator="?
---?
" data-separator-vertical="?

" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="smaller drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<p class="eyebrow">Teil VIII · RAG oder Fine-Tuning</p>

## Hybride Suche im Code

```python
import re
from rank_bm25 import BM25Okapi

def tokens(t): return re.findall(r"\w+", t.lower())       # Wortzeichen, ohne Satzzeichen
bm25 = BM25Okapi([tokens(t) for t in texts])

def bm25_search(question, k=50):
    scores = bm25.get_scores(tokens(question))
    return [chunks[i]["id"] for i in np.argsort(-scores)[:k]]

def rrf(*lists, c=60):
    score = {}
    for ranking in lists:
        for position, doc_id in enumerate(ranking, start=1):
            score[doc_id] = score.get(doc_id, 0.0) + 1 / (c + position)
    return sorted(score, key=score.get, reverse=True)

dense_hits = [doc_id for doc_id, _ in search(question, k=50)]
candidate_ids = rrf(dense_hits, bm25_search(question, k=50))[:50]
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Beide Retriever holen **großzügig** Kandidaten (hier 50): Das richtige Dokument muss erst einmal in der Liste sein.
</div>

</script></section><section data-separator="?
---?

" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="smaller drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<p class="eyebrow">Teil VIII · RAG oder Fine-Tuning</p>

## Re-Ranking mit Cross-Encoder

| | Bi-Encoder | Cross-Encoder |
|---|---|---|
| Eingabe | Frage und Chunk getrennt | Frage und Chunk zusammen |
| Vorberechnung | ja, im Index | nein, je Paar neu |
| Einsatz | Suche im ganzen Index | Neuordnen der Top-50 |
| Genauigkeit | gut | meist deutlich besser |

<div class="fragment" data-fragment-index="1">

```python
from sentence_transformers import CrossEncoder

reranker = CrossEncoder("cross-encoder/mmarco-mMiniLMv2-L12-H384-v1", max_length=256)
text_of = {c["id"]: c["text"] for c in chunks}
scores = reranker.predict([(question, text_of[d]) for d in candidate_ids])
top5 = [candidate_ids[i] for i in np.argsort(-scores)[:5]]
```

</div>

- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Zwei Stufen:** breit suchen für hohen Recall, dann wenige präzise Treffer in den Prompt.
</div>

</script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="smaller drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<p class="eyebrow">Teil VIII · RAG oder Fine-Tuning</p>

## Prompt mit Quellen zusammenstellen

```python
def compose(question, hits):
    sources = "\n\n".join(f'<quelle id="{d}">\n{text_of[d][:2500]}\n</quelle>' for d in hits)
    system = ("Beantworten Sie die Frage nur aus den Quellen. "
              "Belegen Sie jede Aussage mit der id der Quelle in eckigen Klammern. "
              "Steht die Antwort nicht in den Quellen, antworten Sie: Nicht in den Quellen.")
    return [{"role": "system", "content": system},
            {"role": "user", "content": f"{sources}\n\nFrage: {question}"}]
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Trennzeichen** (`<quelle>`) halten Anweisung und Daten auseinander und sind eine erste Hürde gegen eingeschleuste Anweisungen im Text. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Erlaubte Nicht-Antwort:** "Nicht in den Quellen" ist ein gewolltes, prüfbares Ergebnis. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Reihenfolge:** die stärksten Treffer an den Anfang oder das Ende, nicht in die Mitte. 

<div class="fragment" data-fragment-index="4">

<small>Liu et al. 2024 ("Lost in the Middle"), arXiv:2307.03172</small>

</div>
</div>

</script></section><section data-separator="?

<p class="eyebrow">Teil VIII · RAG oder Fine-Tuning</p>

## Generieren und Belege prüfen

```python
import os, re
from openai import OpenAI

client = OpenAI(base_url=os.environ["LLM_BASE_URL"], api_key=os.environ["LLM_API_KEY"])
GENERATOR = os.environ["LLM_MODEL"]                  # z. B. gpt-4.1-mini
answer = client.chat.completions.create(
    model=GENERATOR, messages=compose(question, top5), temperature=0,
).choices[0].message.content

cited = {t.strip() for g in re.findall(r"\[(.+?)\]", answer)         # IDs in eckigen Klammern
           for t in re.split(r"[,;]", g) if t.strip()}               # mehrere je Klammer trennen
print(answer)
print("Belege außerhalb des Kontexts:", cited - set(top5))
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Ein Beleg, der nicht im gelieferten Kontext stand, ist erfunden: **automatisch prüfbar**. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Ein gültiger Beleg heißt noch nicht, dass die Aussage dort steht: Das prüft **Groundedness**. 

<div class="fragment" data-fragment-index="3">

<small>Gao et al. 2023 (ALCE), arXiv:2305.14627</small>

</div>
</div>

</script></section><section data-separator="?

<p class="eyebrow">Teil VIII · RAG oder Fine-Tuning</p>

## Retrieval messen: Recall@k und MRR

Grundlage ist ein **Gold-Set**: Fragen mit den Paragraphen, die sie beantworten.

$$\\text{Recall@}k = \\frac{|\\text{relevant} \\cap \\text{Top-}k|}{|\\text{relevant}|} \\qquad \\text{MRR} = \\frac{1}{|Q|}\\sum\_{q \\in Q}\\frac{1}{\\text{rang}\_q}$$

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Recall@k:** Ist die richtige Stelle unter den ersten $k$? Für RAG die wichtigste Größe, weil niemand die Trefferliste sieht. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**MRR:** Wie weit oben steht der **erste** relevante Treffer? $\\text{rang}\_q$ ist seine Position; fehlt er, zählt 0. 

<div class="fragment" data-fragment-index="3">

| Frage | erster relevanter Treffer auf Rang | Reciprocal Rank |
|---|---|---|
| F1 | 1 | 1,00 |
| F2 | 3 | 0,33 |
| F3 | nicht unter den Top-10 | 0 |

</div>

<div class="fragment" data-fragment-index="4">

MRR = (1,00 + 0,33 + 0) / 3 = **0,44**, Recall@10 = **2/3** (bei einem relevanten Paragraphen je Frage).

</div>

<div class="fragment" data-fragment-index="5">

<small>Manning, Raghavan, Schütze 2008, Introduction to Information Retrieval, Kap. 8</small>

</div>
</div>

</script></section><section data-separator="?

<p class="eyebrow">Teil VIII · RAG oder Fine-Tuning</p>

## Groundedness: Retrieval- und Antwortfehler trennen

| Fehlerort | Was schiefgeht | Erkennen mit |
|---|---|---|
| **Retrieval** | richtige Stelle fehlt oder geht im Rauschen unter | Recall@k, MRR |
| **Generierung** | richtige Stelle da, Antwort trotzdem falsch oder unbelegt | Groundedness, Belegprüfung |

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Groundedness (Faithfulness):** Jede Aussage der Antwort wird gegen den gelieferten Kontext geprüft: gestützt, nicht gestützt oder widersprochen. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Prüfen per Hand an einer Stichprobe und mit einem LLM-Judge, der **nur anhand des Kontexts** urteilen soll; den LLM-Judge mit der Stichprobe abgleichen. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Unbeantwortbare Fragen** ins Gold-Set: Sagt das System dann "Nicht in den Quellen"? 

<div class="fragment" data-fragment-index="4">

<small>Es et al. 2024 (RAGAS), arXiv:2309.15217 · OpenAI, "Optimizing LLM Accuracy" (API-Dokumentation)</small>

</div>
</div>

</script></section><section data-separator="?
---?

<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<p class="eyebrow">Teil VIII · RAG oder Fine-Tuning</p>

## Wann RAG gewinnt

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Fakten ändern sich:** Eine neue Gesetzesfassung ist ein neu indexiertes Dokument, kein neuer Trainingslauf. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Zugriffsrechte:** Der Retriever filtert je Nutzer, bevor etwas im Prompt landet. In Modellgewichten lässt sich der Zugriff nicht nach Nutzern trennen. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Belegpflicht:** Jede Aussage verweist auf Paragraph und Fassung. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Löschen:** Ein Eintrag im Index lässt sich gezielt entfernen. Aus trainierten Gewichten nicht. 

<div class="merk fragment" data-fragment-index="5">

RAG löst ein **Wissensproblem**: Dem Modell fehlt Wissen, weil es nicht im Training war, veraltet ist oder vertraulich bleiben muss.

</div>
</div>

</script></section><section data-separator="?
---?
" data-separator-vertical="?

<p class="eyebrow">Teil VIII · RAG oder Fine-Tuning</p>

## Wann Fine-Tuning gewinnt

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Form und Format:** Das Modell soll stabil ein festes Schema liefern, etwa JSON mit Norm, Rechtsfolge und Fundstelle. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Stil und Ton:** Antworten im Stil eines Bescheids oder einer Kanzlei. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Feste Aufgaben:** eine Klassifikation wie Paragraph → Rechtsgebiet, in hohem Volumen. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Effizienz:** gleiche Qualität mit kürzerem Prompt oder kleinerem Modell. 

<div class="warn fragment" data-fragment-index="5">

Mehr Kontext hilft nicht immer: In einem OpenAI-Beispiel senkte zusätzliches Retrieval den BLEU-Wert eines feinabgestimmten GPT-4 von 87 auf 83. Das Modell hatte die Aufgabe schon gelernt, der Kontext war Rauschen.

</div>
</div>

</script></section><section data-separator="?

<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<p class="eyebrow">Teil VIII · RAG oder Fine-Tuning</p>

## Entscheidungstabelle

| Anforderung | RAG | Fine-Tuning |
|---|---|---|
| Fakten ändern sich (neue Fassung) | **neu indexieren** | neu trainieren |
| Zugriff je Nutzer oder Mandant | **Filter beim Retrieval** | nicht trennbar |
| Beleg für jede Aussage | **Quellen-ID im Kontext** | keine Quelle |
| Quelle löschen | **Eintrag entfernen** | neu trainieren |
| festes Ausgabeformat | per Prompt, schwankt | **gelernt, stabil** |
| Stil und Ton | per Prompt, begrenzt | **gelernt** |
| feste Aufgabe, hohes Volumen | Kontext kostet Tokens | **kurzer Prompt, kleines Modell** |

<div class="merk fragment" data-fragment-index="1">

Fakten gehören in den Index, Form gehört in die Gewichte. Braucht die Anwendung beides, kombinieren Sie beides.

</div>
</div>

</script></section><section data-separator="?

<p class="eyebrow">Teil VIII · RAG oder Fine-Tuning</p>

## Beides kombinieren, Schritt für Schritt

<img src="figs/optimierungspfad.png" alt="" style="object-fit: scale-down">


- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Start:** Prompt plus Baseline messen und die Fehler sortieren. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Wissen fehlt:** Retrieval ergänzen. **Form stimmt nicht:** feinabstimmen. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Jeder Schritt wird gegen den vorigen **gemessen**, auch gegen die billige Lösung.
</div>

</script></section><section data-separator="?

<p class="eyebrow">Teil VIII · RAG oder Fine-Tuning</p>

## Zusammenfassung

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Pipeline:** Chunking entlang der Struktur, Bi-Encoder und BM25 (je nach Messung mit RRF fusioniert oder einzeln), Re-Ranking mit Cross-Encoder, Prompt mit Quellen-IDs. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Zwei Fehlerorte, zwei Messungen:** Recall@k und MRR für das Retrieval, Groundedness und Belegprüfung für die Antwort. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**RAG** gewinnt bei veränderlichen Fakten, Zugriffsrechten und Belegpflicht. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Fine-Tuning** gewinnt bei Form, Stil, Format und festen Aufgaben. 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->**Beides**, wenn die Anwendung Wissen und Form braucht; jeder Schritt wird gemessen. 

<div class="fragment" data-fragment-index="6">

**Transfer:** Sortieren Sie die Fehler Ihres Systems zuerst nach Wissen oder Form, bevor Sie Index oder Training anfassen.

</div>
</div>

</script></section></section><section ><section data-separator="?

# Teil IX · Effizienz: PEFT und Quantisierung
</div>

</script></section><section data-separator="?

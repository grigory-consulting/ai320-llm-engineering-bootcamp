" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<p class="eyebrow">Teil IX · PEFT und Quantisierung</p>

## Lernziele

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Sie erklären **LoRA** als Zerlegung $W\_0 + BA$ und wählen Rang, Skalierung und Zielmodule. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Sie rechnen **trainierbare Parameter** und **Speicher** für Full-Fine-Tuning und PEFT (Parameter-Efficient Fine-Tuning: LoRA, QLoRA) vorab aus. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Sie ordnen **GPTQ, AWQ, LLM.int8(), NF4** (4-Bit-NormalFloat) und die **GGUF-Stufen** nach Zeitpunkt und Ziel der Quantisierung ein. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Sie lesen veröffentlichte **Qualitätseinbußen** (ΔPPL, KL-Divergenz) und die Speicherformel richtig. 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->Sie wählen eine **Checkpoint-Strategie** (Adapter getrennt oder gemergt) und wägen Kosten, Nutzen und Latenz ab.
</div>

</script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<p class="eyebrow">Teil IX · PEFT und Quantisierung</p>

## Was beim Fine-Tuning Speicher kostet

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Gewichte:** Auch eingefrorene Parameter belegen Speicher. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Gradienten:** für jeden trainierten Parameter ein Wert. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Optimizer-Zustand:** AdamW hält je trainierten Parameter zwei Momente $m$ und $v$. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Aktivierungen:** wachsen mit Micro-Batch, Sequenzlänge, Breite und Tiefe. 

<div class="merk fragment" data-fragment-index="5">

Beim Full-Fine-Tuning fallen rund **16 Byte je trainierten Parameter** an (Teil VI). Bei LoRA brauchen nur die Adapter Gradienten und Optimizer-Zustand. Ein eingefrorenes Gewicht belegt 2 Byte (16 Bit), bei QLoRA rund 0,5 Byte (4 Bit, NF4).

</div>

<div class="fragment" data-fragment-index="6">

<small>Loshchilov, Hutter 2019, arXiv:1711.05101</small>

</div>
</div>

</script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="smaller fig-m drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<p class="eyebrow">Teil IX · PEFT und Quantisierung</p>

## LoRA: eingefrorene Gewichte plus Low-Rank-Update

<img src="figs/lora-zerlegung.png" alt="" style="object-fit: scale-down">


$$h = W\_0 x + \\frac{\\alpha}{r}\\, B A x, \\qquad B \\in \\mathbb{R}^{d \\times r},\\; A \\in \\mathbb{R}^{r \\times k},\\; r \\ll \\min(d, k)$$

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->$W\_0$ bleibt **eingefroren**, trainiert werden nur $A$ und $B$. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Der **Rang** $r$ begrenzt, wie viel das Update $\\Delta W = BA$ ausdrücken kann. 

<div class="fragment" data-fragment-index="3">

<small>Hu et al. 2021, arXiv:2106.09685</small>

</div>
</div>

</script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<p class="eyebrow">Teil IX · PEFT und Quantisierung</p>

## Initialisierung und Skalierung

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Start als No-op:** $A$ zufällig (Paper: Gauß, peft: Kaiming-uniform), $B = 0$. Damit ist $\\Delta W = 0$, das Modell verhält sich am Anfang wie die Basis. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Skalierung** $\\alpha / r$: $\\alpha$ wirkt ähnlich wie die Lernrate. Das Paper setzt $\\alpha$ auf den ersten probierten Rang und stimmt es danach nicht weiter ab. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Wirkung:** Wer bei festem $\\alpha$ später $r$ ändert, muss die übrigen Hyperparameter laut Paper kaum neu einstellen. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->In peft heißen die Größen `r` und `lora_alpha`; der README-Standard nutzt `r=16`, `lora_alpha=32`. 

<div class="fragment" data-fragment-index="5">

<small>Hu et al. 2021, arXiv:2106.09685 · Hugging Face PEFT, LoRA-Referenz</small>

</div>
</div>

</script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<p class="eyebrow">Teil IX · PEFT und Quantisierung</p>

## Welche Module LoRA bekommt

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Kandidaten im Transformer: die Projektionen $W\_q, W\_k, W\_v, W\_o$ der Attention und die Schichten des Feed-Forward-Blocks. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**LoRA-Paper (GPT-3):** Bei festem Budget von 18 Mio. Parametern schneiden $W\_q$ und $W\_v$ mit $r = 4$ besser ab als $W\_q$ allein mit $r = 8$. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**QLoRA:** setzt Adapter auf **alle linearen Schichten**; der Rang ist dann laut Paper wenig entscheidend. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**peft:** Standard je Architektur, bei GPT-2 `c_attn`; `target_modules="all-linear"` wählt alle linearen Schichten ohne Namensliste. 

<div class="tipp fragment" data-fragment-index="5">

Modulnamen hängen an der Architektur: bei Llama-artigen Modellen `q_proj`, `v_proj`, `down_proj`, bei BERT-artigen `query`, `value`. Prüfen Sie mit `print(model)`, bevor Sie `target_modules` setzen.

</div>

<div class="fragment" data-fragment-index="6">

<small>Hu et al. 2021, arXiv:2106.09685 · Dettmers et al. 2023, arXiv:2305.14314</small>

</div>
</div>

</script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<p class="eyebrow">Teil IX · PEFT und Quantisierung</p>

## Parameterberechnung

Eine Matrix $W\_0 \\in \\mathbb{R}^{d \\times k}$ hat $d \\cdot k$ Parameter, ihr Adapter $r\\,(d + k)$.

<div class="fragment" data-fragment-index="1">

| $d = k$ | $r$ | volle Matrix | LoRA $r(d+k)$ | Anteil |
|---|---|---|---|---|
| 4.096 | 8 | 16.777.216 | 65.536 | 0,39 % |
| 4.096 | 16 | 16.777.216 | 131.072 | 0,78 % |
| 4.096 | 64 | 16.777.216 | 524.288 | 3,1 % |

</div>

- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Im ganzen Modell zählt `print_trainable_parameters()` nach: Das peft-README nennt für Qwen2.5-3B-Instruct mit `r=16` auf Query und Value **0,1193 %** trainierbare Parameter. 

<div class="fragment" data-fragment-index="3">

<small>Hugging Face PEFT README</small>

</div>
</div>

</script></section><section data-separator="?

" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<p class="eyebrow">Teil IX · PEFT und Quantisierung</p>

## Speicher und Artefakt mit LoRA

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Trainingsspeicher:** Gradienten und AdamW-Momente fallen nur für $A$ und $B$ an; die Basis liegt einmal in 16 Bit im Speicher. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Artefakt:** Gespeichert werden nur die Adapter, die Basis bleibt unverändert. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**LoRA-Paper, GPT-3 175B:** Trainings-VRAM 350 GB statt 1,2 TB, Checkpoint 35 MB ($r = 4$, nur $W\_q$ und $W\_v$) statt 350 GB, Training rund 25 % schneller. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Viele Aufgaben, eine Basis:** 100 Adapter samt Basis brauchen rund 354 GB statt 35 TB für 100 volle Kopien. 

<div class="merk fragment" data-fragment-index="5">

LoRA spart vor allem Optimizer-Zustand und Ablage. Die eingefrorene Basis und die Aktivierungen bleiben und bestimmen dann den Speicher.

</div>

<div class="fragment" data-fragment-index="6">

<small>Hu et al. 2021, arXiv:2106.09685</small>

</div>
</div>

</script></section><section data-separator="?
---?
" data-separator-vertical="?

" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="smaller drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<p class="eyebrow">Teil IX · PEFT und Quantisierung</p>

## LoRA mit peft

```python
import torch
from transformers import AutoModelForCausalLM
from peft import LoraConfig, TaskType, get_peft_model

torch.manual_seed(1)
model = AutoModelForCausalLM.from_pretrained(
    "models/smollm2-135m", dtype=torch.float32)   # SmolLM2-135M, CPU
config = LoraConfig(
    r=16, lora_alpha=32, lora_dropout=0.05,
    target_modules=["q_proj", "v_proj"],    # oder "all-linear"
    task_type=TaskType.CAUSAL_LM)
model = get_peft_model(model, config)       # friert die Basis ein
model.print_trainable_parameters()          # trainable params || all params || trainable%
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->`get_peft_model` hängt die Adapter an und setzt `requires_grad=False` für alle Basisgewichte. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Danach trainiert der gewohnte `Trainer` oder eine eigene Schleife, ohne weitere Änderung.

## QLoRA: drei Bausteine

<img src="figs/qlora-datenfluss.png" alt="" style="object-fit: scale-down">


- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**NF4:** 4-Bit-NormalFloat für die eingefrorene Basis, gebaut für normalverteilte Gewichte. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Double Quantization:** quantisiert auch die Quantisierungskonstanten. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Paged Optimizer:** lagert Optimizer-Zustände bei Speicherspitzen über NVIDIA Unified Memory in den CPU-RAM aus. 

<div class="fragment" data-fragment-index="4">

<small>Dettmers et al. 2023, arXiv:2305.14314</small>

</div>

## QLoRA: Speicherbilanz

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Basis:** 4 Bit je Gewicht plus Konstanten; eine fp32-Konstante je Block aus 64 Gewichten kostet $32/64 = 0{,}5$ Bit je Parameter. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Double Quantization:** Konstanten in 8 Bit, zweite Stufe mit Blöcken zu 256: 

<div class="fragment" data-fragment-index="3">

$$\\frac{8}{64} + \\frac{32}{64 \\cdot 256} \\approx 0{,}127 \\text{ Bit} \\quad\\Rightarrow\\quad 0{,}373 \\text{ Bit gespart} \\approx 3 \\text{ GB bei 65 Mrd. Parametern}$$

</div>

- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Gemessen, LLaMA-7B, Batch 1:** 4-Bit-Basis 5.048 MB, LoRA-Gewichte 26 MB, Eingabegradienten der LoRA-Schichten 567 MB. 

<div class="merk fragment" data-fragment-index="5">

Bei QLoRA bestimmen Basis und Aktivierungsgradienten den Speicher, nicht die Adapter. Mehr Adapter kosten kaum zusätzlichen Speicher.

</div>

<div class="fragment" data-fragment-index="6">

<small>Dettmers et al. 2023, arXiv:2305.14314</small>

</div>
</div>

## QLoRA mit transformers und peft

```python
import torch
from transformers import AutoModelForCausalLM, BitsAndBytesConfig
from peft import LoraConfig, get_peft_model

bnb = BitsAndBytesConfig(
    load_in_4bit=True,
    bnb_4bit_quant_type="nf4",              # NF4 statt FP4
    bnb_4bit_use_double_quant=True,         # Konstanten quantisieren
    bnb_4bit_compute_dtype=torch.bfloat16)  # Rechnen in bf16
model = AutoModelForCausalLM.from_pretrained(
    "models/smollm2-135m", quantization_config=bnb)
model = get_peft_model(model, LoraConfig(
    r=16, lora_alpha=32, target_modules="all-linear", task_type="CAUSAL_LM"))
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Die Basis wird beim Laden in NF4 umgewandelt, nur die Adapter bleiben trainierbar; peft legt sie standardmäßig in fp32 an (`autocast_adapter_dtype=True`), im Paper wurden sie in bf16 trainiert. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Voraussetzung ist bitsandbytes; welche Konfiguration auf welcher Hardware läuft, steht auf der Folie zum Werkzeugstand.

## Quantisierungsverfahren nach Zeitpunkt und Ziel

Zwei Fragen ordnen die Verfahren: **wann** quantisiert wird (nach dem Training: PTQ, im Training: QAT) und **was** (nur Gewichte, etwa W4A16, oder auch Aktivierungen, etwa W8A8).

<div class="fragment" data-fragment-index="1">

| Verfahren | Zeitpunkt | Was | Kernidee |
|---|---|---|---|
| **GPTQ** | PTQ, one-shot | Gewichte, 3–4 Bit | Information zweiter Ordnung; 175 Mrd. Parameter in rund 4 GPU-Stunden |
| **AWQ** | PTQ | Gewichte | schützt die salienten Kanäle (1 %), ausgewählt nach Aktivierungen, ohne Backpropagation |
| **LLM.int8()** | PTQ | Gewichte und Aktivierungen, 8 Bit | Ausreißer-Dimensionen in 16 Bit, über 99,9 % der Werte in 8 Bit |
| **NF4** | PTQ beim Laden (Basis für QLoRA) | Gewichte, 4 Bit | Datentyp für normalverteilte Gewichte |
| **QAT** | im Training | Gewichte und Aktivierungen, 8 Bit | Quantisierung im Trainingsverfahren berücksichtigt |
| **GGUF K-Quants** | PTQ | Gewichte, Superblöcke | Bitbreite je Tensorgruppe gemischt |

</div>

<div class="fragment" data-fragment-index="2">

<small>Frantar et al. 2022, arXiv:2210.17323 · Lin et al. 2023, arXiv:2306.00978 · Dettmers et al. 2022, arXiv:2208.07339 · Dettmers et al. 2023, arXiv:2305.14314 · Jacob et al. CVPR 2018 · llama.cpp PR #1684</small>

</div>
</div>

## Speicherformel für Gewichte

$$\\text{Speicher} \\approx N\_\\text{Parameter} \\cdot \\frac{\\text{Bit je Gewicht}}{8} \\;\\text{Byte}$$

<div class="fragment" data-fragment-index="1">

| Stufe | Bit je Gewicht | Berechnung für $8{,}03 \\cdot 10^9$ Parameter | README, Llama-3.1-8B |
|---|---|---|---|
| F16 | 16,00 | 16,1 GB = 14,96 GiB | 14,96 GiB |
| Q8_0 | 8,50 | 8,53 GB = 7,95 GiB | 7,95 GiB |
| Q4_K_M | 4,89 | 4,91 GB = 4,57 GiB | 4,58 GiB |

</div>

- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Rechnen Sie mit der **effektiven** Bitrate: Q4_K_M liegt bei 4,89 Bit, nicht bei 4 (Mischung, nächste Folie). 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Die Formel deckt nur die Gewichte ab; KV-Cache und Aktivierungen kommen beim Serving dazu (Teil XII).

## GGUF und die K-Quant-Stufen

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**GGUF:** eine Datei mit Header, Metadaten und Tensoren, per `mmap` ladbar; der Typ im Namen beschreibt nur die Mehrheit der Tensoren. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Q4_K:** 8 Blöcke zu je 32 Gewichten bilden einen Superblock; Skalierungsfaktoren und Minima in 6 Bit, zusammen 4,5 Bit je Gewicht. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Q4_K_M:** nutzt Q6_K für die Hälfte der Tensoren `attention.wv` und `feed_forward.w2`, sonst Q4_K; `output.weight` liegt in allen K-Quant-Mischungen in 6 Bit. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**_S, _M, _L:** geben an, wie viele Tensorgruppen mehr Bit bekommen, nicht die Grundbitbreite. 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->**Importance-Matrix** (`--imatrix`): gewichtet den Quantisierungsfehler nach Kalibrierdaten und senkt ihn.

## GGUF erzeugen mit llama.cpp

```bash
# 1) Hugging-Face-Checkpoint in GGUF mit 16 Bit umwandeln
python convert_hf_to_gguf.py models/smollm2-135m \
    --outfile smollm2-135m-F16.gguf --outtype f16

# 2) quantisieren: Eingabe, Ausgabe, Zieltyp
llama-quantize smollm2-135m-F16.gguf smollm2-135m-Q4_K_M.gguf Q4_K_M

# 3) dieselbe Stufe mit Importance-Matrix
llama-quantize --imatrix imatrix.gguf \
    smollm2-135m-F16.gguf smollm2-135m-Q4_K_M-imat.gguf Q4_K_M
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Zwei Phasen:** erst verlustarm in GGUF mit 16 Bit umwandeln, dann quantisieren. Bei 16-Bit-Modellen genügt auch `--outtype auto`.

```python
from peft import PeftModel

    "models/smollm2-135m", dtype=torch.float32)

```

## Abwägung: Kosten, Nutzen, Latenz

| Weg | Trainingsspeicher | Artefakt | Inferenz |
|---|---|---|---|
| **Full-Fine-Tuning** | Gradient und AdamW-Zustand für alle Parameter | volles Modell je Aufgabe | wie die Basis |
| **LoRA** | Basis in 16 Bit eingefroren, Zustand nur für Adapter | Adapter | gemergt ohne Zusatzlatenz |
| **QLoRA** | Basis in NF4, Zustand nur für Adapter | Adapter | Basis 4 Bit, oder mergen und neu quantisieren |
| **PTQ** (GGUF, GPTQ, AWQ) | kein Training | 4- bis 8-Bit-Datei | weniger Byte je Gewicht, schnellere Generierung |

<div class="merk fragment" data-fragment-index="1">

Berichten Sie zu jeder Variante ein Tripel: **Peak-Speicher**, **Prompt- und Generierungsgeschwindigkeit getrennt**, **Qualitätsdelta** gegen die 16-Bit-Referenz desselben Modells mit demselben Tokenizer.

<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<p class="eyebrow">Teil IX · PEFT und Quantisierung</p>

## Zusammenfassung

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**LoRA** trainiert $A$ und $B$ mit $r(d+k)$ Parametern je adaptierte Matrix, die Basis bleibt eingefroren; $\\alpha/r$ skaliert das Update. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**QLoRA** speichert die Basis in NF4 mit doppelt quantisierten Konstanten und rechnet in bf16. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Quantisierungsverfahren** unterscheiden sich nach Zeitpunkt (PTQ, QAT) und Ziel (nur Gewichte oder auch Aktivierungen). 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Speicher der Gewichte** $\\approx N \\cdot \\text{Bit}/8$, mit effektiver Bitrate; Einbußen werden als ΔPPL und KL-Divergenz zur Referenz veröffentlicht. 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->**Ablage:** Adapter getrennt für viele Aufgaben, gemergt für GGUF und schlanke Inferenz. 

<div class="tipp fragment" data-fragment-index="6">

Transfer: Ein 3-Mrd.-Modell soll für den Gesetzeskorpus angepasst und auf CPU-Rechnern mit 8 GB ausgeliefert werden. Rechnen Sie den Trainingsspeicher mit LoRA und die Dateigröße in Q4_K_M aus, bevor Sie etwas starten.

</div>

## Lernziele

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Sie rechnen den **Trainingsspeicher je Parameter** aus und schätzen ab, ob ein Modell auf eine GPU passt. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Sie setzen **Gradient Accumulation** und **Activation Checkpointing** gezielt gegen Batch- und Speichergrenzen ein. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Sie unterscheiden **DDP** und **FSDP** danach, was auf jeder GPU liegt und was kommuniziert wird. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Sie starten ein verteiltes Training mit **torchrun** und erkennen typische **Fehlerbilder**: NCCL-Timeout (NVIDIA Collective Communications Library), OOM (Out of Memory), Hänger. 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->Sie planen einen Lauf auf einem **Slurm-Cluster** mit Walltime, Signal und Requeue.
</div>

## Trainingsspeicher je Parameter

Mixed Precision mit AdamW speichert für jeden trainierten Parameter fünf Werte:

<div class="fragment" data-fragment-index="1">

| Tensor | Datentyp | Byte |
|---|---|---|
| Gewichte (Rechenkopie) | fp16 oder bf16 | 2 |
| Gradienten | fp16 oder bf16 | 2 |
| Masterkopie der Gewichte | fp32 | 4 |
| Adam-Moment $m$ | fp32 | 4 |
| Adam-Moment $v$ | fp32 | 4 |
| **Summe** | | **16** |

</div>

- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**7 Mrd. Parameter:** $7 \\cdot 10^9 \\cdot 16$ Byte = 112 GB, bevor eine einzige Aktivierung gespeichert ist. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Mit **LoRA** fallen die 14 Byte für Gradient, Masterkopie und Momente nur für die Adapter an. 

<div class="fragment" data-fragment-index="4">

<small>Micikevicius et al. 2018, arXiv:1710.03740 · Loshchilov, Hutter 2019, arXiv:1711.05101</small>

</div>
</div>

## Aktivierungen und Activation Checkpointing

```python
from torch.utils.checkpoint import checkpoint

def forward(self, x):
    for block in self.blocks:
        x = checkpoint(block, x, use_reentrant=False)   # nur Blockeingang merken
    return self.head(self.norm(x))
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Aktivierungen** dominieren den Trainingsspeicher und wachsen mit Micro-Batch und Sequenzlänge. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Checkpointing** speichert nur die Eingänge der Blöcke und rechnet den Rest im Backward neu: weniger Speicher, ein zusätzlicher Forward je Block. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Beleg QLoRA, LLaMA-7B:** Eingabegradienten der LoRA-Schichten 567 MB, mit Checkpointing im Mittel 18 MB je Sequenz. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Mit DDP `use_reentrant=False` verwenden; mit `True` hat DDP Einschränkungen. 

<div class="fragment" data-fragment-index="5">

<small>Chen et al. 2016, arXiv:1604.06174 · Dettmers et al. 2023, arXiv:2305.14314 · PyTorch 2.14, DistributedDataParallel</small>

</div>
</div>

## Gradient Accumulation

$$B\_\\text{eff} = B\_\\text{micro} \\cdot k\_\\text{accum} \\cdot N\_\\text{GPU}$$

```python
import contextlib
for step, (x, y) in enumerate(loader):
    last = (step + 1) % k_accum == 0
    ctx = contextlib.nullcontext() if last else model.no_sync()
    with ctx:                                     # Forward im Kontext, sonst wirkt no_sync nicht
        loss = loss_fn(model(x), y) / k_accum
        loss.backward()
    if last:
        torch.nn.utils.clip_grad_norm_(model.parameters(), 1.0)
        optimizer.step()
        optimizer.zero_grad(set_to_none=True)
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**`no_sync`:** existiert nur an der DDP-Hülle (Folie DDP im Trainingsskript); ohne DDP steht in beiden Zweigen `nullcontext()`. Restfall: Ist die Batchzahl nicht durch $k\_\\text{accum}$ teilbar, bleibt der Rest ohne Optimizer-Schritt liegen. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Grenze:** Accumulation vergrößert den effektiven Batch, senkt aber nicht den Aktivierungsspeicher des Micro-Batches. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Variable Längen:** Summe der Token-Losses durch die Zahl der Nicht-Padding-Token im ganzen Akkumulationsfenster teilen, nicht Batch-Mittel mitteln; das `/ k_accum` oben geht nur, weil die Trainingsfenster hier alle gleich lang sind. 

<div class="fragment" data-fragment-index="4">

<small>PyTorch 2.14, AMP Examples · Hugging Face Accelerate v1.15.0 · nanoGPT train.py</small>

</div>
</div>

## DDP: ein Modell je GPU

<img src="figs/ddp-allreduce.png" alt="" style="object-fit: scale-down">


- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Start:** DDP kopiert den Modellzustand von Rank 0 auf alle Prozesse. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Daten:** Jeder Prozess (Rank) liest seinen Teil, etwa mit `DistributedSampler`. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Backward:** Pro fertigem Gradienten-Bucket läuft ein asynchrones **All-Reduce**. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Grenze:** Jede GPU hält Modell und Trainingszustand (hier 16 Byte/Parameter). 

<div class="fragment" data-fragment-index="5">

<small>PyTorch 2.14, Distributed Data Parallel Design Notes</small>

</div>
</div>

## DDP im Trainingsskript

```python
import os, torch, torch.distributed as dist
from torch.nn.parallel import DistributedDataParallel as DDP
from torch.utils.data import DataLoader, DistributedSampler

dist.init_process_group(backend="nccl")            # torchrun setzt RANK, WORLD_SIZE
local_rank = int(os.environ["LOCAL_RANK"])
torch.cuda.set_device(local_rank)
model = DDP(model.to(local_rank), device_ids=[local_rank])
sampler = DistributedSampler(train_ds, shuffle=True, seed=1)
loader = DataLoader(train_ds, batch_size=16, sampler=sampler)
for epoch in range(epochs):
    sampler.set_epoch(epoch)                        # neue Mischung je Epoche
    for x, y in loader:
        ...                                         # Schritt wie bei Gradient Accumulation
dist.destroy_process_group()
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Backend:** NCCL für CUDA-GPUs, Gloo für die CPU; Gloo läuft auf GPUs langsamer. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Nur Rank 0** schreibt Logs und Checkpoints; gespeichert wird `model.module`, nicht die DDP-Hülle. 

<div class="fragment" data-fragment-index="3">

<small>PyTorch 2.14, torch.nn.parallel.DistributedDataParallel und torch.distributed</small>

</div>
</div>

## Start mit torchrun

```bash
# ein Knoten, 4 GPUs
torchrun --standalone --nproc_per_node=4 train.py

# zwei Knoten mit je 8 GPUs: auf Knoten 0 ...
torchrun --nproc_per_node=8 --nnodes=2 --node_rank=0 \
    --master_addr=10.0.0.1 --master_port=1234 train.py
# ... und auf Knoten 1 derselbe Befehl mit --node_rank=1
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->torchrun startet einen Prozess je GPU und setzt `RANK`, `LOCAL_RANK` und `WORLD_SIZE`.

## FSDP und ZeRO: Zustand teilen statt kopieren

FSDP ist laut PyTorch-Doku an **ZeRO Stage 3** (Zero Redundancy Optimizer) aus DeepSpeed angelehnt. Speicher je GPU, berechnet für $N$ GPUs und $\\Psi$ Parameter, ohne Aktivierungen:

<div class="fragment" data-fragment-index="1">

| Strategie | Parameter | Gradienten | Optimizer-Zustand | Speicher je GPU |
|---|---|---|---|---|
| DDP (`NO_SHARD`) | voll | voll | voll | $16\\,\\Psi$ |
| `SHARD_GRAD_OP` | außerhalb der Berechnung geteilt | geteilt | geteilt | $\\approx 2\\,\\Psi + 14\\,\\Psi / N$ |
| `FULL_SHARD` | geteilt | geteilt | geteilt | $\\approx 16\\,\\Psi / N$ |
| `HYBRID_SHARD` | `FULL_SHARD` im Knoten, je Knoten eine Kopie | geteilt im Knoten | geteilt im Knoten | $\\approx 16\\,\\Psi / N\_\\text{Knoten-GPUs}$ |

</div>

- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**7 Mrd. Parameter auf 8 GPUs:** DDP 112 GB je GPU, `FULL_SHARD` rund 14 GB je GPU plus Aktivierungen. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Preis:** vor Forward und Backward ein **All-Gather** je Einheit, nach dem Backward ein **Reduce-Scatter** der Gradienten. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**FSDP2:** `fully_shard(block)` je Transformer-Block, dann `fully_shard(model)`; Checkpoints über `torch.distributed.checkpoint`, eine Datei je Rank. 

<div class="fragment" data-fragment-index="5">

<small>PyTorch 2.14, FullyShardedDataParallel und fully_shard</small>

</div>
</div>

## Wo verteiltes Training hängen bleibt

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Kommunikation:** All-Reduce oder All-Gather bei jedem Schritt; zwischen Knoten ist das Netz meist langsamer als innerhalb eines Knotens. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Synchronisation an der falschen Stelle:** im Accelerate-Benchmark auf zwei Knoten 2,0 s statt 0,91 s je Batch. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Datenladen:** Wartet die GPU auf den nächsten Batch, helfen keine weiteren GPUs. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Speicher:** Aktivierungen und kurzzeitig ausgepackte Parameter begrenzen den Micro-Batch. 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->**Nachzügler:** Ein langsamer Rank bremst alle anderen; beim Llama-3-Training konnte ein einziger Nachzügler Tausende GPUs bremsen. 

<div class="fragment" data-fragment-index="6">

<small>Hugging Face Accelerate v1.15.0 · Llama Team 2024, arXiv:2407.21783</small>

</div>
</div>

## Typische Fehlerbilder

| Symptom | Häufige Ursache | Erster Schritt |
|---|---|---|
| **NCCL-Timeout**, Prozess bricht ab | ein Rank fehlt bei einer Collective (All-Reduce, All-Gather) durch Ausfall oder anderen Codepfad; Default-Timeout bei NCCL 10 Minuten | `NCCL_DEBUG=INFO`, Logs aller Ranks vergleichen |
| **Hänger** im Backward | Ranks reduzieren in unterschiedlicher Reihenfolge oder überspringen Parameter | gleicher Codepfad auf allen Ranks, notfalls `find_unused_parameters=True` |
| **OOM** | Micro-Batch, Sequenzlänge, `no_sync()` unter FSDP | Micro-Batch kleiner, Activation Checkpointing, `FULL_SHARD` |
| **Loss weicht zwischen Setups ab** | Accumulation und Mixed Precision | End-Loss und Metriken vergleichen, nicht einzelne Batch-Losses |

<div class="merk fragment" data-fragment-index="1">

Ausfälle sind Normalbetrieb: Llama 3 405B hatte in 54 Tagen 466 Unterbrechungen, davon 419 ungeplant, und von diesen rund 78 % durch Hardware. Trotzdem lag der Anteil effektiver Trainingszeit über 90 %, weil Start und Checkpoint schnell waren.

</div>

<div class="fragment" data-fragment-index="2">

<small>PyTorch 2.14, torch.distributed und DDP Design Notes · Llama Team 2024, arXiv:2407.21783</small>

</div>
</div>

## Slurm: Walltime, Signal, Requeue

<img src="figs/slurm-walltime-requeue.png" alt="" style="object-fit: scale-down">


- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**`--time`:** Gesamtlaufzeit; liegt sie über dem Partitionslimit, bleibt der Job möglicherweise dauerhaft **PENDING**. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**`--signal=B:USR1@600`:** Warnung 600 s vor dem Ende, laut Manpage bis zu 60 s früher. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**`--requeue`:** Das Skript startet **von vorn** mit derselben Job-ID; `SLURM_RESTART_COUNT` zählt die Neustarts. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Kein Slurm-Checkpoint:** Fortsetzen heißt, den letzten vollständigen Checkpoint selbst zu finden und zu laden, wie in Teil V.

## sbatch-Skript mit Requeue

```bash
#!/bin/bash
#SBATCH --job-name=mini-gpt
#SBATCH --nodes=1
#SBATCH --gpus-per-node=4
#SBATCH --time=08:00:00
#SBATCH --signal=B:USR1@600
#SBATCH --requeue
#SBATCH --open-mode=append
#SBATCH --output=logs/%x-%j.out

trap 'scontrol requeue "$SLURM_JOB_ID"' USR1
echo "Start Nr. ${SLURM_RESTART_COUNT:-0}"
torchrun --standalone --nproc_per_node=4 train.py --resume latest &
wait
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->`B:` schickt das Signal nur an die Batch-Shell; der `trap` stellt den Job vor Ablauf der Walltime zurück in die Warteschlange. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->`&` und `wait` sind nötig, sonst führt Bash den `trap` erst aus, wenn torchrun schon beendet ist. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->`--open-mode=append` hängt die Logs aller Neustarts an dieselbe Datei; `%x` ist der Job-Name, `%j` die Job-ID.

## Zusammenfassung

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**16 Byte je Parameter** für Mixed Precision mit AdamW, Aktivierungen kommen dazu. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Accumulation** vergrößert den effektiven Batch, **Activation Checkpointing** spart Aktivierungsspeicher und kostet Rechenzeit. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**DDP** kopiert das Modell und mittelt Gradienten, **FSDP** teilt Parameter, Gradienten und Optimizer-Zustand. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Fehlerbilder** gehen meist auf einen einzelnen Rank zurück: Logs aller Ranks lesen. 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->**Auf dem Cluster** ist ein Abbruch planbar: Walltime, Signal, Requeue und ein Startskript, das den Lauf selbst fortsetzt. 

<div class="tipp fragment" data-fragment-index="6">

Transfer: Sie wollen ein 1,3-Mrd.-Modell per Full-Fine-Tuning anpassen und haben 4 GPUs mit je 24 GB. Rechnen Sie DDP gegen `FULL_SHARD` durch und entscheiden Sie, ob Sie zusätzlich Activation Checkpointing brauchen.

</div>

## Lernziele

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Sie erklären, wie **kontrastives Training** Bild und Text in einen **gemeinsamen Embedding-Raum** bringt. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Sie klassifizieren Bilder **Zero-Shot** (ohne Beispiele im Prompt) über Textprompts und wissen, wann das trägt. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Sie beschreiben, wie ein **Vision-Language-Modell** Bildmerkmale über eine Projektionsschicht an ein Sprachmodell koppelt. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Sie schätzen **Daten-, Evaluations- und Rechenaufwand** eines multimodalen Vorhabens ab.

## Bauplan: Vision-Encoder plus Sprach-Decoder

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Schritt 1, Abgleich:** Ein Bild-Encoder und ein Text-Encoder lernen gemeinsam, zusammengehörige Bild-Text-Paare nahe beieinander abzubilden (CLIP). 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Schritt 2, Kopplung:** Ein Sprachmodell erhält die Merkmale des eingefrorenen Bild-Encoders als zusätzliche Eingabe-Token, übersetzt durch einen kleinen trainierbaren **Projektor** (LLaVA). 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Der Bild-Encoder wird dafür nicht neu trainiert; trainiert werden der Projektor und je nach Stufe das Sprachmodell. 

<div class="merk fragment" data-fragment-index="4">

Ein Vision-Language-Modell ist ein Sprachmodell mit einem zweiten Tokenizer für Bilder: Der Bild-Encoder plus Projektor liefert Vektoren im Format der Wort-Embeddings.

</div>
</div>

</script></section><section data-separator="?

## CLIP: kontrastives Training

<img src="figs/clip-kontrastiv.png" alt="" style="object-fit: scale-down">


- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Ein **Bild-Encoder** und ein **Text-Encoder** werden gemeinsam trainiert; beide bilden in denselben Vektorraum ab. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Je Batch: Kosinusähnlichkeit der **N richtigen Paare** maximieren, die der **N² − N falschen** Paarungen minimieren. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Daten: **400 Mio.** Bild-Text-Paare aus dem Web, Batchgröße 32.768. 

<div class="fragment" data-fragment-index="4">

<small>Radford et al. 2021, arXiv:2103.00020</small>

</div>
</div>

</script></section><section data-separator="?

<p class="eyebrow">Teil XI · Multimodalität</p>

## CLIP: Zero-Shot-Klassifikation über Textprompts

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Klassen als Sätze formulieren, etwa **"A photo of a {label}."**, und mit dem Text-Encoder einbetten. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Bild einbetten, Kosinusähnlichkeit zu jedem Klassensatz, Softmax: Die ähnlichste Klasse gewinnt. Kein Training, keine gelabelten Beispiele. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Die Vorlage hebt die ImageNet-Genauigkeit um 1,3 Punkte gegenüber dem nackten Klassennamen; ein Ensemble aus 80 Vorlagen bringt weitere 3,5. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Ergebnis des größten Modells: **76,2 %** Zero-Shot auf ImageNet. 

<div class="warn fragment" data-fragment-index="5">

Mehrdeutige Klassennamen kippen das Ergebnis: ImageNet enthält "crane" als Baukran und als Kranich. Schreiben Sie Kontext in den Prompt ("a type of bird").

</div>

<div class="fragment" data-fragment-index="6">

<small>Radford et al. 2021, arXiv:2103.00020</small>

</div>
</div>

</script></section><section data-separator="?

## Code: CLIP Zero-Shot mit transformers

```python
import torch
from PIL import Image
from transformers import CLIPModel, CLIPProcessor

model = CLIPModel.from_pretrained("models/clip-b32").eval()   # ViT-B/32
processor = CLIPProcessor.from_pretrained("models/clip-b32")

classes = ["law", "table", "form", "chart", "photo"]
prompts = [f"a photo of a {c}." for c in classes]
pictures = [Image.open(p) for p in paths]                    # paths: Liste der Bilddateien
inputs = processor(text=prompts, images=pictures,
                   return_tensors="pt", padding=True)
with torch.no_grad():
    probs = model(**inputs).logits_per_image.softmax(dim=-1)  # (Bilder, Klassen)
pred = [classes[i] for i in probs.argmax(dim=-1)]
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->`logits_per_image` sind die skalierten Kosinusähnlichkeiten zwischen jedem Bild und jedem Prompt. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Neue Klassen kosten je einen Eintrag in `classes`, kein Training.
</div>

## LLaVA: Bildmerkmale als Token für das Sprachmodell

<img src="figs/llava-architektur.png" alt="" style="object-fit: scale-down">


- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**LLaVA:** CLIP-ViT-L/14 liefert Gittermerkmale $Z\_v$; eine trainierbare Matrix $W$ bildet sie in den Wort-Embedding-Raum ab: $H\_v = W \\cdot Z\_v$. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**LLaVA-1.5:** zweischichtiges **MLP** statt linearer Projektion, CLIP-ViT-L bei 336 Pixeln. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Die Bild-Token $H\_v$ stehen im Kontext neben den Text-Token und durchlaufen dasselbe Sprachmodell. 

<div class="fragment" data-fragment-index="4">

<small>Liu et al. 2023, arXiv:2304.08485 · Liu et al. 2024 (LLaVA-1.5), arXiv:2310.03744</small>

</div>
</div>

</script></section><section data-separator="?

## Zweistufiges Training

| | LLaVA | LLaVA-1.5 |
|---|---|---|
| Konnektor | lineare Projektion $W$ | zweischichtiges MLP |
| Stufe 1: nur Konnektor | CC-595K, 1 Epoche, LR 2e-3, < 4 h | 558K, 1 Epoche, LR 1e-3, ca. 6 h |
| Stufe 2: Konnektor + LLM | LLaVA-Instruct-158K, 3 Epochen, LR 2e-5, < 10 h | 665K-Mix, 1 Epoche, LR 2e-5, ca. 20 h |
| Hardware | 8 × A100 | ein Knoten mit 8 × A100 |

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Der Bild-Encoder bleibt in **beiden** Stufen eingefroren. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Stufe 1 richtet nur die Bildmerkmale an den Wort-Embeddings aus; Stufe 2 bringt dem Modell bei, Anweisungen zu Bildern zu folgen. 

<div class="fragment" data-fragment-index="3">

<small>Liu et al. 2023, arXiv:2304.08485 · Liu et al. 2024 (LLaVA-1.5), arXiv:2310.03744</small>

</div>
</div>

## Anwendungsfälle

| Einsatz | Typischer Ansatz | Worauf Sie achten |
|---|---|---|
| **Dokumente** (Scans sortieren, Fragen an Seiten) | CLIP Zero-Shot für Dokumenttypen, VLM (Vision-Language-Modell) für Fragen | CLIP liest gerenderten Text gut, Handschrift schwach: MNIST nur 88 % |
| **Inspektion** (Risse, Oberflächenfehler, Zählen) | Zero-Shot als erste Baseline, dann wenige gelabelte Beispiele | CLIP zählt schlecht und versagt bei Spezialdomänen |
| **Bildbeschreibung** (Alt-Texte, Protokolle) | VLM wie LLaVA-1.5 | halluziniert: in kritischen Anwendungen nur mit Prüfung |

<div class="merk fragment" data-fragment-index="1">

Messen Sie Zero-Shot als Baseline auf Ihren eigenen Bildern, bevor Sie Daten labeln oder ein VLM feinabstimmen.

</div>

<div class="fragment" data-fragment-index="2">

<small>Radford et al. 2021, arXiv:2103.00020 · Liu et al. 2024 (LLaVA-1.5), arXiv:2310.03744</small>

## Grenzen: Daten, Evaluation, Rechenaufwand

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Daten:** CLIP brauchte 400 Mio. Paare; was im Web selten vorkommt (Handschrift, Prüfbilder aus Ihrer Fertigung), kann CLIP kaum. LLaVA-Instruct ist synthetisch, erzeugt von GPT-4 aus Bildunterschriften. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Evaluation:** Freie Bildbeschreibungen haben keine eindeutige Referenz; das LLaVA-Paper bewertet sie mit dem textbasierten GPT-4 als LLM-Judge auf einer Skala von 1 bis 10. Halluzinationen brauchen eigene Tests. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Training:** Das größte CLIP-ResNet lief 18 Tage auf 592 V100, der größte ViT 12 Tage auf 256 V100. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Inferenz:** LLaVA-1.5 gibt das ganze Merkmalsgitter des Bild-Encoders als Token ins Sprachmodell; mit CLIP-ViT-L/14 bei 336 Pixeln sind das 24 × 24 = 576 Positionen je Bild. Mehrere Bilder scheitern laut Autoren auch an der Kontextlänge. 

<div class="tipp fragment" data-fragment-index="5">

Den Projektor (`mmproj` in llama.cpp) lassen Sie beim Quantisieren in bf16 oder q8: Ein kleineres Format spart kaum Speicher, kann aber Qualität kosten.

</div>

<div class="fragment" data-fragment-index="6">

<small>Radford et al. 2021, arXiv:2103.00020 · Liu et al. 2023, arXiv:2304.08485 · Liu et al. 2024 (LLaVA-1.5), arXiv:2310.03744 · llama.cpp tools/quantize/README</small>

</div>
</div>

## Zusammenfassung

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**CLIP** bringt Bild und Text durch kontrastives Training in einen gemeinsamen Raum; Klassen werden zu Textprompts, Zero-Shot ohne Labels. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**LLaVA** koppelt den eingefrorenen Bild-Encoder über Projektion oder MLP an ein Sprachmodell und wird in zwei Stufen trainiert. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Zero-Shot ist die Baseline**, nicht das Ziel: Spezialdomänen, Zählen und Handschrift brauchen eigene Daten. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Bild-Token belegen Kontext** und Speicher wie Text-Token, mehrere hundert Positionen je Bild. 

<div class="hinweis fragment" data-fragment-index="5">

Transferfrage: Welche Bildaufgabe in Ihrem Umfeld ließe sich als Auswahl zwischen wenigen Textbeschreibungen formulieren?

</div>
</div>

## Lernziele

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Sie unterscheiden **Batch-** und **Echtzeitbetrieb** und wählen danach die Kennzahl, die Sie optimieren. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Sie erklären die Latenztreiber **Prefill**, **Decode** und **KV-Cache** und rechnen den Speicherbedarf des KV-Cache aus. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Sie ordnen PagedAttention, Continuous Batching, Prefix-Caching, Streaming und spekulatives Decoding ihrer Wirkung zu. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Sie definieren **TTFT, TPOT, ITL, Durchsatz** und **Goodput** so, dass zwei Messungen vergleichbar sind. 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->Sie wählen eine Serving-Engine nach Hardware und Betriebsform und sprechen sie über die **OpenAI-kompatible API** an.

## Batch oder Echtzeit

<div class="two-col"><div style="flex: 50">

**Batch (offline)**

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Aufträge sammeln und am Stück abarbeiten, z. B. alle Paragraphen des Gesetzeskorpus über Nacht zusammenfassen. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Es zählt der **Durchsatz** (Token pro Stunde); die Dauer einer einzelnen Anfrage ist egal. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->API-Anbieter geben dafür Rabatt: OpenAI-Batch kostet die Hälfte des Standardpreises. 

</div><div style="flex: 50">

<div class="fragment" data-fragment-index="4">

**Echtzeit (online)**

</div>

- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->Ein Mensch oder ein Agent wartet auf die Antwort. 
- &shy;<!-- .element: class="fragment" data-fragment-index="6" -->Es zählen **Zeit bis zum ersten Token** und **Zeit pro Token**, und zwar im p95 (95. Perzentil), nicht im Mittel. 
- &shy;<!-- .element: class="fragment" data-fragment-index="7" -->Anfragen kommen unregelmäßig; der Dienst muss Lastspitzen aushalten. 

</div></div>

<div class="merk fragment" data-fragment-index="8">

Klären Sie zuerst, ob jemand auf die Antwort wartet. Davon hängt ab, ob Sie auf Durchsatz oder auf Latenz optimieren.

</div>
</div>

## Zwei Phasen: Prefill und Decode

<img src="figs/prefill-decode-zeitachse.png" alt="" style="object-fit: scale-down">


- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Prefill:** alle Prompt-Token parallel durch das Modell schicken, KV-Cache füllen (die gespeicherten Keys und Values aller bisherigen Token, damit der Decode-Schritt nur für das neue Token rechnet), erstes Token ausgeben. **Compute-bound.** 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Decode:** je Schritt ein neues Token pro Anfrage, über Matrix-Vektor-Produkte mit Gewichten und KV-Cache. **Memory-bound** (durch die Speicherbandbreite begrenzt). 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Langer Prompt verlängert Prefill, lange Antwort verlängert Decode. 

<div class="fragment" data-fragment-index="4">

<small>Agrawal et al. 2024, arXiv:2403.02310 · Kwon et al. 2023, arXiv:2309.06180</small>

</div>
</div>

<p class="eyebrow">Teil XII · Serving</p>

## KV-Cache: Speicherbedarf

<div class="fragment" data-fragment-index="1">

$$M\_{KV} = 2 \\cdot L \\cdot h\_{kv} \\cdot d\_{head} \\cdot T \\cdot b$$

</div>

- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->$2$ für Key und Value, $L$ Schichten, $h\_{kv}$ Key/Value-Heads, $d\_{head}$ Breite je Head, $T$ Token im Kontext, $b$ Byte je Wert. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Llama 3 8B:** $L = 32$, $h\_{kv} = 8$, $d\_{head} = 4096 / 32 = 128$, bf16: **128 KiB je Token**, 1 GiB für 8.192 Token. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**OPT-13B** ohne Grouped-Query Attention: 800 KiB je Token, rund 1,6 GiB je Anfrage bei 2.048 Token. 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->Der Cache wächst mit **Kontextlänge × gleichzeitigen Anfragen** und begrenzt meist die Batchgröße. 

<div class="fragment" data-fragment-index="6">

<small>Kwon et al. 2023, arXiv:2309.06180 · Llama Team 2024, arXiv:2407.21783</small>

</div>
</div>

</script></section><section data-separator="?

## PagedAttention

<img src="figs/paged-attention-bloecke.png" alt="" style="object-fit: scale-down">


- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Ältere Systeme reservieren zusammenhängenden Speicher für die maximale Länge; laut Messung waren nur **20,4–38,2 %** davon wirklich belegt. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->PagedAttention teilt den KV-Cache in **Blöcke fester Größe**, eine Blocktabelle verweist auf sie wie die Seitentabelle im Betriebssystem. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Folge: kaum ungenutzter Speicher, und Anfragen mit gleichem Präfix teilen sich Blöcke. 

<div class="fragment" data-fragment-index="4">

<small>Kwon et al. 2023, arXiv:2309.06180</small>

</div>
</div>

<p class="eyebrow">Teil XII · Serving</p>

## Continuous Batching

<img src="figs/continuous-batching.png" alt="" style="object-fit: scale-down">


- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Statisch:** Der Batch läuft, bis die längste Sequenz fertig ist; neue Anfragen warten. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Continuous:** Nach jeder Decode-Iteration verlassen fertige Sequenzen den Batch, wartende rücken nach. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Chunked Prefill:** Lange Prompts werden in Stücke geteilt und mit laufenden Decodes gemischt, damit diese nicht anhalten. 

<div class="fragment" data-fragment-index="4">

<small>Kwon et al. 2023, arXiv:2309.06180 · Agrawal et al. 2024, arXiv:2403.02310</small>

</div>
</div>

<p class="eyebrow">Teil XII · Serving</p>

## Prefix-Caching und Streaming

<div class="two-col"><div style="flex: 50">

**Prefix-Caching**

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->KV-Cache eines gemeinsamen Präfixes wiederverwenden: Systemprompt, langes Dokument, Chatverlauf. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Spart **nur Prefill**, also Zeit bis zum ersten Token, nicht die Zeit pro Token. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->llama-server: `--cache-prompt` (Default an); SGLang: RadixAttention. 

</div><div style="flex: 50">

<div class="fragment" data-fragment-index="4">

**Streaming**

</div>

- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->Token per Server-Sent Events senden, sobald sie entstehen. 
- &shy;<!-- .element: class="fragment" data-fragment-index="6" -->Senkt die **wahrgenommene** Latenz, nicht die Gesamtdauer. 
- &shy;<!-- .element: class="fragment" data-fragment-index="7" -->Erst mit Streaming kann der Client die Zeit bis zum ersten Token messen. 

</div></div>

<div class="fragment" data-fragment-index="8">

<small>vLLM-Doku Automatic Prefix Caching · llama.cpp tools/server/README</small>

</div>
</div>

## Spekulatives Decoding

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Ein kleines **Draft-Modell** schlägt mehrere Token vor, das große Modell prüft sie; jedes angenommene Token spart einen Decode-Schritt des großen Modells. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Der Gewinn hängt an der **Akzeptanzrate**, und die hängt von Modell und Prompt ab. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Varianten in vLLM: n-gram, suffix, EAGLE, DFlash; mlx-lm: `draft_model` mit `num_draft_tokens` (Default 3). 

<div class="fragment" data-fragment-index="4">

```bash
vllm serve meta-llama/Meta-Llama-3-8B-Instruct \
  --speculative-config '{"method": "ngram", "num_speculative_tokens": 5}'
```

</div>

<div class="fragment" data-fragment-index="5">

<small>Leviathan et al. 2023, arXiv:2211.17192 · Chen et al. 2023, arXiv:2302.01318 · vLLM README und Benchmark-Doku · mlx-lm SERVER.md</small>

</div>
</div>

<p class="eyebrow">Teil XII · Serving</p>

## Kennzahlen

| Kennzahl | Definition | Fallstrick |
|---|---|---|
| **TTFT** | Zeit bis zum ersten gestreamten Ausgabetoken | enthält beim Client Netz, Warteschlange und Prefill |
| **ITL** | Zeit zwischen zwei aufeinanderfolgenden gestreamten Ausgaben | weicht von TPOT ab, wenn ein Chunk mehrere Token enthält |
| **TPOT** | $(T\_{E2E} - \\text{TTFT}) / (N\_{out} - 1)$ je Anfrage | Anfragen mit höchstens einem Token: vLLM-Metrik 0, `vllm bench serve` lässt sie weg |
| **Durchsatz** | Token/s, Prompt und Generierung getrennt | eine Zahl ohne "Prefill" oder "Decode" ist nicht interpretierbar |
| **Goodput** | erfolgreiche Anfragen pro Zeit, die alle Grenzen des SLO (Service Level Objective) einhalten | ohne SLO ist es nur Durchsatz |

## Goodput: Durchsatz unter SLO

<div class="fragment" data-fragment-index="1">

$$\\text{Goodput} = \\frac{\\#\\{\\text{Anfragen erfolgreich} \\wedge \\text{TTFT} \\le a \\wedge \\text{TPOT} \\le b\\}}{T\_{\\text{Messung}}}$$

</div>

- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Ein **SLO** legt die Grenzen $a$ und $b$ fest, etwa TTFT ≤ 0,2 s und TPOT ≤ 0,02 s. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Als **Token-Goodput** zählt man die Token der guten Anfragen pro Zeit. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Auditierter Anker: MLPerf Inference, Llama-2-70B im Server-Szenario mit TTFT 2 s und TPOT 200 ms (Runde v5.0). 

<div class="merk fragment" data-fragment-index="5">

Die Kapazität eines Dienstes ist der höchste Goodput unter Ihrem SLO, nicht der höchste Token/s-Wert.

</div>

<div class="fragment" data-fragment-index="6">

<small>kubernetes-sigs/inference-perf docs/goodput.md · MLCommons MLPerf Inference · Zhong et al. 2024, arXiv:2401.09670</small>

</div>
</div>

<p class="eyebrow">Teil XII · Serving</p>

## Concurrency und Queuing

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Concurrency:** Zahl gleichzeitig offener Anfragen. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Closed Loop:** feste Zahl von Clients, jeder schickt nach der Antwort die nächste Anfrage (`vllm bench serve --max-concurrency`). 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Open Loop:** Anfragen kommen mit vorgegebener Rate, unabhängig von den Antworten (`--request-rate`, Poisson-Ankünfte). 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Queuing:** Was über die Plätze der Engine hinausgeht, wartet. llama-server: Slots (`-np`); Ollama: `OLLAMA_NUM_PARALLEL` (Default 1), `OLLAMA_MAX_QUEUE` (Default 512, darüber HTTP 503). 

<div class="hinweis fragment" data-fragment-index="5">

Schätzen Sie vor der Messung: Was passiert mit Durchsatz und TTFT, wenn die Concurrency von 1 auf 8 steigt? Notieren Sie Ihre Erwartung.

</div>

<div class="fragment" data-fragment-index="6">

<small>vLLM-Doku Benchmark CLI · Ollama FAQ · llama.cpp tools/server/README</small>

</div>
</div>

## Ressourcenprofile: GPU, CPU, Apple Silicon

| | GPU (CUDA, ROCm) | CPU (x86) | Apple Silicon |
|---|---|---|---|
| Engpass Decode | Speicherbandbreite der GPU, VRAM für Gewichte + KV-Cache | RAM-Bandbreite | Unified-Memory-Bandbreite (M3 Max: 300 oder 400 GB/s) |
| Engpass Prefill | Rechenleistung, gut parallel | wenige Kerne, langer Prompt wird teuer | GPU-Kerne über Metal |
| Engines | vLLM, SGLang, llama.cpp | llama.cpp, Ollama; vLLM für x86-CPU | mlx-lm, llama.cpp, Ollama, SGLang über MLX; vLLM nur experimentell (CPU-Build aus Quellcode) oder als Community-Plugin für Metal |
| Speicherplan | Gewichte + KV-Cache × Concurrency + Reserve | dasselbe im RAM | Gewichte und Cache teilen sich den Speicher mit dem System |

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Beispiel 8B-Modell in Q4_K_M: **4,58 GiB** Gewichte, dazu je 8.192-Token-Sequenz 1 GiB KV-Cache in 16 Bit.

## OpenAI-kompatible API

<img src="figs/serving-stack.png" alt="" style="object-fit: scale-down">


- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->vLLM, SGLang, llama.cpp und Ollama bieten `/v1/chat/completions`; mlx-lm ist der OpenAI Chat API ähnlich ("similar to").

- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Kompatibel heißt nicht identisch: Bei festen Gewichten verschiebt allein die Engine die Benchmark-Ergebnisse um bis zu **16,6 Prozentpunkte**.

## Code: Server starten

```bash
# CPU, GGUF-Datei: llama.cpp
llama-server -m models/qwen2.5-0.5b-instruct-q4_k_m.gguf \
  -ngl 0 --device none --parallel 8 -c 16384 \
  --metrics --host 127.0.0.1 --port 8080

# GPU, Hugging-Face-Checkpoint: vLLM
vllm serve Qwen/Qwen2.5-0.5B-Instruct \
  --max-model-len 4096 --port 8000
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->`--parallel 8` (kurz `-np 8`) legt acht **Slots** an: Acht Anfragen laufen gleichzeitig, der Rest wartet. `-ngl 0 --device none` hält alles auf der CPU. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->`-c` und `--max-model-len` begrenzen den Kontext und damit den KV-Cache; `-c 16384` verteilt sich auf die Slots, also 2.048 Token je Slot.

<p class="eyebrow">Teil XII · Serving</p>

## Code: Client mit Streaming

```python
import time
from openai import OpenAI

client = OpenAI(base_url="http://localhost:8080/v1", api_key="sk-no-key-required")
t0, ttft = time.perf_counter(), None
stream = client.chat.completions.create(
    model="local", max_tokens=64, stream=True, temperature=0, seed=1,
    stream_options={"include_usage": True},       # Tokenzahl im letzten Chunk
    messages=[{"role": "user", "content": "Was regelt § 433 BGB?"}],
)
for chunk in stream:
    text = chunk.choices[0].delta.content if chunk.choices else None
    if text:
        ttft = ttft or time.perf_counter() - t0
        print(text, end="", flush=True)
print(f"\nTTFT: {ttft:.3f} s")
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->`stream=True` liefert Chunks; der erste Chunk mit Text markiert die **TTFT am Client**. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Für vLLM ändern Sie nur `base_url` auf Port 8000 und `model` auf den Checkpoint-Namen.
</div>

## Zusammenfassung

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Betriebsform zuerst:** Batch auf Durchsatz optimieren, Echtzeit auf TTFT und TPOT im p95. 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Prefill** ist compute-bound, **Decode** memory-bound; der **KV-Cache** wächst mit Kontext × Concurrency. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->PagedAttention, Continuous Batching und Prefix-Caching nutzen Speicher und Rechenleistung besser aus; Streaming macht TTFT sichtbar. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Goodput** zählt nur Anfragen innerhalb des SLO; jede Zahl braucht Werkzeug, Definition und Perzentil. 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->Engines sind über die **OpenAI-kompatible API** austauschbar, ihre Ergebnisse ohne Messung nicht übertragbar.

## Lernziele

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Die **Signale** eines LLM-Dienstes benennen und ihren Quellen zuordnen: Engine-Metriken, Traces, Feedback 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**SLOs mit Fehlerbudget** formulieren und Alarme daraus ableiten 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Prompts und Antworten **datensparsam protokollieren** und eine Anfrage über Retrieval, Modell und Tools verfolgen 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Neue Versionen über **Shadow, Canary oder Blue-Green** einführen und per **A/B-Test mit Signifikanz** vergleichen 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->**Fallbacks** planen und einen **Incident** strukturiert führen und nachbereiten

<p class="eyebrow">Teil XIII · Betrieb</p>

## Was Sie bei einem LLM-Dienst messen

| Signal | Was es zeigt | Woher die Zahl kommt |
|---|---|---|
| **TTFT, TPOT** (p50, p95, p99) | Wartezeit bis zum ersten Token, Tempo danach | Engine-Histogramm oder Client |
| **Fehlerrate** | Anteil fehlgeschlagener Anfragen (HTTP-Fehler, Timeouts) | Gateway, Engine |
| **Token je Anfrage** | Eingabe- und Ausgabetoken, Anteil aus dem Prefix-Cache | Engine-Zähler, Trace |
| **Kosten je Anfrage** | Token mal Preis, im Eigenbetrieb GPU-Kosten/h geteilt durch SLO-konforme Anfragen/h | abgeleitet |
| **Qualitätssignale** | Feedback, Groundedness, Bewertung einer Stichprobe | Trace plus Evaluation |
| **Abbrüche** | Client bricht ab, Antwort stößt an die Längengrenze | Endegrund je Anfrage |

<div class="fragment" data-fragment-index="1">

$$K\_\\text{Anfrage} = n\_\\text{in} \\cdot p\_\\text{in} + n\_\\text{out} \\cdot p\_\\text{out}$$

## Was vLLM und llama-server exportieren

| | vLLM | llama-server (llama.cpp) |
|---|---|---|
| Endpunkt | `/metrics` im Prometheus-Format, Präfix `vllm:` | `/metrics`, nur mit `--metrics` |
| Latenz | Histogramme `time_to_first_token_seconds`, `request_time_per_output_token_seconds`, `e2e_request_latency_seconds` | nur Mittelwerte seit Serverstart in Token/s: `prompt_tokens_seconds`, `predicted_tokens_seconds` |
| Last | `num_requests_running`, `num_requests_waiting`, `kv_cache_usage_perc` | `requests_processing`, `requests_deferred` |
| Token | `prompt_tokens_total`, `generation_tokens_total` | `prompt_tokens_total`, `tokens_predicted_total` |
| Endegrund | `request_success_total{finished_reason=...}` | nicht exportiert |

<div class="merk fragment" data-fragment-index="1">

llama-server liefert **keine Latenzverteilung**. TTFT-Perzentile messen Sie dort am Client oder im Trace, nicht am `/metrics`-Endpunkt.

</div>

## SLOs und Fehlerbudget

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**SLI** (Service Level Indicator) als Verhältnis: gute Ereignisse durch alle Ereignisse, etwa Anfragen mit TTFT unter Schwelle durch alle Anfragen 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**SLO** (Service Level Objective): Zielwert für das SLI über ein Fenster, gestuft für den Long Tail (z. B. 90 % unter X und 99 % unter Y) 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Ein auditierter Anker (Teil XII): MLPerf Inference v5.0, Llama-2-70B im Server-Szenario, **TTFT 2 s** und **TPOT 200 ms** 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Für LLM-Dienste zusätzlich **Qualitäts- und Kosten-SLOs**, z. B. Halluzinationsrate auf einer bewerteten Stichprobe 

<div class="fragment" data-fragment-index="5">

$$\\text{Fehlerbudget} = (1 - \\text{SLO}) \\cdot N \\qquad 99{,}9\\,\\% \\text{ bei } N = 3\\,\\text{Mio.} \\Rightarrow 3.000 \\text{ Fehler in vier Wochen}$$

</div>

<div class="merk fragment" data-fragment-index="6">

Ein Ausfall mit 1.500 Fehlern verbraucht die Hälfte des Budgets. Was bei leerem Budget passiert (Release-Stopp, Arbeit an Zuverlässigkeit), regelt eine **Fehlerbudget-Policy**, die jemand mit Entscheidungsbefugnis unterschreibt.

</div>

<div class="fragment"><small>Google SRE Workbook, Kapitel "Implementing SLOs" · MLCommons MLPerf Inference v5.0</small></div>
</div>

## Alarmregeln aus dem SLO ableiten

```yaml
groups:
  - name: llm-slo
    rules:
      - alert: TTFTp95ZuHoch
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(vllm:time_to_first_token_seconds_bucket[5m]))) > 2
        for: 10m
      - alert: AbbruchquoteHoch
        expr: |
          sum(rate(vllm:request_success_total{finished_reason="abort"}[15m]))
            / sum(rate(vllm:request_success_total[15m])) > 0.05
        for: 15m
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Die Regeln prüfen, was Nutzer spüren (Perzentil der TTFT, Abbrüche), nicht die GPU-Auslastung 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->`for:` verlangt, dass die Bedingung über das ganze Fenster gilt; einzelne Spitzen lösen nichts aus
</div>

## Qualitätssignale im Betrieb

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Explizites Feedback:** Daumen hoch oder runter und Kommentar, je Trace gespeichert 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Bewertete Stichprobe:** Traces ziehen, per LLM-as-Judge und von Menschen bewerten lassen, den LLM-Judge an menschlichen Labels kalibrieren 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Groundedness:** Anteil der Antworten, die sich auf die abgerufenen Quellen stützen; Halluzinationsrate als SLI 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Enthaltungen:** wie häufig das System "steht nicht in den Quellen" antwortet; der Wert steigt oft nach einem Index-Wechsel 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->**Judge-Drift:** Judge-Modell, Judge-Prompt und Version festhalten, sonst wandert die Skala 

<div class="warn fragment" data-fragment-index="6">

Ein **gemittelter Judge-Score** ist kein Freigabekriterium. Für eine Freigabe gilt: keine kritische Sicherheitsregression, Halluzinationsrate unter Schwelle, kein signifikanter Rückgang der Aufgabenerfüllung.

</div>
</div>

</script></section><section data-separator="?

## Logging mit Datenschutz

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Prompt und Antwort enthalten oft **personenbezogene Daten**. Die OpenTelemetry-Konventionen führen Ein- und Ausgabenachrichten deshalb nur als **Opt-In** und warnen vor PII 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Datenminimierung:** nur erfassen, was einem Betriebszweck dient; regelmäßig prüfen, welche Attribute noch nötig sind 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Im Collector filtern:** Prozessoren `attributes`, `filter`, `redaction` (nur erlaubte Attribute durchlassen) und `transform` 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Hashen anonymisiert nicht (Teil II):** Werte mit wenig Entropie lassen sich zurückrechnen, Pseudonymisiertes bleibt personenbezogen (EG 26 DSGVO) 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->**Sampling:** Metadaten (Modell, Token, Dauer, Fehler) für jede Anfrage, Inhalte nur für Fehlerfälle und eine Review-Stichprobe, jeweils mit Löschfrist 
- &shy;<!-- .element: class="fragment" data-fragment-index="6" -->Protokolle nur so lange aufbewahren, wie die DSGVO es erlaubt; das gilt auch für Logging-Pflichten nach KI-VO 

<div class="fragment"><small>OpenTelemetry: "Handling sensitive data" · OpenTelemetry GenAI Semantic Conventions · Verordnung (EU) 2016/679</small></div>
</div>

</script></section><section data-separator="?

## Tracing über Retrieval, Modell und Tools

<img src="figs/xiii-trace-wasserfall.png" alt="" style="object-fit: scale-down">


- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Ein **Trace** je Anfrage, ein **Span** je Schritt, mit Dauer, Token und Fehlerstatus 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**OpenTelemetry GenAI Semantic Conventions:** Operationen `retrieval`, `embeddings`, `chat`, `execute_tool`, `invoke_agent`; Status **Development** 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Zweck: einen Qualitätsrückgang auf eine konkrete Änderung zurückführen (Prompt, Index, Modell)

## Ein Span je Schritt in Python

```python
from openai import OpenAI
from opentelemetry import trace

tracer, client = trace.get_tracer("gesetze-rag"), OpenAI()

with tracer.start_as_current_span("retrieval gesetze-index") as span:
    span.set_attribute("gen_ai.operation.name", "retrieval")
    span.set_attribute("gen_ai.data_source.id", "gesetze-index")
    _, ids = index.search(encoder.encode([question]), 5)       # faiss

with tracer.start_as_current_span(f"chat {MODEL}") as span:
    span.set_attribute("gen_ai.operation.name", "chat")
    span.set_attribute("gen_ai.provider.name", "openai")
    span.set_attribute("gen_ai.request.model", MODEL)
    r = client.chat.completions.create(model=MODEL, messages=messages)
    span.set_attribute("gen_ai.usage.input_tokens", r.usage.prompt_tokens)
    span.set_attribute("gen_ai.usage.output_tokens", r.usage.completion_tokens)
    span.set_attribute("gen_ai.response.finish_reasons", [r.choices[0].finish_reason])
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Der Prompt-Inhalt fehlt mit Absicht: Token, Modell und Endegrund reichen für Betrieb und Kosten
</div>

## Rollouts: Shadow, Canary, Blue-Green

| Variante | Wie | Wofür |
|---|---|---|
| **Shadow** | Kopie des Verkehrs geht auch an die neue Version, ihre Antworten erreichen niemanden | Last, Fehler und Antwortunterschiede ohne Nutzerrisiko messen |
| **Canary** | gewichteter Anteil des Verkehrs, schrittweise erhöht, automatische Prüfung gegen Metriken, Rückrollen bei Verstoß | Wirkung auf echte Nutzer begrenzen |
| **Blue-Green** | zwei vollständige Umgebungen, Umschalten auf einmal | schneller Rückweg, neuer Index hinter festem Alias |

<div class="merk fragment" data-fragment-index="1">

Die Release-Einheit ist die **ganze Konfiguration**: Modellversion, Prompt, Tool-Rechte, Retrieval-Index. Ein neues Embedding-Modell macht alle Vektoren ungültig, also neuer Index und Blue-Green-Umschaltung.

</div>

## A/B-Vergleich mit Signifikanz

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Vorab festlegen:** Hypothese, Randomisierungseinheit (Nutzer, Sitzung), primäre Metrik, Guardrail-Metriken, MDE (Minimum Detectable Effect), Alpha, Power, Laufzeit, Abbruchregel 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Peeking:** Wer beim ersten signifikanten Ergebnis stoppt, macht den klassischen Test ungültig; laufend schauen nur mit sequenziellem Verfahren 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Sample Ratio Mismatch** prüfen: Weicht die Aufteilung vom Plan ab, stimmt Zuweisung oder Logging nicht 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Effekt mit Konfidenzintervall** berichten, der p-Wert allein sagt nichts über die Größe 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->**Paarvergleich per LLM-Judge:** beide Reihenfolgen bewerten, Modellnamen verbergen, Gewinnrate mit Konfidenzintervall 
- &shy;<!-- .element: class="fragment" data-fragment-index="6" -->Eine nicht signifikante Guardrail-Metrik heißt nur dann "kein Schaden", wenn der Test auf eine Nichtunterlegenheitsgrenze ausgelegt ist 

<div class="fragment"><small>Kohavi et al. 2009, Controlled experiments on the web · Johari et al. 2022, Always valid inference · Fabijan et al. 2019 (SRM) · Wang et al. 2023, arXiv:2305.17926</small></div>
</div>

</script></section><section data-separator="?

<p class="eyebrow">Teil XIII · Betrieb</p>

## Fallbacks

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Kleineres Modell oder zweiter Anbieter**, wenn das Hauptmodell nicht antwortet oder das Zeitlimit reißt 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Gateway** vor den Modellservern: Retries mit Backoff, Circuit Breaker, Provider-Fallbacks 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Cache:** gespeicherte Antwort auf eine identische, häufige Anfrage 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**"Weiß nicht":** bei schwachem Retrieval ablehnen und auf die Quelle verweisen, statt zu raten 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->**Budgets und Rate Limits** gegen unbegrenzten Verbrauch: OWASP (Open Worldwide Application Security Project) LLM10:2025 

<div class="merk fragment" data-fragment-index="6">

Jeder Fallback-Pfad bekommt ein **eigenes Label** in Metriken und Traces. Sonst bleibt das Dashboard grün, während Nutzer seit Stunden das kleine Modell bekommen.

</div>
</div>

</script></section><section data-separator="?

<p class="eyebrow">Teil XIII · Betrieb</p>

## Incident-Grundlagen

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Incident früh ausrufen**, wenn ein zweites Team gebraucht wird, Nutzer den Fehler sehen oder eine Stunde konzentrierter Analyse keine Lösung bringt 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Rollen:** Incident Commander, Operations (ändert als einzige das System), Kommunikation, Planung 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Live-Dokument** mit Zustand und Zeitlinie, auf Infrastruktur außerhalb des betroffenen Systems 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**LLM-spezifische Typen:** Halluzinationsspitze, Retrieval-Regression, Tool-Fehler, Prompt-Leck, Judge-Drift, Kostenanomalie, sensible Daten im Log 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->**Runbook je Typ:** Kriterium, Verantwortliche, Gegenmaßnahme (Rückrollen, Fallback schalten, Modell abschalten, Datenschutz-Eskalation) 

<div class="fragment"><small>Google SRE Book, Kapitel 14 "Managing Incidents" · NIST SP 800-61 Rev. 3 (April 2025)</small></div>
</div>

</script></section><section data-separator="?

## Blameless Postmortem

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Auslöser vorab festlegen:** sichtbare Störung über Schwelle, Datenverlust, Rückrollen durch die Rufbereitschaft, Überwachung hat versagt 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Inhalt:** Auswirkung, Zeitlinie, Gegenmaßnahmen, beitragende Ursachen, Folgeaufgaben mit Verantwortlichen 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Blameless:** Ursachen in System und Prozess suchen, nicht bei Personen; alle handelten nach dem Wissen, das sie hatten 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Review:** kein Postmortem ohne Review, Ablage für Trendanalysen 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->Bei LLM-Diensten: auslösende Anfragen und Konfigurationsversion als **Regressionsfälle** in die Evaluationsmenge

</div>

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Signale:** TTFT und TPOT als Perzentile, Fehlerrate, Token und Kosten je Anfrage, Qualität, Abbrüche 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**SLO und Fehlerbudget** steuern Alarme und Release-Entscheidungen

- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->**Fallbacks** sind eigene, sichtbare Pfade; Incidents brauchen Rollen, Runbook und Postmortem

## Lernziele

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Angriffe auf LLM-Systeme einordnen: **Prompt Injection** direkt und indirekt, **Jailbreak**, **Datenabfluss**, **Poisoning und Backdoors** 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Guardrails** als Schichten planen und unterscheiden, was probabilistisch und was deterministisch wirkt 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Datenschutzfragen eines LLM-Dienstes beantworten: Rechtsgrundlage, Auftragsverarbeitung, Drittland, **Löschbarkeit** 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Dokumentationspflichten** nach KI-VO mit Fristen nennen und Model Cards und Data Cards anlegen 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->Offene Verfahren und Entwürfe als offen behandeln

## Angriffsflächen: OWASP Top 10 für LLM-Anwendungen

| Nr. | Risiko | Im LLM-System zum Beispiel |
|---|---|---|
| LLM01 | Prompt Injection | Anweisung im Nutzertext oder im abgerufenen Dokument |
| LLM02 | Sensitive Information Disclosure | Antwort enthält personenbezogene Daten oder Geheimnisse |
| LLM03 | Supply Chain | manipuliertes Modell oder Paket aus fremder Quelle |
| LLM04 | Data and Model Poisoning | präparierte Trainings-, Fine-Tuning- oder Embedding-Daten |
| LLM05 | Improper Output Handling | Modellausgabe ungeprüft in Shell, SQL oder HTML |
| LLM06 | Excessive Agency | Tool mit mehr Rechten als nötig |
| LLM07 | System Prompt Leakage | Inhalt des System-Prompts landet in der Ausgabe |
| LLM08 | Vector and Embedding Weaknesses | Mandanten teilen einen Index, Embedding-Inversion |
| LLM09 | Misinformation | überzeugend formulierte falsche Antwort |
| LLM10 | Unbounded Consumption | Anfragen ohne Token-, Kosten- oder Ratenlimit |

## Prompt Injection: direkt und indirekt

<img src="figs/xiv-injection-pfade.png" alt="" style="object-fit: scale-down">


- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Direkt:** Der Nutzer schreibt die Anweisung selbst ("Ignoriere alle bisherigen Regeln …") 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Indirekt:** Die Anweisung steckt in Inhalten, die das System selbst lädt 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Ursache laut BSI: Text kann **zugleich informieren und anweisen**. Keine bekannte Maßnahme verhindert Injection zuverlässig, ohne die Funktion deutlich einzuschränken 

<div class="fragment"><small>BSI Cybersicherheitswarnung CSW-Nr. 2023-249034-1032 · Greshake et al. 2023, arXiv:2302.12173 · OWASP LLM01:2025</small></div>
</div>

## Jailbreak und Datenabfluss

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Jailbreak:** Sonderform der Injection, die Alignment und Inhaltsfilter umgehen soll; automatisch erzeugte, angehängte Zeichenfolgen ließen sich auf GPT-3.5 und GPT-4 übertragen 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**System-Prompt-Leck** (LLM07): Der System-Prompt ist kein Geheimnis und keine Sicherheitsmaßnahme, also keine Zugangsdaten hineinschreiben 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Abfluss ohne Tool:** Ein Markdown-Bild mit einer URL des Angreifers trägt Inhalte nach außen, sobald der Client das Bild lädt 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Memorisierung** (LLM02): Extraktionsangriffe holen Namen, Telefonnummern und UUIDs aus einzelnen Trainingsdokumenten wieder heraus (Teil II) 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->**Über Mandanten hinweg** (LLM08): Ein gemeinsamer Vektorindex ohne Rechteprüfung liefert fremde Dokumente 

<div class="fragment"><small>Zou et al. 2023, arXiv:2307.15043 · Carlini et al. 2021, arXiv:2012.07805 · OWASP LLM02:2025, LLM07:2025, LLM08:2025</small></div>
